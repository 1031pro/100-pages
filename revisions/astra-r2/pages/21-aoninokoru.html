<canvas id="print" tabindex="0" role="img" aria-label="紙の上に置かれた細かなシダの葉。光をうつしてから葉を外すと、青い紙に白い葉影が残ります。スペースで次の操作、Homeキーでもう一枚に戻ります。"></canvas><header><a href="../../../index.html#study-033">← 百景</a><span class="edition">033 · ASTRA R2</span></header><section><h1>青に残る</h1><p class="verse">葉を持ち去っても、<br>光は、そのかたちを覚えている。</p></section><footer><span class="hint" id="hint">光を、紙にうつす。<br>スペースキーでも。</span><div class="controls"><button id="action">光をうつす</button><button id="reset" class="secondary">もう一枚</button></div></footer><span id="status" role="status" aria-live="polite"></span>
<script>
(()=>{'use strict';const cv=document.querySelector('#print'),c=cv.getContext('2d'),action=document.querySelector('#action'),status=document.querySelector('#status'),hint=document.querySelector('#hint'),rm=matchMedia('(prefers-reduced-motion: reduce)');let W=0,H=0,D=1,S=1,CX=0,CY=0,seed=812,phase=0,exposure=0,lift=0,targetLift=0,frames=0,actions=0,held=false,pointer=null,raf=0,last=0;const PW=800,PH=1056,angle=-.085;const leaf=document.createElement('canvas'),mask=document.createElement('canvas'),paper=document.createElement('canvas'),table=document.createElement('canvas');leaf.width=mask.width=paper.width=PW;leaf.height=mask.height=paper.height=PH;const lc=leaf.getContext('2d'),mc=mask.getContext('2d'),tc=table.getContext('2d'),px=paper.getContext('2d');const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)|0;return(seed>>>0)/4294967296};
function frond(x,y,length,rotation,id){lc.save();lc.translate(x,y);lc.rotate(rotation);let L=length;lc.strokeStyle=id?'#75864d':'#6f7f47';lc.lineWidth=2.3;lc.beginPath();lc.moveTo(0,25);lc.bezierCurveTo(12,-L*.28,-34,-L*.70,-12,-L);lc.stroke();for(let row=1;row<24;row++){let t=(row+(rnd()-.5)*.22)/25,sy=-L*t,sx=-16*Math.sin(t*Math.PI*.9),reach=L*.238*Math.sin(Math.PI*t)**.73*(1-t*.2);for(const side of[-1,1]){let len=reach*(.90+rnd()*.17),theta=side===1?-.37-rnd()*.11:Math.PI+.38+rnd()*.11;lc.save();lc.translate(sx,sy+(side===1?2:-3));lc.rotate(theta);let tooth=6+rnd()*2.8,wide=(6+L*.005)*(1-t*.35);let shape=new Path2D();shape.moveTo(0,0);for(let j=1;j<len/tooth;j++){let a=j*tooth,v=wide*Math.sin(Math.PI*Math.pow(a/len,.68))**.7;shape.lineTo(a-tooth*.53,-v*.28);shape.quadraticCurveTo(a-tooth*.20,-v*.91,a+tooth*.28,-v);shape.lineTo(a+tooth*.23,-v*.36)}shape.lineTo(len,0);for(let j=Math.floor(len/tooth)-1;j>0;j--){let a=j*tooth,v=wide*Math.sin(Math.PI*Math.pow(a/len,.68))**.7;shape.lineTo(a+tooth*.31,v*.37);shape.quadraticCurveTo(a+tooth*.16,v*.99,a-tooth*.24,v*.95);shape.lineTo(a-tooth*.48,v*.26)}shape.closePath();let g=lc.createLinearGradient(0,-wide,0,wide);g.addColorStop(0,id?'#758744':'#7d8a48');g.addColorStop(.47,id?'#526e37':'#466632');g.addColorStop(.54,'#8f9c58');g.addColorStop(1,'#3e592c');lc.fillStyle=g;lc.fill(shape);lc.strokeStyle='#bbc28a75';lc.lineWidth=.55;lc.beginPath();lc.moveTo(0,0);lc.lineTo(len,0);lc.stroke();lc.lineWidth=.32;lc.strokeStyle='#c6c89150';for(let j=1;j<len/tooth-1;j++){let a=j*tooth,v=wide*Math.sin(Math.PI*Math.pow(a/len,.68))**.7;for(let side of[-1,1]){lc.beginPath();lc.moveTo(a-2,0);lc.quadraticCurveTo(a-1,side*v*.45,a+2,side*v*.77);lc.stroke()}}lc.restore()}}lc.restore()}
frond(447,961,777,-.10,0);frond(426,967,548,-.53,1);frond(466,964,555,.43,1);mc.drawImage(leaf,0,0);mc.globalCompositeOperation='source-in';mc.fillStyle='#eee9cc';mc.fillRect(0,0,PW,PH);
px.clearRect(0,0,PW,PH);for(let i=0;i<67000;i++){let x=rnd()*PW,y=rnd()*PH;px.fillStyle=rnd()>.5?'rgba(55,55,36,.065)':'rgba(255,250,227,.10)';px.fillRect(x,y,rnd()*1.1+.25,rnd()*.8+.3)}for(let i=0;i<900;i++){let x=rnd()*PW,y=rnd()*PH;px.strokeStyle='#c8c1a61f';px.lineWidth=.4;px.beginPath();px.moveTo(x,y);px.lineTo(x+2+rnd()*5,y+(rnd()-.5)*2);px.stroke()}
const edge=new Path2D();edge.moveTo(5,4);for(let x=5;x<PW-5;x+=13)edge.lineTo(x,3+rnd()*3);for(let y=4;y<PH-5;y+=13)edge.lineTo(PW-3-rnd()*3,y);for(let x=PW-4;x>5;x-=13)edge.lineTo(x,PH-3-rnd()*3);for(let y=PH-4;y>5;y-=13)edge.lineTo(3+rnd()*3,y);edge.closePath();function mix(a,b,t){return a.map((x,i)=>Math.round(x+(b[i]-x)*t))}
function background(){table.width=Math.round(W*D);table.height=Math.round(H*D);tc.setTransform(D,0,0,D,0,0);let g=tc.createRadialGradient(W*.63,H*.30,0,W*.53,H*.5,W);g.addColorStop(0,'#a5ada2');g.addColorStop(.55,'#79857d');g.addColorStop(1,'#3f5755');tc.fillStyle=g;tc.fillRect(0,0,W,H);seed=124;for(let i=0;i<13000;i++){let x=rnd()*W,y=rnd()*H;tc.fillStyle=rnd()>.5?'#e4e4c707':'#243c3706';tc.fillRect(x,y,.5+rnd()*1.5,.5+rnd()*2)}tc.save();tc.translate(W*.05,H*.1);tc.rotate(-.12);tc.fillStyle='#f1efe113';tc.fillRect(-W*.12,-H*.1,W*.20,H*1.2);tc.strokeStyle='#ede9d710';tc.lineWidth=.5;for(let x=-W*.12;x<W*.08;x+=2.8){tc.beginPath();tc.moveTo(x,-H*.1);tc.lineTo(x,H*1.1);tc.stroke()}tc.restore()}
function draw(){frames++;c.setTransform(D,0,0,D,0,0);c.drawImage(table,0,0,W,H);c.save();c.translate(CX,CY);c.rotate(angle);c.scale(S,S);c.translate(-PW/2,-PH/2);c.save();c.shadowColor='#203d3955';c.shadowBlur=30;c.shadowOffsetX=8;c.shadowOffsetY=17;c.fillStyle='#eee9d8';c.fill(edge);c.restore();c.save();c.clip(edge);c.fillStyle='#eee9d8';c.fillRect(0,0,PW,PH);let t=exposure,ink=c.createLinearGradient(0,PH, PW,0);ink.addColorStop(0,`rgb(${mix([166,177,130],[13,53,92],t)})`);ink.addColorStop(.5,`rgb(${mix([198,202,157],[22,76,119],t)})`);ink.addColorStop(1,`rgb(${mix([174,189,148],[17,63,104],t)})`);c.fillStyle=ink;c.fillRect(28,28,PW-56,PH-83);c.save();c.beginPath();c.rect(28,28,PW-56,PH-83);c.clip();c.globalAlpha=t;c.drawImage(mask,0,0);c.restore();c.drawImage(paper,0,0);c.fillStyle='#6f8075';c.font='12px serif';c.textAlign='left';c.fillText('ある日の、葉影。',39,PH-27);c.textAlign='right';c.font='10px serif';c.fillText('XXXIII',PW-35,PH-28);c.restore();
 c.save();c.translate(lift*1120,-lift*430);c.translate(430,950);c.rotate(lift*.26);c.translate(-430,-950);c.shadowColor=`rgba(22,42,20,${.32-lift*.1})`;c.shadowBlur=2+lift*18;c.shadowOffsetX=1+lift*15;c.shadowOffsetY=2+lift*26;c.drawImage(leaf,0,0);c.restore();c.restore();if(phase===1){let glow=c.createLinearGradient(0,0,W,H);glow.addColorStop(0,`rgba(255,242,190,${Math.sin(exposure*Math.PI)*.13})`);glow.addColorStop(1,'rgba(255,242,190,0)');c.fillStyle=glow;c.fillRect(0,0,W,H)}}
function update(){action.disabled=phase===1||phase===3;action.textContent=phase===0?'光をうつす':phase===1?'光をうつしています':phase===2?'葉をそっと外す':phase===3?'葉を外しています':'もう一度見る';hint.innerHTML=phase<2?'光を、紙にうつす。<br>スペースキーでも。':phase===2?'葉を、右へそっと運ぶ。<br>ボタンでも外せます。':'葉は去って、青に残る。';cv.dataset.ready=String(phase===2);if(phase===2)status.textContent='葉を外すと、光の跡が現れます。';if(phase===4)status.textContent='同じ葉は、もうここにいない。'}
function tick(t){raf=0;const dt=Math.min((t-last)/1000||.016,.10);last=t;if(phase===1){exposure=Math.min(1,exposure+dt/3.4);if(exposure===1){phase=2;status.textContent='葉を外すと、光の跡が現れます。';update()}}if(!held){lift+=(targetLift-lift)*(1-Math.exp(-dt*5.8));if(Math.abs(targetLift-lift)<.0008){lift=targetLift;if(phase===3){phase=4;status.textContent='同じ葉は、もうここにいない。';update()}}}draw();if(phase===1||Math.abs(targetLift-lift)>.0008)raf=requestAnimationFrame(tick)}function start(){if(rm.matches){if(phase===1){exposure=1;phase=2}lift=targetLift;if(phase===3)phase=4;update();draw()}else if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}}
function reset(){phase=0;exposure=lift=targetLift=0;held=false;pointer=null;cancelAnimationFrame(raf);raf=0;actions++;status.textContent='新しい紙に、葉を置きました。';update();draw()}
function next(){actions++;if(phase===0){phase=1;status.textContent='光が、紙の奥にしみていく。';update();start()}else if(phase===2){phase=3;targetLift=1;update();start()}else if(phase===4)reset()}
function resize(){W=document.documentElement.clientWidth;H=document.documentElement.clientHeight;D=Math.min(devicePixelRatio||1,1.7);cv.width=Math.round(W*D);cv.height=Math.round(H*D);S=W/H<.8?Math.min(W*.83/PW,H*.54/PH):Math.min(W*.48/PW,H*.86/PH);CX=W*(W/H<.8?.5:.63);CY=H*(W/H<.8?.55:.51);background();draw()}
cv.addEventListener('pointerdown',e=>{if(phase!==2)return;const dx=(e.clientX-CX)/S,dy=(e.clientY-CY)/S;if(Math.abs(dx)>PW*.55||Math.abs(dy)>PH*.55)return;held=true;pointer={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.focus({preventScroll:true})});cv.addEventListener('pointermove',e=>{if(!held)return;lift=targetLift=Math.max(0,Math.min(1,((e.clientX-pointer.x)+(pointer.y-e.clientY)*.5)/(PW*S*.72)));draw()});function release(){if(!held)return;held=false;pointer=null;actions++;if(lift>.24){phase=3;targetLift=1}else targetLift=0;update();start()}cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);cv.addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='Enter'){e.preventDefault();next()}if(e.key==='Home'){e.preventDefault();reset()}});action.addEventListener('click',next);document.querySelector('#reset').addEventListener('click',reset);rm.addEventListener('change',()=>{if(rm.matches){cancelAnimationFrame(raf);raf=0;start()}});addEventListener('resize',resize);resize();update();window.artworkState=()=>({ready:true,frames,actions,phase,exposure,lift,targetLift,held,reduced:rm.matches,center:[CX,CY],scale:S});})();
