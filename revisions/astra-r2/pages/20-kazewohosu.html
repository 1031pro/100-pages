<style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#9ebcc5;color:#364f55;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#cloth{touch-action:none;cursor:grab}#cloth:active{cursor:grabbing}#pins{pointer-events:none}header{position:fixed;inset:28px 32px auto;display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.14em}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}.edition{font:10px sans-serif;letter-spacing:.16em}section{position:fixed;left:9%;top:23%;pointer-events:none}h1{font-weight:400;font-size:clamp(40px,4.8vw,62px);letter-spacing:.23em;writing-mode:vertical-rl;margin:0}.verse{position:absolute;left:85px;top:3px;writing-mode:vertical-rl;white-space:nowrap;font-size:11px;letter-spacing:.19em;line-height:2.1}footer{position:fixed;inset:auto 32px 28px;display:flex;justify-content:space-between;align-items:end;gap:20px}.hint{font-size:11px;line-height:1.9;letter-spacing:.13em;color:#e8e1c8;text-shadow:0 1px 6px #30433d80}.controls{display:flex;gap:8px}button{border:1px solid #e8ead079;background:#e9ebdfac;border-radius:2px;padding:12px 18px;min-height:46px;color:#425b5c;font:12px serif;letter-spacing:.1em;cursor:pointer}button:hover{background:#f8f6e7}button:disabled{opacity:.65}button:focus-visible,a:focus-visible{outline:2px solid #304d5f;outline-offset:5px}canvas:focus-visible{outline:2px solid #eff2df;outline-offset:-6px}#status{position:fixed;right:34px;bottom:90px;font-size:11px;letter-spacing:.13em;color:#f9edce;text-shadow:0 1px 7px #203b4480}#fallback{display:none;position:fixed;left:35%;top:24%;width:48%;height:55%;background:repeating-linear-gradient(90deg,#f2eddb,#fff9e8 7%,#c7cebf 17%,#f2eddb 27%);border-bottom:8px double #8b9a92;box-shadow:9px 20px 35px #23465720;clip-path:polygon(2% 0,98% 0,100% 95%,86% 97%,74% 99%,63% 97%,49% 100%,33% 97%,14% 98%,0 95%)}@media(max-width:600px){header{inset:23px 22px auto}.edition{font-size:8px}section{left:27px;top:13%}h1{writing-mode:horizontal-tb;font-size:36px}.verse{position:static;writing-mode:horizontal-tb;font-size:10px;line-height:2;letter-spacing:.12em;margin-top:15px}footer{inset:auto 22px 23px;gap:10px}.hint{font-size:10px;max-width:180px}button{padding:11px 13px;font-size:10px}#status{right:24px;bottom:90px;font-size:10px}#fallback{left:12%;top:35%;width:76%;height:42%}}@media(max-height:520px){section{top:24%;left:7%}h1{font-size:32px}.verse{font-size:9px;left:47px}header{top:16px}footer{bottom:15px}.hint{font-size:9px}}</style>
<canvas id="courtyard" aria-hidden="true"></canvas><canvas id="cloth" tabindex="0" role="img" aria-label="風に揺れる白い布。布の裾をドラッグして持ち上げ、離すと重みで戻ります。矢印キーでも布を動かせます。Homeキーで手を離します。"></canvas><div id="fallback" role="img" aria-label="干された白い布の静止画"></div><canvas id="pins" aria-hidden="true"></canvas><header><a href="../../../index.html#study-032">← 百景</a><span class="edition">032 · ASTRA R2</span></header><section><h1>風を干す</h1><p class="verse">洗い立ての白に、<br>まだ名前のない風。</p></section><footer><span class="hint">布の裾を、つまんで離す。<br>矢印キーでも。</span><div class="controls"><button id="release">手を離す</button><button id="pause" aria-label="風を止める">Ⅱ</button></div></footer><span id="status" role="status" aria-live="polite"></span>
<script>
(()=>{'use strict';const cv=document.querySelector('#cloth'),bg=document.querySelector('#courtyard'),bc=bg.getContext('2d'),pins=document.querySelector('#pins'),pc=pins.getContext('2d'),rm=matchMedia('(prefers-reduced-motion: reduce)'),pause=document.querySelector('#pause'),releaseButton=document.querySelector('#release'),status=document.querySelector('#status');let gl=cv.getContext('webgl2',{alpha:true,antialias:true}),W=0,H=0,S=1,CX=0,CY=0,ready=false,time=0,frames=0,actions=0,held=false,pointer=null,paused=rm.matches,raf=0,last=0,tug=[0,0],target=[0,0],grab=[.8,.85],fallback=!gl,seed=20;const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)|0;return(seed>>>0)/4294967296};
const VS=`#version 300 es
precision highp float;in vec2 aUV;uniform vec2 uResolution;uniform vec2 uCenter;uniform float uScale;uniform float uTime;uniform vec2 uTug;uniform vec2 uGrab;out vec2 vUV;out vec3 vNormal;out vec3 vWorld;vec3 cloth(vec2 uv){float u=uv.x,v=uv.y,free=smoothstep(.02,.35,v);float pulse=.17*sin(uTime*1.05-v*2.5)+.065*sin(uTime*2.17-u*4.+v*3.);float wave=sin(u*24.+v*2.3+sin(v*3.+uTime*.4)*.28)*(.04+.09*v)+sin(u*47.+v*1.7)*.012+sin(u*10.-v*3.)*.026;float g=exp(-dot((uv-uGrab)*vec2(2.3,1.7),(uv-uGrab)*vec2(2.3,1.7))*3.)*free;float x=(u-.5)*2.6+free*pulse*v*.55+uTug.x*g;float y=1.6-v*3.1-sin(u*3.14159)*.075+uTug.y*g+free*(.035*sin(u*14.+v*2.-uTime*.9));float z=wave+free*(pulse*v+.065*sin(v*5.+u*3.-uTime*.8))+length(uTug)*g*(.22+.065*sin(length((uv-uGrab)*vec2(2.6,3.1))*21.));return vec3(x,y,z);}void main(){vUV=aUV;vec3 p=cloth(aUV),du=cloth(aUV+vec2(.001,0))-cloth(aUV-vec2(.001,0)),dv=cloth(aUV+vec2(0,.001))-cloth(aUV-vec2(0,.001));vNormal=normalize(cross(dv,du));vWorld=p;vec2 pixel=uCenter+vec2(p.x+p.z*.22,-p.y-p.z*.06)*uScale;gl_Position=vec4(pixel/uResolution*vec2(2.,-2.)+vec2(-1.,1.),-p.z*.1,1.);}`;
const FS=`#version 300 es
precision highp float;in vec2 vUV;in vec3 vNormal;in vec3 vWorld;out vec4 color;uniform float uTime;float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float line(float x,float f){float q=x*f;return 1.-smoothstep(.12,.12+fwidth(q),abs(fract(q)-.5));}void main(){vec3 n=normalize(vNormal);if(n.z<0.)n=-n;vec3 l=normalize(vec3(-.7,.4,1.5)),back=normalize(vec3(-.8,.7,-1.));float lit=max(dot(n,l),0.),trans=pow(max(dot(-n,back),0.),2.);float weave=(line(vUV.x,470.)+line(vUV.y,690.))*.5;float fiber=hash(floor(vUV*vec2(1700,2200)));vec3 linen=vec3(.84,.835,.745)*(1.+(weave-.5)*.06+(fiber-.5)*.034);float edge=min(vUV.x,1.-vUV.x),hem=min(edge,(1.-vUV.y)*.75);float seam=(1.-smoothstep(.006,.018,hem))*.08;linen*=1.-seam;float border=1.-smoothstep(.002,.003,abs(vUV.y-.961));border+=1.-smoothstep(.0007,.0013,abs(vUV.y-.978));border+=.3*(1.-smoothstep(.002,.004,abs(edge-.018)));linen=mix(linen,vec3(.26,.39,.39),min(border,.5)*.48);vec3 shade=linen*(.36+lit*.58)+vec3(1.,.91,.66)*trans*.10;float ridge=pow(max(dot(n,normalize(l+vec3(0,0,1))),0.),48.);shade+=ridge*.025;shade*=1.-.026*sin(vUV.x*24.+sin(vUV.y*3.+uTime*.4)*.28);color=vec4(pow(shade,vec3(.82)),1.);}`;
let prog,loc={},count=0;function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}function setup(){prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,VS));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);for(const n of['uResolution','uCenter','uScale','uTime','uTug','uGrab'])loc[n]=gl.getUniformLocation(prog,n);const a=[],ids=[],nx=80,ny=95;for(let y=0;y<=ny;y++)for(let x=0;x<=nx;x++)a.push(x/nx,y/ny);for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){let i=y*(nx+1)+x;ids.push(i,i+1,i+nx+1,i+1,i+nx+2,i+nx+1)}let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(a),gl.STATIC_DRAW);let attr=gl.getAttribLocation(prog,'aUV');gl.enableVertexAttribArray(attr);gl.vertexAttribPointer(attr,2,gl.FLOAT,false,8,0);b=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(ids),gl.STATIC_DRAW);count=ids.length;gl.enable(gl.DEPTH_TEST)}
function project(x,y,z=0){return[CX+(x+z*.22)*S,CY+(-y-z*.06)*S]}
function background(){const d=Math.min(devicePixelRatio||1,1.7);for(const a of[bg,pins]){a.width=Math.round(W*d);a.height=Math.round(H*d)}bc.setTransform(d,0,0,d,0,0);pc.setTransform(d,0,0,d,0,0);pc.clearRect(0,0,W,H);seed=20;let sky=bc.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#779eac');sky.addColorStop(.65,'#c7d8cd');sky.addColorStop(1,'#ecdec0');bc.fillStyle=sky;bc.fillRect(0,0,W,H);bc.save();bc.filter='blur(9px)';bc.fillStyle='#ececdd35';for(let i=0;i<10;i++){bc.beginPath();bc.ellipse(rnd()*W,H*(.07+rnd()*.27),W*(.12+rnd()*.16),H*.012,-.05,0,7);bc.fill()}
 // Distant houses and a small courtyard sit behind the cloth.
 for(let i=0;i<9;i++){let x=(i/8-.06)*W,y=H*(.58+rnd()*.17),w=W*(.11+rnd()*.055);bc.fillStyle=['#b3b2a0','#bfc5b2','#c9bca3','#afb6a7'][i%4];bc.fillRect(x,y,w,H-y);bc.fillStyle='#928d7980';bc.fillRect(x-3,y,w+6,5);for(let row=0;row<3;row++)for(let col=0;col<3;col++){bc.fillStyle='#60747660';bc.fillRect(x+w*(.18+col*.29),y+H*(.025+row*.07),w*.1,H*.026)}}bc.restore();let floor=bc.createLinearGradient(0,H*.84,0,H);floor.addColorStop(0,'#718d8570');floor.addColorStop(1,'#496a65');bc.fillStyle=floor;bc.fillRect(0,H*.80,W,H*.20);bc.fillStyle='#d7c8a4';bc.fillRect(0,H*.83,W,H*.022);bc.fillStyle='#889384';bc.fillRect(0,H*.852,W,H*.034);bc.strokeStyle='#f1e1be70';bc.lineWidth=1;bc.beginPath();bc.moveTo(0,H*.832);bc.lineTo(W,H*.832);bc.stroke();for(let i=0;i<900;i++){let x=rnd()*W,y=H*(.833+rnd()*.045);bc.fillStyle=rnd()>.5?'#384f4522':'#f6e7c526';bc.fillRect(x,y,.5+rnd()*1.5,.7+rnd()*1.5)}
 // Sun-warmed plaster at the edge gives the line a fixed support.
 let wall=bc.createLinearGradient(W*.94,0,W,0);wall.addColorStop(0,'#b9815d');wall.addColorStop(.1,'#d3a07a');wall.addColorStop(1,'#e3b794');bc.fillStyle=wall;bc.fillRect(W*.955,0,W*.045,H);for(let i=0;i<1600;i++){let x=W*(.955+rnd()*.045),y=rnd()*H;bc.fillStyle=rnd()>.5?'#78472c18':'#fff3d523';bc.fillRect(x,y,rnd()*2+1,rnd()*2+1)}
 let left=project(-1.22,1.62),right=project(1.22,1.62);bc.strokeStyle='#405652a3';bc.lineWidth=1.25;bc.beginPath();bc.moveTo(-10,left[1]-17);bc.quadraticCurveTo(CX,left[1]+8,W,right[1]-13);bc.stroke();bc.strokeStyle='#e5e8d773';bc.lineWidth=.45;bc.stroke();
 for(const [index,q]of[left,right].entries()){pc.save();pc.translate(q[0],q[1]+4);pc.rotate(index?-.09:.08);let wood=pc.createLinearGradient(-4,0,4,0);wood.addColorStop(0,'#a87a43');wood.addColorStop(.5,'#d8b87b');wood.addColorStop(1,'#967047');pc.fillStyle=wood;pc.shadowColor='#52605235';pc.shadowBlur=2;pc.shadowOffsetY=2;pc.fillRect(-4,-14,7,25);pc.shadowBlur=0;pc.strokeStyle='#82644299';pc.lineWidth=.5;pc.beginPath();pc.moveTo(-1,-12);pc.lineTo(-1,9);pc.stroke();pc.strokeStyle='#69716c';pc.lineWidth=1;pc.strokeRect(-4,-2,7,3);pc.restore()}}
function draw(){if(!ready||fallback)return;frames++;gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniform2f(loc.uResolution,W,H);gl.uniform2f(loc.uCenter,CX,CY);gl.uniform1f(loc.uScale,S);gl.uniform1f(loc.uTime,time);gl.uniform2fv(loc.uTug,tug);gl.uniform2fv(loc.uGrab,grab);gl.drawElements(gl.TRIANGLES,count,gl.UNSIGNED_SHORT,0)}
function resize(){W=document.documentElement.clientWidth;H=document.documentElement.clientHeight;S=W/H<.8?Math.min(W*.345,H*.23):Math.min(W*.205,H*.232);CX=W*(W/H<.8?.5:.61);CY=H*(W/H<.8?.55:.53);const d=Math.min(devicePixelRatio||1,1.5,Math.sqrt(950000/(W*H)));cv.width=Math.round(W*d);cv.height=Math.round(H*d);background();draw()}
function tick(t){raf=0;if(document.hidden)return;const dt=Math.min((t-last)/1000||.016,.1);last=t;if(!paused)time+=dt;let decay=1-Math.exp(-dt*(held?18:4.6));tug[0]+=(target[0]-tug[0])*decay;tug[1]+=(target[1]-tug[1])*decay;draw();if(!paused||Math.abs(tug[0]-target[0])+Math.abs(tug[1]-target[1])>.001)raf=requestAnimationFrame(tick)}function start(){if(rm.matches){tug=[...target];draw()}else if(!fallback&&!raf){last=performance.now();raf=requestAnimationFrame(tick)}}
function release(){held=false;pointer=null;target=[0,0];actions++;status.textContent='白い布が、重さを思い出す。';start()}
cv.addEventListener('pointerdown',e=>{let u=(e.clientX-CX)/S/2.6+.5,v=(1.6-(CY-e.clientY)/S)/3.1;if(u<-.05||u>1.05||v<.08||v>1.05||fallback)return;held=true;grab=[Math.max(.04,Math.min(.96,u)),Math.max(.2,Math.min(.97,v))];pointer={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.focus({preventScroll:true});actions++});cv.addEventListener('pointermove',e=>{if(!held)return;target=[Math.max(-.9,Math.min(.9,(e.clientX-pointer.x)/S)),Math.max(-.55,Math.min(1.25,(pointer.y-e.clientY)/S))];start()});cv.addEventListener('pointerup',()=>{if(held)release()});cv.addEventListener('pointercancel',()=>{if(held)release()});cv.addEventListener('keydown',e=>{const map={ArrowLeft:[-.18,0],ArrowRight:[.18,0],ArrowUp:[0,.18],ArrowDown:[0,-.18]};if(map[e.key]&&!fallback){e.preventDefault();grab=[.75,.88];target=[Math.max(-.9,Math.min(.9,target[0]+map[e.key][0])),Math.max(-.55,Math.min(1.25,target[1]+map[e.key][1]))];actions++;start()}if(e.key==='Home'){e.preventDefault();release()}});releaseButton.addEventListener('click',release);function ui(){pause.disabled=rm.matches||fallback;pause.textContent=rm.matches||fallback?'—':paused?'▷':'Ⅱ';pause.setAttribute('aria-label',paused?'風を再開する':'風を止める');if(paused){cancelAnimationFrame(raf);raf=0;draw()}else start()}pause.addEventListener('click',()=>{paused=!paused;ui()});rm.addEventListener('change',()=>{paused=rm.matches;ui()});document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else start()});addEventListener('resize',resize);try{if(gl)setup()}catch(e){fallback=true}if(fallback){cv.hidden=true;document.querySelector('#fallback').style.display='block';releaseButton.disabled=true;status.textContent='この環境では静止画を表示しています。'}ready=true;resize();ui();window.artworkState=()=>({ready,fallback,frames,actions,held,time,paused,reduced:rm.matches,tug:[...tug],target:[...target],grab:[...grab],center:[CX,CY],scale:S,triangles:count/3});})();
</script></html>
