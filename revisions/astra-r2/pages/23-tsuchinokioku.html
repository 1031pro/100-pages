<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#c7c4ad;color:#5a5447;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#vessel{touch-action:none;cursor:ew-resize}header{position:fixed;inset:28px 32px auto;display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.12em}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}.edition{font:10px sans-serif;letter-spacing:.16em}section{position:fixed;left:9%;top:22%;pointer-events:none}h1{writing-mode:vertical-rl;font-size:clamp(39px,4.6vw,61px);font-weight:400;letter-spacing:.24em;margin:0}.verse{position:absolute;left:84px;top:3px;writing-mode:vertical-rl;white-space:nowrap;font-size:11px;line-height:2.1;letter-spacing:.17em}footer{position:fixed;inset:auto 32px 28px;display:flex;justify-content:space-between;align-items:end;gap:20px}.hint{font-size:11px;line-height:1.9;letter-spacing:.12em;color:#f0e8ca;text-shadow:0 1px 6px #4a4c3b80}.controls{display:flex;gap:8px}button{min-height:46px;padding:12px 18px;background:#dddac5cc;border:1px solid #d7d5b78c;border-radius:2px;color:#56583f;font:12px serif;letter-spacing:.11em;cursor:pointer}button:hover{background:#efe9cd}button:disabled{opacity:.6}a:focus-visible,button:focus-visible{outline:2px solid #685c3a;outline-offset:5px}canvas:focus-visible{outline:2px solid #e9dfb9;outline-offset:-6px}#status{position:fixed;right:34px;bottom:91px;font-size:11px;letter-spacing:.11em;color:#ede2bc;text-shadow:0 1px 6px #4b4c37}#fallback svg{width:100%;height:100%}#fallback{display:none;position:fixed;left:45%;top:28%;width:30%;height:43%;background:none}@media(max-width:600px){header{inset:23px 22px auto}.edition{font-size:8px}section{left:27px;top:13%}h1{writing-mode:horizontal-tb;font-size:36px}.verse{position:static;writing-mode:horizontal-tb;font-size:10px;line-height:1.9;margin-top:14px;letter-spacing:.1 <canvas id="bench" aria-hidden="true"></canvas><canvas id="vessel" tabindex="0" role="img" aria-label="轆轤の上で回る赤い土の器。器の縁や胴を左右に引くと形が変わります。上下の矢印キーで触れる高さを選び、左右で広げたり絞ったりできます。Homeキーで最初の形へ戻ります。"></canvas><div id="fallback" role="img" aria-label="赤土の器の静止画"><svg viewBox="0 0 360 560"><defs><linearGradient id="clay"><stop stop-color="#8e624b"/><stop offset=".35" stop-color="#bc8d6e"/><stop offset=".72" stop-color="#aa7657"/><stop offset="1" stop-color="#76513e"/></linearGradient></defs><path d="M87 60C97 119 109 167 61 260C15 357 34 416 81 515Q180 545 279 515C326 416 345 357 299 260C251 167 263 119 273 60Z" fill="url(#clay)"/><ellipse cx="180" cy="60" rx="94" ry="29" fill="#6c4836"/><ellipse cx="180" cy="59" rx="88" ry="24" fill="#986e53"/><path d="M90 61C113 99 248 99 270 61" fill="none" stroke="#c49b79" stroke-width="4"/></svg></div><header><a href="../../../index.html#study-035">← 百景</a><span class="edition">035 · ASTRA R2</span></header><section><h1>土の記憶</h1><p class="verse">触れたところだけ、<br>土は、少し違う形になる。</p></section><footer><span class="hint">縁や胴を、左右にそっと引く。<br>上下で高さ、左右で形。</span><div class="controls"><button id="reset">土を戻す</button><button id="pause" aria-label="轆轤を止める">Ⅱ</button></div></footer><span id="status" role="status" aria-live="polite"></span>
<script>
(()=>{'use strict';const cv=document.querySelector('#vessel'),bg=document.querySelector('#bench'),bc=bg.getContext('2d'),pause=document.querySelector('#pause'),reset=document.querySelector('#reset'),status=document.querySelector('#status'),rm=matchMedia('(prefers-reduced-motion: reduce)');let gl=cv.getContext('webgl2',{alpha:true,antialias:true}),fallback=!gl,fallbackReason="",W=0,H=0,S=1,CX=0,CY=0,time=0,frames=0,actions=0,selected=.67,held=false,pointer=null,paused=rm.matches,raf=0,last=0,seed=237;const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)|0;return(seed>>>0)/4294967296};const N=34,original=Array.from({length:N},(_,i)=>{let t=i/(N-1);return .57+.38*Math.exp(-(((t-.4)/.28)**2))+.09*Math.exp(-(((t-.98)/.07)**2))});let profile=[...original];let prog,loc={},buffer,count=0,indexBuffer;
const VS=`#version 300 es
precision highp float;in vec3 aPosition;in vec3 aNormal;in vec2 aUV;uniform float uTurn;uniform float uScale;uniform vec2 uCenter;uniform vec2 uResolution;out vec3 vNormal;out vec3 vPosition;out vec2 vUV;void main(){float c=cos(uTurn),s=sin(uTurn);mat3 turn=mat3(c,0.,-s,0.,1.,0.,s,0.,c);float a=.23;mat3 tilt=mat3(1.,0.,0.,0.,cos(a),sin(a),0.,-sin(a),cos(a));vec3 p=tilt*turn*aPosition;vNormal=tilt*turn*aNormal;vPosition=p;vUV=aUV;vec2 xy=uCenter+vec2(p.x,-p.y)*uScale;gl_Position=vec4(xy/uResolution*vec2(2.,-2.)+vec2(-1.,1.),-p.z*.15,1.);}`;
const FS=`#version 300 es
precision highp float;in vec3 vNormal;in vec3 vPosition;in vec2 vUV;out vec4 color;float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}void main(){vec3 n=normalize(vNormal);if(!gl_FrontFacing)n=-n;vec3 l=normalize(vec3(-.7,.9,1.7)),v=vec3(0,0,1);float grain=hash(floor(vUV*vec2(1400.,2100.))),clayPatch=.5+.5*sin(vUV.x*73.+sin(vUV.y*28.)*2.);vec3 clay=mix(vec3(.40,.215,.14),vec3(.62,.35,.23),clayPatch*.09+.42);clay*=.94+grain*.09;float diffuse=max(dot(n,l),0.),fill=max(dot(n,normalize(vec3(1.,-.2,.6))),0.);vec3 shade=clay*(.25+.74*diffuse+.10*fill);float wet=pow(max(dot(n,normalize(l+v)),0.),65.);shade+=vec3(.94,.81,.57)*wet*(.07+.10*pow(vUV.y,3.));shade*=.95+.05*smoothstep(-1.25,-.95,vPosition.y);color=vec4(pow(shade,vec3(.55)),1.);}`;
function shader(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}function radius(t){const z=Math.max(0,Math.min(1,t))*(N-1),i=Math.floor(z),f=z-i;let a=profile[Math.max(0,i-1)],b=profile[i],c=profile[Math.min(N-1,i+1)],d=profile[Math.min(N-1,i+2)];return b+.5*f*(c-a+f*(2*a-5*b+4*c-d+f*(3*(b-c)+d-a)))}
function buildMesh(){if(fallback)return;const data=[],ids=[],rows=140,cols=64;for(let inner=0;inner<2;inner++){const base=data.length/8;for(let j=0;j<=rows;j++)for(let i=0;i<=cols;i++){let t=j/rows,u=i/cols,a=u*Math.PI*2,r=radius(t)-(inner?.065:0),groove=.00045*Math.sin(t*340+Math.sin(a*3)*.15);r+=groove;let dr=(radius(t+.0005)-radius(t-.0005))/.001+.153*Math.cos(t*340+Math.sin(a*3)*.15),ny=-dr/2.6,len=Math.hypot(1,ny),sg=inner?-1:1;data.push(r*Math.cos(a),(t-.5)*2.6,r*Math.sin(a),sg*Math.cos(a)/len,sg*ny/len,sg*Math.sin(a)/len,u,t)}for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){let a=base+j*(cols+1)+i,b=a+cols+1;if(inner)ids.push(a,a+1,b,a+1,b+1,b);else ids.push(a,b,a+1,a+1,b,b+1)}}
 const base=data.length/8;for(let i=0;i<=cols;i++){let a=i/cols*Math.PI*2;for(let k=0;k<5;k++){let q=k/4*Math.PI,r=radius(1)-.0325+.0325*Math.cos(q),y=1.3+.0325*Math.sin(q);data.push(r*Math.cos(a),y,r*Math.sin(a),Math.cos(q)*Math.cos(a),Math.sin(q),Math.cos(q)*Math.sin(a),i/cols,1)}}for(let i=0;i<cols;i++)for(let j=0;j<4;j++){let a=base+i*5+j;ids.push(a,a+1,a+5,a+1,a+6,a+5)}
 // A recessed interior floor closes the vessel and keeps the wheel out of the opening.
 const floor=data.length/8;data.push(0,-1.23,0,0,1,0,.5,.035);for(let i=0;i<=cols;i++){let a=i/cols*Math.PI*2,r=radius(.027)-.063;data.push(r*Math.cos(a),-1.23,r*Math.sin(a),0,1,0,i/cols,.03)}for(let i=0;i<cols;i++)ids.push(floor,floor+i+2,floor+i+1);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.DYNAMIC_DRAW);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,indexBuffer);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(ids),gl.DYNAMIC_DRAW);count=ids.length}
function setup(){prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,VS));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);for(const n of['uTurn','uScale','uCenter','uResolution'])loc[n]=gl.getUniformLocation(prog,n);buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);for(const[n,size,offset]of[['aPosition',3,0],['aNormal',3,12],['aUV',2,24]]){let a=gl.getAttribLocation(prog,n);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,size,gl.FLOAT,false,32,offset)}indexBuffer=gl.createBuffer();gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);buildMesh()}
function background(){let d=Math.min(devicePixelRatio||1,1.5);bg.width=W*d;bg.height=H*d;bc.setTransform(d,0,0,d,0,0);let g=bc.createLinearGradient(0,0,W,H);g.addColorStop(0,'#ded6bb');g.addColorStop(.55,'#b6bca9');g.addColorStop(1,'#7b8a7a');bc.fillStyle=g;bc.fillRect(0,0,W,H);let y=CY+1.3*Math.cos(.23)*S;bc.save();bc.translate(CX,y+S*.07);bc.scale(1,.31);bc.fillStyle='#34473d33';bc.filter='blur(17px)';bc.beginPath();bc.ellipse(S*.13,S*.22,S*1.85,S*1.55,0,0,7);bc.fill();bc.restore();bc.save();bc.translate(CX,y+S*.10);let side=bc.createLinearGradient(0,-S*.36,0,S*.45);side.addColorStop(0,'#69786c');side.addColorStop(.5,'#6a796b');side.addColorStop(1,'#3b514a');bc.fillStyle=side;bc.beginPath();bc.ellipse(0,0,S*1.7,S*.40,0,0,7);bc.fill();bc.translate(0,-S*.12);let plate=bc.createRadialGradient(-S*.35,-S*.22,0,0,0,S*1.75);plate.addColorStop(0,'#a7afa0');plate.addColorStop(.8,'#7c8e81');plate.addColorStop(1,'#657b70');bc.fillStyle=plate;bc.beginPath();bc.ellipse(0,0,S*1.7,S*.40,0,0,7);bc.fill();bc.save();bc.scale(1,.235);for(let j=0;j<45;j++){bc.strokeStyle=j%3?'#c4c8b92b':'#3e5d4b2b';bc.lineWidth=.4;bc.beginPath();bc.arc(0,0,S*(.5+j*.026),0,7);bc.stroke()}seed=932;for(let i=0;i<850;i++){let a=rnd()*7,r=S*(.65+rnd()*.95);bc.fillStyle=rnd()>.45?'#c69c6a44':'#79513955';bc.beginPath();bc.ellipse(Math.cos(a)*r,Math.sin(a)*r,1+rnd()*3,.7+rnd()*2,a,0,7);bc.fill()}bc.restore();bc.restore();
 // A thin wooden rib rests beside the wheel.
 if(W/H>.8){bc.save();bc.translate(W*.22,H*.76);bc.rotate(-.43);bc.shadowColor='#4d5d4736';bc.shadowBlur=8;bc.shadowOffsetY=7;let wood=bc.createLinearGradient(0,0,0,30);wood.addColorStop(0,'#c2a36c');wood.addColorStop(.5,'#ddc295');wood.addColorStop(1,'#a3885a');bc.fillStyle=wood;bc.beginPath();bc.moveTo(-S*.36,0);bc.quadraticCurveTo(0,-S*.13,S*.48,0);bc.lineTo(S*.42,S*.08);bc.quadraticCurveTo(0,S*.12,-S*.35,S*.07);bc.closePath();bc.fill();bc.shadowBlur=0;bc.strokeStyle='#80663c3a';bc.lineWidth=.4;for(let j=0;j<7;j++){bc.beginPath();bc.moveTo(-S*.27,j*1.8);bc.quadraticCurveTo(0,j*1.4-2,S*.36,j*2);bc.stroke()}bc.restore()}}
function draw(){if(fallback)return;frames++;gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniform1f(loc.uTurn,time*.42);gl.uniform1f(loc.uScale,S);gl.uniform2f(loc.uCenter,CX,CY);gl.uniform2f(loc.uResolution,W,H);gl.drawElements(gl.TRIANGLES,count,gl.UNSIGNED_INT,0)}function resize(){W=document.documentElement.clientWidth;H=document.documentElement.clientHeight;S=W/H<.8?Math.min(W*.34,H*.185):Math.min(W*.20,H*.24);CX=W*(W/H<.8?.51:.65);CY=H*(W/H<.8?.52:.46);let d=Math.min(devicePixelRatio||1,1.35,Math.sqrt(800000/(W*H)));cv.width=W*d;cv.height=H*d;background();if(fallback){const f=document.querySelector("#fallback");Object.assign(f.style,{left:(CX-S*1.15)+"px",top:(CY-S*1.3)+"px",width:(S*2.3)+"px",height:(S*2.75)+"px"})}draw()}
function edit(center,amount,base=profile){for(let i=0;i<N;i++){let t=i/(N-1),weight=Math.exp(-(((t-center)/.15)**2))*Math.min(1,t/.12);profile[i]=Math.max(.32,Math.min(1.18,base[i]+amount*weight))}actions++;buildMesh();draw();status.textContent=center>.8?'口もとに、指の跡。':center>.5?'肩に、指の跡。':'胴に、指の跡。'}function tick(t){raf=0;if(paused||document.hidden)return;time+=Math.min((t-last)/1000||.016,.12);last=t;draw();raf=requestAnimationFrame(tick)}function start(){if(!paused&&!fallback&&!raf){last=performance.now();raf=requestAnimationFrame(tick)}}function ui(){pause.disabled=rm.matches||fallback;pause.textContent=rm.matches||fallback?'—':paused?'▷':'Ⅱ';pause.setAttribute('aria-label',paused?'轆轤を回す':'轆轤を止める');if(paused){cancelAnimationFrame(raf);raf=0}else start()}
cv.addEventListener('pointerdown',e=>{let dx=(e.clientX-CX)/S,v=(1.3+(CY-e.clientY)/S/Math.cos(.23))/2.6;if(fallback||v<.07||v>1.05||Math.abs(dx)>1.25)return;held=true;selected=Math.max(.09,Math.min(.99,v));pointer={x:e.clientX,side:dx<0?-1:1,base:[...profile]};cv.setPointerCapture(e.pointerId);cv.focus({preventScroll:true})});cv.addEventListener('pointermove',e=>{if(!held)return;edit(selected,(e.clientX-pointer.x)/S*pointer.side*.55,pointer.base)});cv.addEventListener('pointerup',()=>{held=false;pointer=null});cv.addEventListener('pointercancel',()=>{held=false;pointer=null});cv.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)&&!fallback){e.preventDefault();if(e.key==='ArrowUp'||e.key==='ArrowDown'){selected=Math.max(.12,Math.min(.97,selected+(e.key==='ArrowUp'?.12:-.12)));status.textContent=selected>.8?'口もとを選びました。':selected>.5?'肩を選びました。':'胴を選びました。'}else edit(selected,e.key==='ArrowRight'?.06:-.06)}if(e.key==='Home'){e.preventDefault();reset.click()}});reset.addEventListener('click',()=>{profile=[...original];actions++;buildMesh();draw();status.textContent='土は、もう一度やわらかく。'});pause.addEventListener('click',()=>{paused=!paused;ui()});rm.addEventListener('change',()=>{paused=rm.matches;ui()});document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else start()});addEventListener('resize',resize);try{if(gl)setup()}catch(e){fallback=true;fallbackReason=String(e)}if(fallback){cv.hidden=true;document.querySelector('#fallback').style.display='block';reset.disabled=true;status.textContent='この環境では静止画を表示しています。'}resize();ui();window.artworkState=()=>({ready:true,fallback,fallbackReason,frames,actions,held,selected,paused,reduced:rm.matches,profile:[...profile],center:[CX,CY],scale:S,triangles:count/3});})();
</script></html>
