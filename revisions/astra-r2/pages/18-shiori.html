<div class="table-surface" aria-hidden="true"><svg viewBox="0 0 1440 1000" preserveAspectRatio="none" id="woodgrain"></svg></div><header><a href="../../../index.html#study-030">← 百景</a><span class="edition">030 · ASTRA R2</span></header><h1>栞の森</h1><p class="lede">閉じていたページのあいだに、<br>小さな森が眠っていた。</p><div class="scene" id="scene" tabindex="0" role="img" aria-label="古い緑の本。左右にドラッグすると本が開閉し、紙の森と小鹿が立ち上がります。左右の矢印キーとスペースでも操作できます。"><div class="object" id="book"><div class="book-shadow"></div><div class="spine"></div><div class="leaf right"><div class="cover"></div><div class="block"></div><div class="page"><span class="booktitle">栞の森</span><span class="folio">三〇</span></div></div><div class="leaf left"><div class="cover"></div><div class="block"></div><div class="page"><div class="smallprint">ある日、開かれなかった本のなかで、<br>森は静かに季節をかえていた。</div><span class="folio">二九</span></div><div class="back"><div>栞の森</div><small>A SMALL FOREST BETWEEN PAGES</small></div></div><div class="ribbon"></div><div class="path"><svg viewBox="0 0 560 390"><path d="M340 353C328 310 364 278 320 254S263 205 299 170S376 146 356 81" fill="none" stroke="#cbbd91" stroke-width="20" opacity=".34"/><path d="M338 349C334 306 362 282 320 254S264 207 299 170" fill="none" stroke="#a3ab74" stroke-width=".7" stroke-dasharray="2 4" opacity=".5"/></svg></div><div id="forest"></div><div class="popup deer"><svg viewBox="0 0 110 145"><defs><linearGradient id="deer" x2=".8" y2="1"><stop stop-color="#d8b981"/><stop offset="1" stop-color="#aa7950"/></linearGradient></defs><path d="M28 73Q15 77 14 91L10 92L8 86L3 83L4 79L14 83Q22 60 44 65L62 70L68 37L70 28L65 15L69 10L78 28L90 26L101 13L105 19L99 33L107 45L102 52L88 49L80 80L79 103L70 126L65 126L67 102L57 89L39 92L31 123L26 123L26 97L23 89Z" fill="url(#deer)" stroke="#e1ccaa" stroke-width=".6"/><path d="M78 31L80 42M84 52L76 72M35 88L63 84" stroke="#987651" stroke-width=".65" fill="none"/><circle cx="95" cy="39" r="1.2" fill="#604d34"/><g fill="#efe0b0"><ellipse cx="30" cy="73" rx="1.5 <script>
(()=>{'use strict';const scene=document.querySelector('#scene'),book=document.querySelector('#book'),forest=document.querySelector('#forest'),toggle=document.querySelector('#toggle'),status=document.querySelector('#status'),rm=matchMedia('(prefers-reduced-motion: reduce)');let open=.88,target=.88,velocity=0,held=false,pointer=null,raf=0,last=0,frames=0,actions=0,seed=318;const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)|0;return(seed>>>0)/4294967296};
function tree(id,height,palette){let s=`<svg viewBox="0 0 190 290" aria-hidden="true"><defs><linearGradient id="leaf${id}" x2=".9" y2="1"><stop stop-color="${palette[0]}"/><stop offset=".6" stop-color="${palette[1]}"/><stop offset="1" stop-color="${palette[2]}"/></linearGradient><linearGradient id="bark${id}"><stop stop-color="#b4ac80"/><stop offset=".5" stop-color="#8a9267"/><stop offset="1" stop-color="#697b57"/></linearGradient></defs><path d="M87 286Q96 218 91 140L99 68L105 73Q96 154 104 209L111 286Z" fill="url(#bark${id})" stroke="#dce0b5" stroke-width=".5"/>`;for(let b=0;b<14;b++){const side=b%2?1:-1,y=75+b*12,x=98+(rnd()-.5)*7,endx=x+side*(23+rnd()*43),endy=y-12-rnd()*32;s+=`<path d="M99 ${y+20} Q${x+side*20} ${y} ${endx} ${endy}" fill="none" stroke="${palette[2]}" stroke-width="${1.4-b*.045}"/>`;for(let j=0;j<7;j++){const t=j/6,lx=x+(endx-x)*t+(rnd()-.5)*15,ly=y+10+(endy-y-10)*t+(rnd()-.5)*10,angle=side*(20+rnd()*85),size=8+rnd()*12;s+=`<g transform="translate(${lx} ${ly}) rotate(${angle})"><path d="M0 0Q${-size*.7} ${-size*.5} 0 ${-size*1.6}Q${size*.6} ${-size*.55} 0 0Z" fill="url(#leaf${id})" stroke="#e4e8bb" stroke-opacity=".45" stroke-width=".4"/><path d="M0 0L0 ${-size*1.35}" stroke="${palette[2]}" stroke-width=".32" opacity=".5"/></g>`}}for(let i=0;i<4;i++){const y=59+i*15;s+=`<path d="M99 ${y+7}Q78 ${y} 94 ${y-21}Q109 ${y-13} 99 ${y+7}Z" fill="url(#leaf${id})" stroke="#dbe0b8" stroke-width=".4"/>`}return s+'</svg>'}
const specs=[{x:224,y:18,w:157,h:255,c:['#c1d1a2','#97ad7e','#70865d']},{x:329,y:44,w:151,h:229,c:['#c6d3ad','#9fb787','#6b8b61']},{x:139,y:62,w:141,h:243,c:['#b7c596','#82976c','#62764f']},{x:264,y:82,w:106,h:174,c:['#d8d4a1','#aeb882','#7d915f']},{x:414,y:109,w:92,h:182,c:['#b0c8a0','#7d9a77','#567a5d']},{x:161,y:171,w:91,h:150,c:['#d0d2a3','#a6b383','#7b905c']}];specs.forEach((s,i)=>{const sh=document.createElement('div');sh.className='foldshadow';sh.style.left=(s.x-30)+'px';sh.style.top=(s.y+s.h-55)+'px';book.insertBefore(sh,forest);const el=document.createElement('div');el.className='popup';el.style.cssText=`left:calc(${s.x}px + (1 - var(--open))*${Math.max(0,330-s.x)}px);top:${s.y}px;width:${s.w}px;height:${s.h}px`;el.innerHTML=tree(i,s.h,s.c);forest.appendChild(el)});
const wood=document.querySelector('#woodgrain');for(let i=0;i<150;i++){const y=i*8-100;let path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M-100 ${y}C${350+rnd()*100} ${y+40+rnd()*50} ${760+rnd()*200} ${y-60-rnd()*50} 1560 ${y+130}`);path.setAttribute('fill','none');path.setAttribute('stroke',i%4?'#553b2c':'#edc19a');path.setAttribute('stroke-width',(.18+rnd()*.55).toFixed(2));wood.appendChild(path)}
function draw(){frames++;book.style.setProperty('--open',open.toFixed(5));toggle.textContent=target>.5?'本を閉じる':'本を開く';scene.setAttribute('aria-label',`古い緑の本。${open>.65?'紙の森と小鹿が立ち上がっています。':'本が閉じかけています。'}左右にドラッグ、または矢印キー・スペースで開閉できます。`)}function tick(t){raf=0;const dt=Math.min((t-last)/1000||.016,.033);last=t;velocity+=(target-open)*dt*50;velocity*=Math.exp(-dt*11);open+=velocity*dt;open=Math.max(0,Math.min(1,open));draw();if(Math.abs(target-open)>.0003||Math.abs(velocity)>.0005)raf=requestAnimationFrame(tick);else{open=target;draw()}}function move(value){target=Math.max(0,Math.min(1,value));actions++;if(rm.matches){open=target;velocity=0;draw()}else if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}}
function resize(){const vw=document.documentElement.clientWidth,vh=document.documentElement.clientHeight;const scale=Math.min(vw/(vw<600?710:740),vh/680,1.55);book.style.setProperty('--scale',scale.toFixed(4));draw()}scene.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;e.preventDefault();held=true;pointer={id:e.pointerId,x:e.clientX,start:open};velocity=0;cancelAnimationFrame(raf);raf=0;scene.setPointerCapture(e.pointerId);scene.focus({preventScroll:true})});scene.addEventListener('pointermove',e=>{if(!held||e.pointerId!==pointer.id)return;e.preventDefault();open=Math.min(1,Math.max(0,pointer.start+(e.clientX-pointer.x)/Math.min(innerWidth*.55,400)));target=open;actions++;draw()});function release(e){if(!held||e.pointerId!==pointer.id)return;held=false;pointer=null;if(scene.hasPointerCapture(e.pointerId))scene.releasePointerCapture(e.pointerId);move(open>.5?1:0);status.textContent=open>.5?'ページの向こうで、小鹿が待っている。':'森は、また本のなかへ。'}scene.addEventListener('pointerup',release);scene.addEventListener('pointercancel',release);scene.addEventListener('lostpointercapture',release);scene.addEventListener('selectstart',e=>e.preventDefault());scene.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();move(target+(e.key==='ArrowRight'?.12:-.12))}if(e.code==='Space'||e.key==='Enter'){e.preventDefault();toggle.click()}});toggle.addEventListener('click',()=>{move(target>.5?0:1);status.textContent=target>.5?'ページの向こうで、小鹿が待っている。':'森は、また本のなかへ。'});rm.addEventListener('change',()=>{if(rm.matches){cancelAnimationFrame(raf);raf=0;open=target;velocity=0;draw()}});addEventListener('resize',resize);resize();window.artworkState=()=>({ready:true,frames,open,target,held,actions,reduced:rm.matches,trees:specs.length});
})();
