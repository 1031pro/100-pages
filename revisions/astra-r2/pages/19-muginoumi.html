<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>麦の海 — 百景 031 / Astra R2</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{color:#5c5339;background:#dfd5ad;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:default}header{position:fixed;inset:28px 32px auto;display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.14em}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}.edition{font:10px sans-serif;letter-spacing:.16em}h1{position:fixed;top:12%;left:9%;font-size:clamp(40px,5vw,67px);font-weight:400;letter-spacing:.25em;margin:0}.line{position:fixed;left:9.3%;top:23%;font-size:11px;line-height:2;letter-spacing:.15em}footer{position:fixed;inset:auto 32px 29px;display:flex;justify-content:space-between;gap:20px;align-items:end}.hint{font-size:11px;line-height:1.9;letter-spacing:.13em;color:#fff2ca;text-shadow:0 1px 8px #655422}.buttons{display:flex;gap:8px}button{min-height:46px;border:1px solid #e2cd9870;border-radius:2px;background:#5a55334d;color:#fff3d0;padding:12px 19px;font:12px serif;letter-spacing:.12em;cursor:pointer;backdrop-filter:blur(7px)}button:hover{background:#6a5b3b99}button:disabled{opacity:.65;cursor:default}a:focus-visible,button:focus-visible{outline:2px solid #766131;outline-offset:5px}canvas:focus-visible{outline:2px solid #d9bf73;outline-offset:-6px}#status{position:fixed;right:34px;bottom:91px;color:#fff2ca;font-size:11px;letter-spacing:.1em;text-shadow:0 1px 6px #66582f}@media(max-width:600px){header{inset:23px 22px auto}.edition{font-size:8px}h1{left:27px;top:13%;font-size:43px}.line{left:29px;top:22%;font-size:10px}footer{inset:auto 22px 23px;gap:10px;align-items:end}.hint{max-width:145px;font-size:10px}.buttons{gap:5px}button{padding:11px 12px;font-size:10px}#status{right:23px;bottom:90px;font-size:10px}}@media(max-height:520px){h1{top:17%;font-size:34px}.line{top:33%;font-size:9px}header{top:16px}footer{bottom:15px}.hint{font-size:9px}}</style>
<canvas id="field" tabindex="0" role="img" aria-label="夕方の麦畑。麦の上を指でなでると風が伝わります。左右の矢印キー、または風を送るボタンでも操作できます。"></canvas><header><a href="../../../index.html#study-031">← 百景</a><span class="edition">031 · ASTRA R2</span></header><h1>麦の海</h1><p class="line">風のかたちは、見えない。<br>通り過ぎたあとに、わかる。</p><footer><span class="hint">穂の上を、なでる。<br>左右の矢印キーでも。</span><div class="buttons"><button id="gust">風を送る</button><button id="pause" aria-label="風の動きを止める">Ⅱ</button></div></footer><span id="status" role="status" aria-live="polite"></span>
<script>
(()=>{'use strict';const cv=document.querySelector('#field'),c=cv.getContext('2d'),rm=matchMedia('(prefers-reduced-motion: reduce)'),pause=document.querySelector('#pause'),status=document.querySelector('#status');const bg=document.createElement('canvas'),bc=bg.getContext('2d');let W=0,H=0,D=1,seed=1197,plants=[],ears=[],time=0,last=0,raf=0,frames=0,gusts=[],actions=0,paused=rm.matches,pointer=null,lastGust=-10;const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)|0;return(seed>>>0)/4294967296};
function makeEar(n){let a=document.createElement('canvas');a.width=76;a.height=176;let x=a.getContext('2d');let hue=36+n%4*2,sat=42+n%3*6,lit=45+n%5*4;let stem=x.createLinearGradient(34,0,41,0);stem.addColorStop(0,`hsl(${hue} ${sat}% ${lit-15}%)`);stem.addColorStop(.6,`hsl(${hue+5} 57% ${lit+15}%)`);stem.addColorStop(1,`hsl(${hue} ${sat}% ${lit-7}%)`);x.lineWidth=1.2;x.strokeStyle=stem;x.beginPath();x.moveTo(38,171);x.quadraticCurveTo(38,93,37,30);x.stroke();for(let j=0;j<12;j++){let y=145-j*8.6,wide=2.3+Math.sin((j+1)/13*Math.PI)*3.3;for(const side of[-1,1]){let px=38+side*(3+rnd()*1.1);x.save();x.translate(px,y);x.rotate(side*-.55);let g=x.createLinearGradient(-wide,-6,wide,4);g.addColorStop(0,`hsl(${hue} ${sat}% ${lit-11}%)`);g.addColorStop(.44,`hsl(${hue+5} ${sat+5}% ${lit+9}%)`);g.addColorStop(1,`hsl(${hue} ${sat}% ${lit}%)`);x.fillStyle=g;x.beginPath();x.ellipse(0,0,wide,8.2-j*.23,0,0,Math.PI*2);x.fill();x.strokeStyle=`hsla(${hue+5} 58% ${lit+15}% / .6)`;x.lineWidth=.5;x.beginPath();x.moveTo(-.6,5);x.quadraticCurveTo(-.8,-1,0,-7);x.stroke();x.restore();let tipx=px+side*5,tipy=y-6;x.strokeStyle=`hsla(${hue+5} 58% ${lit+13}% / .75)`;x.lineWidth=.53;x.beginPath();x.moveTo(tipx,tipy);x.quadraticCurveTo(tipx+side*7,tipy-15,tipx+side*(11+rnd()*7),tipy-31-rnd()*17);x.stroke()}}return a}
for(let n=0;n<16;n++)ears.push(makeEar(n));
function background(){bg.width=Math.ceil(W*D);bg.height=Math.ceil(H*D);bc.setTransform(D,0,0,D,0,0);let sky=bc.createLinearGradient(0,0,0,H*.55);sky.addColorStop(0,'#bbc9c0');sky.addColorStop(.5,'#e5dfc8');sky.addColorStop(1,'#f3d9a3');bc.fillStyle=sky;bc.fillRect(0,0,W,H);let light=bc.createRadialGradient(W*.14,H*.16,0,W*.14,H*.16,W*.68);light.addColorStop(0,'#fff8d8a8');light.addColorStop(.4,'#fff4d841');light.addColorStop(1,'#ffeed000');bc.fillStyle=light;bc.fillRect(0,0,W,H);bc.save();bc.filter='blur(17px)';for(let i=0;i<13;i++){bc.fillStyle=`rgba(255,249,221,${.025+rnd()*.025})`;bc.beginPath();bc.ellipse(W*(.15+rnd()*.85),H*(.035+rnd()*.18),W*(.11+rnd()*.13),H*(.009+rnd()*.012),-.05,0,Math.PI*2);bc.fill()}bc.restore();bc.save();bc.filter='blur(2.5px)';for(let j=0;j<3;j++){bc.beginPath();bc.moveTo(0,H);for(let x=-10;x<=W+15;x+=12){let y=H*(.365+j*.016)+Math.sin(x/W*5.1+j*1.7)*H*.016+Math.sin(x/W*13+j)*H*.005;bc.lineTo(x,y)}bc.lineTo(W,H);bc.closePath();bc.fillStyle=['#a8ae8a','#a6a77a','#b4a776'][j];bc.fill()}bc.restore();
 let earth=bc.createLinearGradient(0,H*.4,0,H);earth.addColorStop(0,'#c1ae73');earth.addColorStop(.4,'#8d743e');earth.addColorStop(1,'#3e4227');bc.fillStyle=earth;bc.fillRect(0,H*.405,W,H*.6);
 for(let j=0;j<24;j++){let y=H*(.425+j*.025);bc.fillStyle=`rgba(56,64,36,${.012+j*.0008})`;bc.beginPath();bc.moveTo(0,y+10);for(let x=0;x<=W+20;x+=20)bc.lineTo(x,y+Math.sin(x/W*9+j*.5)*H*.026);bc.lineTo(W,H);bc.lineTo(0,H);bc.fill()}
 for(let i=0;i<13000;i++){let depth=rnd()**2, y=H*(.401+depth*.60),x=rnd()*W,len=(2+depth*30)*(H/1000);bc.strokeStyle=`hsla(${37+rnd()*10} ${30+rnd()*24}% ${43+rnd()*26-depth*10}% / ${.2+depth*.4})`;bc.lineWidth=.5+depth*.45;bc.beginPath();bc.moveTo(x,y);bc.lineTo(x-1-depth*3,y-len);bc.stroke()}
 // A far hedgerow gives the field a place to end.
 bc.fillStyle='#78826466';for(let i=0;i<80;i++){let x=W*(.68+i*.0038),y=H*(.402+Math.sin(i*.21)*.002);bc.beginPath();bc.ellipse(x,y,W*.002,H*(.002+rnd()*.002),0,0,7);bc.fill()}}
function createPlants(){seed=9919;plants=[];let count=Math.min(680,Math.max(300,Math.round(W*.44)));for(let i=0;i<count;i++){let z=rnd(),depth=z*z,x=(rnd()*1.16-.08)*W,base=H*(.445+depth*.79),len=H*(.035+depth*(.37+rnd()*.09));plants.push({x,y:base,l:len,d:depth,lean:(rnd()-.45)*.13,phase:rnd()*7,ear:(rnd()*16)|0,headTilt:(rnd()-.5)*.26,size:H*(.007+depth*(.088+rnd()*.032)),leaf:rnd(),tone:rnd()})}plants.sort((a,b)=>a.d-b.d)}
function bend(p){let v=p.lean+Math.sin(time*.95+p.x/W*7-p.d*4)*.024+Math.sin(time*1.73+p.phase)*.01;for(const g of gusts){const distance=Math.abs(p.x-g.x),age=time-g.t-distance/(W*.7),reach=Math.exp(-Math.pow((p.y-p.l-g.y)/(H*.5),2));if(age>0&&age<3.4)v+=g.dir*.39*Math.sin(age*2.5)*Math.exp(-age*1.05)*reach*Math.exp(-distance/(W*1.1))}return v}
function draw(){frames++;c.setTransform(D,0,0,D,0,0);c.clearRect(0,0,W,H);c.drawImage(bg,0,0,W,H);for(const p of plants){let angle=bend(p),tx=p.x+Math.sin(angle)*p.l,ty=p.y-Math.cos(angle)*p.l;let color=`hsl(${39+p.tone*7} ${30+p.tone*15}% ${31+p.tone*20}%)`;c.strokeStyle=color;c.lineWidth=.42+p.d*.9;c.beginPath();c.moveTo(p.x,p.y);c.quadraticCurveTo(p.x+Math.sin(angle)*p.l*.24,p.y-p.l*.51,tx,ty);c.stroke();if(p.d>.11){let ly=p.y-p.l*.36,lx=p.x+Math.sin(angle)*p.l*.07,sg=p.leaf>.5?1:-1,ls=p.l*(.19+p.leaf*.12);c.fillStyle=`hsla(${49+p.tone*12} 31% ${33+p.tone*16}% / .7)`;c.beginPath();c.moveTo(lx,ly);c.quadraticCurveTo(lx+sg*ls*.55,ly-ls*.38,lx+sg*ls*.95,ly-ls*.25);c.quadraticCurveTo(lx+sg*ls*.5,ly-ls*.22,lx,ly+3);c.fill()}c.save();c.translate(tx,ty);c.rotate(angle*1.34+p.headTilt);let ew=p.size*76/176;c.drawImage(ears[p.ear],-ew*.5,-p.size*.94,ew,p.size);c.restore()}
 // Light falls through the nearest awns, without bleaching the whole field.
 let glow=c.createLinearGradient(0,0,W,0);glow.addColorStop(0,'#ffe8a316');glow.addColorStop(.55,'#ffe8a300');c.fillStyle=glow;c.fillRect(0,H*.39,W,H*.61)}
function tick(t){raf=0;if(paused||document.hidden)return;time+=Math.min((t-last)/1000||.016,.06);last=t;gusts=gusts.filter(g=>time-g.t<5);draw();raf=requestAnimationFrame(tick)}function start(){if(!paused&&!raf){last=performance.now();raf=requestAnimationFrame(tick)}}
function gust(x=W*.36,y=H*.61,dir=1){actions++;if(paused){time+=.8;gusts=[{x,y,dir,t:time-.8}];draw()}else{gusts.push({x,y,dir,t:time});if(gusts.length>7)gusts.shift();start()}status.textContent=dir>0?'ひと筋の風が、右へ。':'ひと筋の風が、左へ。'}
function resize(){W=document.documentElement.clientWidth;H=document.documentElement.clientHeight;D=Math.min(devicePixelRatio||1,1.7);cv.width=Math.round(W*D);cv.height=Math.round(H*D);background();createPlants();draw()}function ui(){pause.disabled=rm.matches;pause.textContent=rm.matches?'—':paused?'▷':'Ⅱ';pause.setAttribute('aria-label',paused?'風の動きを再開する':'風の動きを止める');if(paused){cancelAnimationFrame(raf);raf=0;draw()}else start()}
cv.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.focus({preventScroll:true});if(e.clientY>H*.35)gust(e.clientX,e.clientY,1)});cv.addEventListener('pointermove',e=>{if(!pointer)return;let dx=e.clientX-pointer.x;if(Math.abs(dx)>12&&e.clientY>H*.33){if(paused||time-lastGust>.14){gust(e.clientX,e.clientY,Math.sign(dx));lastGust=time}pointer={x:e.clientX,y:e.clientY}}});cv.addEventListener('pointerup',()=>pointer=null);cv.addEventListener('pointercancel',()=>pointer=null);cv.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.code==='Space'){e.preventDefault();gust(W*.5,H*.6,e.key==='ArrowLeft'?-1:1)}});document.querySelector('#gust').addEventListener('click',()=>gust());pause.addEventListener('click',()=>{paused=!paused;ui()});rm.addEventListener('change',()=>{paused=rm.matches;ui()});document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else start()});addEventListener('resize',resize);resize();ui();window.artworkState=()=>({ready:true,frames,actions,time,paused,reduced:rm.matches,plants:plants.length,gusts:gusts.length,sampleBend:bend(plants[Math.floor(plants.length*.8)])});})();
</script></html>
