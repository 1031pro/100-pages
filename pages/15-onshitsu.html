function beam(x,y,w,alpha){g.save();g.globalCompositeOperation='screen';const grad=g.createLinearGradient(x,y,x+350,y+780);grad.addColorStop(0,'rgba(250,233,156,'+alpha+')');grad.addColorStop(1,'rgba(225,231,167,0)');path(g,[[x-w*.2,y],[x+w*.3,y],[x+440+w,y+820],[x+320-w*.25,y+820]],grad);g.restore();}
function butterfly(t){const cycle=t%49;if(cycle<14||cycle>37)return;const u=(cycle-14)/23,x=1160-u*540+Math.sin(u*9)*30,y=515-Math.sin(u*Math.PI)*170+Math.sin(u*14)*14,sz=3+Math.sin(u*Math.PI)*4,w=Math.max(.15,Math.abs(Math.sin(t*8)));g.save();g.translate(x,y);g.rotate(Math.sin(u*7)*.3);for(const side of [-1,1]){g.fillStyle='#dbc88b';g.beginPath();g.ellipse(side*sz*w,0,sz*w,sz*1.4,side*.4,0,TAU);g.fill();g.fillStyle='#9b6c43';g.beginPath();g.arc(side*sz*w,-sz*.25,sz*.2,0,TAU);g.fill();}line(g,[0,-sz],[0,sz],'#324930',1);g.restore();}
function draw(){g.setTransform(D,0,0,D,0,0);g.fillStyle='#163a2e';g.fillRect(0,0,W,H);g.translate(ox,oy);g.scale(scale,scale);g.drawImage(base,0,0);const shade=.018+Math.sin(time*.05)*.008;g.fillStyle='rgba(16,54,42,'+shade+')';g.fillRect(0,0,1600,1000);beam(1070+Math.sin(time*.06)*28,15,145,.12);beam(855+Math.sin(time*.055)*18,85,75,.07);
 // A few near fronds respond coherently to the same slow draft.
 const wind=Math.sin(time*.58)*.035+Math.sin(time*.22)*.022;fern(g,155,1080,425,-.37+wind,'#244e36');fern(g,1510,1085,435,.47+wind*.8,'#1b432f');if(W/H<.8){const left=-ox/scale,right=(W-ox)/scale;fern(g,left-27,1050,290,-.16+wind,'#23472f');fern(g,right+26,1050,335,.26+wind,'#173f2d');leaf(g,right+13,800,250,62,2.91+wind,'#1d4d33',1);}
 const mist=Math.max(0,Math.sin((time%70-30)/15*Math.PI));if(time%70>30&&time%70<45){for(let i=0;i<6;i++){let x=790+(i-2)*50+Math.sin(time*.28+i)*25,y=350+i*28;const fog=g.createRadialGradient(x,y,0,x,y,100+i*15);fog.addColorStop(0,'rgba(219,236,202,'+mist*.027+')');fog.addColorStop(1,'rgba(219,236,202,0)');g.fillStyle=fog;g.fillRect(x-200,y-200,400,400);}}
 for(let i=0;i<26;i++){const x=880+Math.sin(i*53.12)*185+Math.sin(time*.14+i)*13,y=70+((i*79+time*(2+i%3))%650);g.fillStyle='rgba(249,246,198,'+(.06+Math.sin(i+time*.8)*.04)+')';g.beginPath();g.arc(x,y,.6+i%3*.23,0,TAU);g.fill();}butterfly(time);frames++;document.getElementById('clock').textContent='14:'+String(42+Math.floor(time/60)%18).padStart(2,'0');document.getElementById('observation').innerHTML=time%70>30&&time%70<45?'霧がほどけて、<br>葉に戻る。':'葉の向こうを、<br>風が通る。';}
function tick(now){raf=0;if(!paused&&!document.hidden){time+=Math.min(.08,(now-last)/1000||0);draw();}last=now;if(!paused&&!document.hidden)raf=requestAnimationFrame(tick);}function setPaused(v){paused=v;document.getElementById('pause').setAttribute('aria-pressed',String(paused));document.getElementById('pause').textContent=paused?'動きを再開':'動きを止める';if(paused){cancelAnimationFrame(raf);raf=0;}else{last=performance.now();if(!raf)raf=requestAnimationFrame(tick);}}function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,1.6);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);scale=Math.max(W/1600,H/1000);ox=(W-1600*scale)/2;oy=(H-1000*scale)/2;draw();}document.getElementById('pause').onclick=()=>setPaused(!paused);rm.addEventListener('change',e=>{setPaused(e.matches);draw();});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!paused){last=performance.now();if(!raf)raf=requestAnimationFrame(tick);}});makeBackground();new ResizeObserver(resize).observe(canvas);resize();setPaused(paused);window.artworkState=()=>({number:15,time,frames,paused,reducedMotion:rm.matches,width:W,height:H,event:time%70>30&&time%70<45?'mist':time%49>14&&time%49<37?'butterfly':'leaves'});})();
