</style></head><body><header><a class="home" href="../index.html">← 百景</a><span>019 / 100 · ASTRA</span><span>BOTANICAL SECTION</span></header><main><canvas id="fruit" role="img" aria-label="ざくろを薄く切り進める断面。深さによって、皮、白い膜、赤い粒が現れる。"></canvas><h1>果実の断面<small>AN UNIVERSE BENEATH THE SKIN</small></h1><p class="description">ひとつの皮の中に、<br>数えきれない小さな部屋。</p><div class="specimen">Punica granatum<br><span style="font-family:serif">ざくろ</span> / No. 019</div><div class="readout">CUTTING DEPTH<b id="depth-value">50 / 100</b></div><p class="note">ひと粒ずつ、異なるかたち。<br>果実の内側を、静かに進む。</p><div class="controls"><p class="caption">つまみを動かして切り進める。<br>左右キーでも、少しずつ。</p><div class="range"><label for="depth">切る深さ</label><input id="depth" type="range" min="0" max="100" step="1" value="50"><div class="ends"><span>皮の表面</span><span>中心</span><span>向こう側</span></div></div><div class="buttons"><button id="new">もうひとつの実</button><button id="save">断面を残す</button></div></div><div class="sr" id="status" aria-live="polite"></div></main><script>
(()=>{'use strict';const c=document.getElementById('fruit'),g=c.getContext('2d',{alpha:false}),layer=document.createElement('canvas'),a=layer.getContext('2d'),input=document.getElementById('depth');layer.width=900;layer.height=900;let W,H,D,seed=2189,frames=0,chambers=[],arils=[],noise=[],depth=50;const TAU=Math.PI*2,rm=matchMedia('(prefers-reduced-motion: reduce)');function rng(n){return()=>{n=(Math.imul(n,1664525)+1013904223)|0;return(n>>>0)/4294967296;};}function ellipse(ctx,x,y,rx,ry,color,rot=0){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,TAU);ctx.fill();}function build(){const r=rng(seed);chambers=[];arils=[];noise=[];for(let i=0;i<7;i++)chambers.push({angle:i/7*TAU+r()*.08,rad:.46+r()*.1});for(let iz=-8;iz<=8;iz++)for(let iy=-9;iy<=9;iy++)for(let ix=-9;ix<=9;ix++){const x=ix*.107+(iy%2)*.054+(r()-.5)*.012,y=iy*.094+(iz%2)*.035+(r()-.5)*.012,z=iz*.111+(r()-.5)*.008,rad=Math.hypot(x,y);if(x*x+y*y+z*z>.91*.91||rad<.11)continue;const theta=Math.atan2(y,x);let dist=Math.min(...chambers.map(ch=>Math.abs(Math.atan2(Math.sin(theta-ch.angle),Math.cos(theta-ch.angle)))));if(dist>.392)continue;arils.push({x,y,z,r:.061+r()*.009,angle:r()*TAU,hue:r(),n:r()});}for(let i=0;i<18000;i++)noise.push([r()*900,r()*900,r(),r()]);renderSlice();}
function renderSlice(){const z=(depth-50)/51,R=Math.sqrt(Math.max(.01,1-z*z))*362; a.clearRect(0,0,900,900);a.save();a.translate(450,450);a.rotate(-.18);const peel=a.createRadialGradient(-130,-180,20,20,10,R);peel.addColorStop(0,'#cc635e');peel.addColorStop(.62,'#9b3945');peel.addColorStop(.9,'#af4750');peel.addColorStop(1,'#783144');let outer=new Path2D();for(let j=0;j<=240;j++){let t=j/240*TAU,r=R*(1+.012*Math.sin(t*7)+.008*Math.sin(t*13));j?outer.lineTo(Math.cos(t)*r,Math.sin(t)*r):outer.moveTo(r,0);}outer.closePath();a.fillStyle=peel;a.fill(outer);a.save();a.clip(outer);for(const[x,y,v,q]of noise){a.fillStyle=v>.5?'#f6bd783a':'#5f244855';a.fillRect(x-450,y-450,.5+q*1.8,.5+v*1.5);}a.restore();if(depth>3&&depth<97){let inner=R-8-9*Math.abs(z);const flesh=a.createRadialGradient(-70,-140,0,0,0,R);flesh.addColorStop(0,'#f5d9b8');flesh.addColorStop(.75,'#e6c6a1');flesh.addColorStop(1,'#d0a686');ellipse(a,0,0,inner,inner,flesh);for(let i=0;i<7;i++){const ch=chambers[i],ang=ch.angle,rad=R*.92;a.save();a.rotate(ang);const cavity=a.createRadialGradient(R*.5,0,5,R*.5,0,R*.53);cavity.addColorStop(0,'#7e293d');cavity.addColorStop(.8,'#ad4951');cavity.addColorStop(1,'#d99d86');a.fillStyle=cavity;a.beginPath();a.moveTo(R*.09,-R*.035);a.bezierCurveTo(R*.3,-R*.13,R*.57,-R*.43,rad*Math.cos(.4),-rad*Math.sin(.4));a.bezierCurveTo(rad*1.05,-rad*.22,rad*1.045,rad*.18,rad*Math.cos(.4),rad*Math.sin(.4));a.bezierCurveTo(R*.6,R*.4,R*.28,R*.13,R*.09,R*.035);a.closePath();a.fill();a.restore();}
 // Each translucent aril is a different three-dimensional cell intersected by the cut.
 arils.filter(o=>Math.abs(o.z-z)<o.r*1.12).sort((u,v)=>u.z-v.z).forEach(o=>{let rr=o.r*362*Math.sqrt(Math.max(.1,1-((o.z-z)/(o.r*1.12))**2)),x=o.x*362,y=o.y*362;if(Math.hypot(x,y)>inner-rr)return;a.save();a.translate(x,y);a.rotate(o.angle);a.shadowColor='#4c102860';a.shadowBlur=5;a.shadowOffsetY=2;const col=a.createLinearGradient(-rr,-rr,rr,rr);col.addColorStop(0,o.hue>.5?'#f4aa96':'#ee8b87');col.addColorStop(.23,'#d55665');col.addColorStop(.62,o.hue>.5?'#a22c4f':'#a63243');col.addColorStop(1,'#6c213b');a.fillStyle=col;const p=new Path2D();p.moveTo(-rr*.82,-rr*.7);p.quadraticCurveTo(-rr*.2,-rr*1.05,rr*.54,-rr*.74);p.quadraticCurveTo(rr*1.02,-rr*.35,rr*.86,rr*.46);p.quadraticCurveTo(rr*.26,rr*.95,-rr*.56,rr*.8);p.quadraticCurveTo(-rr*1.1,rr*.25,-rr*.82,-rr*.7);a.fill(p);a.shadowBlur=0;a.shadowOffsetY=0;a.strokeStyle='#f8ad9c8a';a.lineWidth=.8;a.stroke(p);ellipse(a,-rr*.08,rr*.07,rr*.14,rr*.26,'#f2bbaa37',-.25);ellipse(a,-rr*.37,-rr*.51,rr*.25,rr*.09,'#ffe2c099',-.23);a.strokeStyle='#ffc1a448';a.lineWidth=.7;a.beginPath();a.moveTo(-rr*.7,rr*.4);a.quadraticCurveTo(-rr*.3,0,rr*.4,-rr*.6);a.stroke();a.restore();});
 // Pith follows irregular chamber boundaries; it is not a radial pattern pasted over the fruit.
 for(let i=0;i<7;i++){const ang=(chambers[i].angle+chambers[(i+1)%7].angle+(i===6?TAU:0))/2;a.save();a.rotate(ang);a.fillStyle='#ead0ae';a.beginPath();a.moveTo(5,-4);a.bezierCurveTo(R*.22,12,R*.38,-25,inner,4);a.lineTo(inner,10);a.bezierCurveTo(R*.55,-8,R*.28,29,4,10);a.closePath();a.fill();a.strokeStyle='#f8e7cb80';a.lineWidth=1.4;a.stroke();a.restore();}ellipse(a,0,0,R*.085,R*.065,'#e8cdb0',.2);for(const[x,y,v,q]of noise.slice(0,7000)){if(Math.hypot(x-450,y-450)>inner)continue;a.fillStyle=v>.5?'#fff3d914':'#6b1f4112';a.fillRect(x-450,y-450,.7+q,.5+v);}}
 else{for(let j=0;j<6;j++){const t=j/6*TAU;ellipse(a,Math.cos(t)*17,Math.sin(t)*17,25,9,'#6d3942',t);}ellipse(a,0,0,12,12,'#502b38');}a.restore();}
function draw(){g.setTransform(D,0,0,D,0,0);const bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#f3e8dd');bg.addColorStop(1,'#e8d4cb');g.fillStyle=bg;g.fillRect(0,0,W,H);const mobile=W<680,r=mobile?W*.46:Math.min(W*.31,(H-190)*.5),x=mobile?W*.53:W*.57,y=mobile?H*.435:H*.44;g.save();g.translate(x+22,y+r*.74);g.scale(1,.18);const shadow=g.createRadialGradient(0,0,0,0,0,r*1.08);shadow.addColorStop(0,'#6e30423b');shadow.addColorStop(1,'#6e304200');g.fillStyle=shadow;g.beginPath();g.arc(0,0,r*1.08,0,TAU);g.fill();g.restore();g.save();g.translate(x,y);g.rotate(-.18);g.fillStyle='#ad5462';g.font='8px Georgia';g.textAlign='center';g.strokeStyle='#b075852d';g.lineWidth=.8;g.beginPath();g.arc(0,0,r*1.01,0,TAU);g.stroke();for(let j=0;j<72;j++){let t=j/72*TAU;g.beginPath();g.moveTo(Math.cos(t)*r*1.015,Math.sin(t)*r*1.015);g.lineTo(Math.cos(t)*r*(j%6===0?1.05:1.035),Math.sin(t)*r*(j%6===0?1.05:1.035));g.stroke();}g.restore();g.drawImage(layer,x-r*1.08,y-r*1.08,r*2.16,r*2.16);
 // A small side profile makes the cutting plane legible.
 const sx=mobile?W*.46:W*.21,sy=mobile?H*.7:H*.7,sw=mobile?37:51;g.save();g.translate(sx,sy);let whole=g.createRadialGradient(-sw*.4,-sw*.4,0,0,0,sw*1.1);whole.addColorStop(0,'#d69072');whole.addColorStop(.5,'#b95159');whole.addColorStop(1,'#742c49');ellipse(g,0,0,sw,sw*.92,whole);g.fillStyle='#915255';g.beginPath();g.moveTo(-9,-sw*.83);g.lineTo(-13,-sw*1.09);g.lineTo(-3,-sw*.99);g.lineTo(0,-sw*1.2);g.lineTo(4,-sw);g.lineTo(13,-sw*1.07);g.lineTo(9,-sw*.83);g.fill();const cut=(depth-50)/50*sw;g.strokeStyle='#672843';g.setLineDash([2,3]);g.beginPath();g.moveTo(cut,-sw*1.45);g.lineTo(cut,sw*1.45);g.stroke();g.setLineDash([]);g.fillStyle='#7a4053';g.font='8px sans-serif';g.textAlign='center';g.fillText('切断面',0,sw*1.8);g.restore();document.getElementById('depth-value').textContent=String(depth).padStart(2,'0')+' / 100';frames++;}
function resize(){const r=c.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;draw();}input.oninput=()=>{depth=+input.value;renderSlice();draw();};document.getElementById('new').onclick=()=>{seed+=193;build();draw();document.getElementById('status').textContent='別の果実に替えました。';};document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='kajitsu-'+depth+'.png';a.href=c.toDataURL('image/png');a.click();};new ResizeObserver(resize).observe(c);build();resize();window.artworkState=()=>({number:19,depth,seed,frames,visibleArils:arils.filter(o=>Math.abs(o.z-(depth-50)/51)<o.r*1.12).length,reducedMotion:rm.matches,animated:false});})();
