</style></head><body><header><a class="home" href="../index.html">← 百景</a><span style="font:21px serif;letter-spacing:.2em">迷い箱</span><span>024 / 100 · ASTRA</span></header><main><section class="side"><h1>迷い箱<small>TAKE THE LONG WAY HOME.</small></h1><p class="poem">急がなくて、いい。<br>寄り道の先にも、<br>ちゃんと道は続く。</p><div class="stats">MAZE / <span id="maze-no">01</span><b id="distance">0.0</b>ころがった距離</div><div class="pad" aria-label="箱を傾ける"><button data-dir="up" aria-label="上へ傾ける">↑</button><button data-dir="left" aria-label="左へ傾ける">←</button><button data-dir="down" aria-label="下へ傾ける">↓</button><button data-dir="right" aria-label="右へ傾ける">→</button></div><div class="tools"><button id="reset">出発点へ</button><button id="new">別の道へ</button><button id="hint" aria-pressed="false">道しるべ</button></div><p class="help">箱をドラッグして傾ける / 矢印キーでも。<br>金色のくぼみまで、銀の球を運ぶ。<br>指を離すと、箱は水平に戻ります。</p></section><section class="board-area"><span class="note">HANDCRAFTED / 024</span><canvas id="board" tabindex="0" role="img" aria-label="木製の迷路。左上の銀球を、右下の金色のゴールへ運ぶ。矢印キー、画面の矢印ボタン、ドラッグで傾ける。"></canvas><p class="notice" id="notice" aria-live="polite">左上から、右下へ。行き止まりも、道のうち。</p></section></main><script>
(()=>{'use strict';const c=document.getElementById('board'),g=c.getContext('2d'),base=document.createElement('canvas'),b=base.getContext('2d'),rm=matchMedia('(prefers-reduced-motion: reduce)');base.width=700;base.height=700;const N=6,cell=80,start=110,R=10,TAU=Math.PI*2;let W,H,D,frames=0,edition=1,seed=415,maze=[],walls=[],route=[],ball={x:150,y:150,vx:0,vy:0},tilt={x:0,y:0},drag=null,raf=0,last=0,won=false,showHint=false,distance=0,lastCell=0;function rand(){seed=(Math.imul(seed,1664525)+1013904223)|0;return(seed>>>0)/4294967296;}function build(){seed=415+edition*117;maze=Array.from({length:N*N},()=>({w:[true,true,true,true],seen:false}));let stack=[0];maze[0].seen=true;const dirs=[[0,-1],[1,0],[0,1],[-1,0]];while(stack.length){let at=stack[stack.length-1],x=at%N,y=Math.floor(at/N),opts=[];for(let d=0;d<4;d++){let xx=x+dirs[d][0],yy=y+dirs[d][1];if(xx>=0&&yy>=0&&xx<N&&yy<N&&!maze[yy*N+xx].seen)opts.push([d,yy*N+xx]);}if(!opts.length){stack.pop();continue;}let [d,next]=opts[Math.floor(rand()*opts.length)];maze[at].w[d]=false;maze[next].w[(d+2)%4]=false;maze[next].seen=true;stack.push(next);}walls=[];for(let j=0;j<N;j++)for(let i=0;i<N;i++){let q=maze[j*N+i],x=start+i*cell,y=start+j*cell;if(q.w[0])walls.push([x,y,x+cell,y]);if(q.w[3])walls.push([x,y,x,y+cell]);if(j===N-1&&q.w[2])walls.push([x,y+cell,x+cell,y+cell]);if(i===N-1&&q.w[1])walls.push([x+cell,y,x+cell,y+cell]);}makeBase();reset();}
function pathToGoal(from){const prev=new Map([[from,null]]),q=[from],ds=[-N,1,N,-1];while(q.length){let i=q.shift();if(i===N*N-1)break;for(let d=0;d<4;d++)if(!maze[i].w[d]){let j=i+ds[d];if(!prev.has(j)){prev.set(j,i);q.push(j);}}}let out=[],i=N*N-1;while(i!==null&&i!==undefined){out.push(i);i=prev.get(i);}return out.reverse();}function makeBase(){b.clearRect(0,0,700,700);b.save();b.shadowColor='#685b4850';b.shadowBlur=20;b.shadowOffsetY=13;b.fillStyle='#795438';b.beginPath();b.roundRect(65,65,570,570,19);b.fill();b.restore();let frame=b.createLinearGradient(65,65,635,635);frame.addColorStop(0,'#c49663');frame.addColorStop(.35,'#916744');frame.addColorStop(1,'#604733');b.fillStyle=frame;b.beginPath();b.roundRect(67,67,566,566,17);b.fill();b.strokeStyle='#e6c38a88';b.lineWidth=2;b.stroke();b.fillStyle='#654c32';b.fillRect(98,98,504,504);let floor=b.createLinearGradient(110,110,590,590);floor.addColorStop(0,'#dcb57f');floor.addColorStop(.5,'#c39b67');floor.addColorStop(1,'#b78d5e');b.fillStyle=floor;b.fillRect(start,start,480,480);
 let rng=782;function grain(){rng=(Math.imul(rng,1664525)+1013904223)|0;return(rng>>>0)/4294967296;}b.save();b.beginPath();b.rect(75,75,550,550);b.clip();for(let j=0;j<470;j++){let y=70+j*1.21;b.strokeStyle=j%3?'#f5d6a02a':'#5b3c291f';b.lineWidth=.4+grain()*.7;b.beginPath();for(let k=0;k<=70;k++){let x=65+k*8,yy=y+Math.sin(x*.018+j*.026)*(1+Math.sin(j*.07))*2.5+Math.sin(x*.007+j*.03)*4;k?b.lineTo(x,yy):b.moveTo(x,yy);}b.stroke();}b.restore();b.strokeStyle='#493c2c77';b.lineWidth=1;for(const[x,y]of [[82,82],[618,82],[82,618],[618,618]]){b.fillStyle='#a98b57';b.beginPath();b.arc(x,y,4,0,TAU);b.fill();b.beginPath();b.moveTo(x-2.5,y+1);b.lineTo(x+2.5,y-1);b.stroke();}for(const w of walls){const[x,y,xx,yy]=w;b.lineCap='square';b.strokeStyle='#5c44374f';b.lineWidth=15;b.beginPath();b.moveTo(x+3,y+5);b.lineTo(xx+3,yy+5);b.stroke();b.strokeStyle='#815c3b';b.lineWidth=10;b.beginPath();b.moveTo(x,y+2);b.lineTo(xx,yy+2);b.stroke();b.strokeStyle='#e0b984';b.lineWidth=8;b.beginPath();b.moveTo(x,y-2);b.lineTo(xx,yy-2);b.stroke();b.strokeStyle='#f4d19b7d';b.lineWidth=1;b.beginPath();b.moveTo(x-2,y-5);b.lineTo(xx-2,yy-5);b.stroke();}const goalX=550,goalY=550;let hole=b.createRadialGradient(goalX-2,goalY-3,2,goalX,goalY,20);hole.addColorStop(0,'#674c29');hole.addColorStop(.6,'#95733c');hole.addColorStop(.85,'#cba95e');hole.addColorStop(1,'#e6c98e');b.fillStyle=hole;b.beginPath();b.arc(goalX,goalY,20,0,TAU);b.fill();b.strokeStyle='#8b683c';b.lineWidth=1;b.stroke();b.fillStyle='#a98858';b.font='7px Georgia';b.textAlign='center';b.fillText('HOME',goalX,goalY+31);b.strokeStyle='#80633c60';b.lineWidth=.8;b.beginPath();b.arc(150,150,17,0,TAU);b.stroke();b.fillStyle='#d7b786';b.font='10px Georgia';b.font='13px serif';b.fillText('迷 い 箱',350,618);}
function draw(){g.setTransform(D,0,0,D,0,0);g.clearRect(0,0,W,H);const s=W/700;g.save();g.translate(W*.5,H*.5);const tx=rm.matches?0:tilt.x,ty=rm.matches?0:tilt.y;g.transform(1,-tx*.009,ty*.012,1,0,0);g.scale(s,s);g.translate(-350,-350);g.drawImage(base,0,0);if(showHint&&!won){const from=Math.max(0,Math.min(35,Math.floor((ball.y-start)/cell)*N+Math.floor((ball.x-start)/cell)));route=pathToGoal(from);g.strokeStyle='#8b623348';g.lineWidth=2;g.setLineDash([3,9]);g.beginPath();route.forEach((q,i)=>{let x=start+(q%N+.5)*cell,y=start+(Math.floor(q/N)+.5)*cell;i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();g.setLineDash([]);}g.save();g.translate(ball.x+3,ball.y+5);g.scale(1,.65);let shadow=g.createRadialGradient(0,0,0,0,0,17);shadow.addColorStop(0,'#513f3980');shadow.addColorStop(1,'#513f3900');g.fillStyle=shadow;g.beginPath();g.arc(0,0,17,0,TAU);g.fill();g.restore();const silver=g.createRadialGradient(ball.x-R*.4,ball.y-R*.48,1,ball.x+R*.25,ball.y+R*.2,R*1.24);silver.addColorStop(0,'#ffffff');silver.addColorStop(.17,'#d6dfdc');silver.addColorStop(.36,'#9daaa8');silver.addColorStop(.52,'#e3e6d5');silver.addColorStop(.59,'#465e5f');silver.addColorStop(.77,'#738681');silver.addColorStop(1,'#263f43');g.fillStyle=silver;g.beginPath();g.arc(ball.x,ball.y,R,0,TAU);g.fill();if(won){g.strokeStyle='#fcdfa9';g.lineWidth=2;g.beginPath();g.arc(550,550,23,0,TAU);g.stroke();}g.restore();document.getElementById('distance').textContent=(distance/80).toFixed(1);frames++;}
function collision(){for(const[x1,y1,x2,y2]of walls){let dx=x2-x1,dy=y2-y1,len=dx*dx+dy*dy,t=Math.max(0,Math.min(1,((ball.x-x1)*dx+(ball.y-y1)*dy)/len)),px=x1+t*dx,py=y1+t*dy,ex=ball.x-px,ey=ball.y-py,d=Math.hypot(ex,ey),radius=R+5;if(d<radius){if(d<.01){ex=dx===0?1:0;ey=dy===0?1:0;d=1;}let nx=ex/d,ny=ey/d;ball.x=px+nx*radius;ball.y=py+ny*radius;let v=ball.vx*nx+ball.vy*ny;if(v<0){ball.vx-=v*1.22*nx;ball.vy-=v*1.22*ny;}}}}
function tick(now){raf=0;const dt=Math.min(.03,(now-last)/1000||.016);last=now;if(!won&&!document.hidden){for(let i=0;i<3;i++){const sub=dt/3,ox=ball.x,oy=ball.y;ball.vx=(ball.vx+tilt.x*570*sub)*Math.exp(-3.2*sub);ball.vy=(ball.vy+tilt.y*570*sub)*Math.exp(-3.2*sub);ball.x+=ball.vx*sub;ball.y+=ball.vy*sub;collision();distance+=Math.hypot(ball.x-ox,ball.y-oy);}if(Math.hypot(ball.x-550,ball.y-550)<12){won=true;ball.x=550;ball.y=550;ball.vx=ball.vy=0;tilt.x=tilt.y=0;document.getElementById('notice').textContent='おかえりなさい。遠回りも、ひとつの道でした。';}draw();}if(!won&&!document.hidden&&(Math.hypot(ball.vx,ball.vy)>.12||tilt.x||tilt.y))raf=requestAnimationFrame(tick);}function startTick(){last=performance.now();if(!raf)raf=requestAnimationFrame(tick);}function release(){tilt={x:0,y:0};drag=null;startTick();}function reset(){ball={x:150,y:150,vx:0,vy:0};won=false;distance=0;tilt={x:0,y:0};document.getElementById('notice').textContent='左上から、右下へ。行き止まりも、道のうち。';draw();}const keys=new Set();function updateKeys(){tilt.x=(keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0);tilt.y=(keys.has('ArrowDown')?1:0)-(keys.has('ArrowUp')?1:0);startTick();}c.onkeydown=e=>{if(e.key.startsWith('Arrow')){e.preventDefault();keys.add(e.key);updateKeys();}if(e.key.toLowerCase()==='r')reset();};document.addEventListener('keyup',e=>{if(keys.has(e.key)){keys.delete(e.key);updateKeys();}});c.onblur=()=>{keys.clear();release();};c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId);c.focus({preventScroll:true});e.preventDefault();};c.onpointermove=e=>{if(!drag)return;tilt.x=Math.max(-1,Math.min(1,(e.clientX-drag.x)/55));tilt.y=Math.max(-1,Math.min(1,(e.clientY-drag.y)/55));startTick();};c.onpointerup=c.onpointercancel=release;document.querySelectorAll('[data-dir]').forEach(e=>{const d=e.dataset.dir;function push(){tilt={x:d==='left'?-1:d==='right'?1:0,y:d==='up'?-1:d==='down'?1:0};startTick();}e.onpointerdown=ev=>{ev.preventDefault();e.setPointerCapture(ev.pointerId);push();};e.onp
