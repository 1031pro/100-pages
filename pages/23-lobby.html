function resize(){const r=c.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,1.6);c.width=W*D;c.height=H*D;S=Math.max(W/1600,H/1000)*(W<600?1:view===0?1:1.16);const center=[815,1130,450][view];ox=W<600?W*.52-center*S:Math.max(W-1600*S,Math.min(0,W*.5-center*S));oy=(H-1000*S)/2;draw();}function tick(now){raf=0;if(!paused&&!document.hidden){time+=Math.min(.1,(now-last)/1000||0);draw();}last=now;if(!paused&&!document.hidden)raf=requestAnimationFrame(tick);}function pause(v){paused=v;document.getElementById('pause').textContent=v?'時間を再開':'時間を止める';document.getElementById('pause').setAttribute('aria-pressed',String(v));cancelAnimationFrame(raf);raf=0;if(!v){last=performance.now();raf=requestAnimationFrame(tick);}}document.getElementById('look').onclick=()=>{view=(view+1)%3;document.getElementById('look').textContent=['見回す','ポスターへ','正面へ'][view];resize();};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();view=(view+(e.key==='ArrowRight'?1:2))%3;resize();}});document.getElementById('pause').onclick=()=>pause(!paused);document.getElementById('lights').onclick=()=>{dim=!dim;document.getElementById('lights').setAttribute('aria-pressed',String(dim));document.getElementById('lights').textContent=dim?'灯りを戻す':'灯りを落とす';draw();};rm.addEventListener('change',e=>pause(e.matches));document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!paused){last=performance.now();if(!raf)raf=requestAnimationFrame(tick);}});make();new ResizeObserver(resize).observe(c);resize();pause(paused);window.artworkState=()=>({number:23,time,frames,paused,dim,view,doorOpen:Math.max(.06,1-time/42),car:time%68>17&&time%68<27,reducedMotion:rm.matches});})();
