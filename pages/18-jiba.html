</style></head><body><header><a class="home" href="../index.html">← 百景</a><span>018 / 100 · ASTRA</span><span>FIELD NOTES</span></header><div class="heading"><h1>見えない力<span>THE SPACE BETWEEN TWO MAGNETS</span></h1><p class="intro">離れていても、つながっている。<br>磁石を動かす。向きを変える。<br>その間の、何もない場所を見てみる。</p></div><main><div class="stage"><canvas id="field" role="img" aria-label="二本の磁石がつくる場。細い曲線はN極からS極へ向かい、短い針はその場所の力の向きを示す。"></canvas><div class="plate-label">PLATE 018&nbsp; / &nbsp;TWO DIPOLES<br><br>SUPERPOSITION STUDY</div><div class="scale">相対スケール</div><button class="magnet" id="magnet-a" aria-label="磁石A。矢印キーで移動、Rで回転、Fで極を反転" aria-pressed="true"></button><button class="magnet" id="magnet-b" aria-label="磁石B。矢印キーで移動、Rで回転、Fで極を反転" aria-pressed="false"></button></div><div class="instruments"><div class="presets"><span class="small">ARRANGEMENT</span><button data-preset="0" aria-pressed="true">引き合う</button><button data-preset="1" aria-pressed="false">反発する</button><button data-preset="2" aria-pressed="false">交差する</button></div><div class="tools"><button id="turn">Aを45°回す</button><button id="flip">Aの極を反転</button><button id="powder" aria-pressed="false">砂鉄を撒く</button><button id="needles" aria-pressed="true">小さな磁針</button></div></div></main><footer class="foot"><p>磁石をドラッグ / 選んで矢印キーで移動<br>R：回転　F：反転　1・2・3：配置を戻す</p><p>2次元の点磁極による視覚化。実物の磁石の精密な測定値ではありません。</p><p class="status" id="status" aria-live="polite">A SELECTED · 000°</p></footer><script>
(()=>{'use strict';const c=document.getElementById('field'),g=c.getContext('2d',{alpha:false}),rm=matchMedia('(prefers-reduced-motion: reduce)'),hits=[document.getElementById('magnet-a'),document.getElementById('magnet-b')],status=document.getElementById('status');let W,H,D,selected=0,powder=false,needles=true,preset=0,frames=0,drag=null,magnets=[],poles=[],view={x:0,y:0};const TAU=Math.PI*2;function setPreset(i){preset=i;magnets=i===0?[{x:.32,y:.45,a:0},{x:.68,y:.55,a:0}]:i===1?[{x:.31,y:.48,a:0},{x:.69,y:.48,a:Math.PI}]:[{x:.37,y:.45,a:Math.PI*.25},{x:.66,y:.56,a:-Math.PI*.25}];document.querySelectorAll('[data-preset]').forEach((e,j)=>e.setAttribute('aria-pressed',String(i===j)));select(0);draw();}function len(){return Math.min(130,W*.23);}function select(i){selected=i;hits.forEach((e,j)=>e.setAttribute('aria-pressed',String(i===j)));const n='AB'[i];document.getElementById('turn').textContent=n+'を45°回す';document.getElementById('flip').textContent=n+'の極を反転';report();}function report(){status.textContent='AB'[selected]+' SELECTED · '+String(Math.round(((magnets[selected]?.a||0)/Math.PI*180%360+360)%360)).padStart(3,'0')+'°';}function field(x,y){let bx=0,by=0;for(const p of poles){let dx=x-p.x,dy=y-p.y,r2=dx*dx+dy*dy+14,f=p.q/Math.pow(r2,1.5);bx+=dx*f;by+=dy*f;}return [bx,by];}function line(x,y,n=1){g.beginPath();g.moveTo(x,y);let points=[];for(let i=0;i<500;i++){let[bX,bY]=field(x,y),m=Math.hypot(bX,bY);if(m<1e-10)break;x+=bX/m*2.7*n;y+=bY/m*2.7*n;if(x< -20||y< -20||x>W+20||y>H+20)break;g.lineTo(x,y);if(i===36||i===98||i===185)points.push([x,y,Math.atan2(bY,bX)]);if(poles.some(p=>p.q*n<0&&Math.hypot(x-p.x,y-p.y)<8))break;}g.stroke();for(const[x,y,a]of points){g.save();g.translate(x,y);g.rotate(a);g.beginPath();g.moveTo(-4,-2.2);g.lineTo(0,0);g.lineTo(-4,2.2);g.stroke();g.restore();}}
function draw(){if(!W||!magnets.length)return;g.setTransform(D,0,0,D,0,0);g.fillStyle='#e2e9e3';g.fillRect(0,0,W,H);const l=len();poles=[];magnets.forEach(m=>{for(const q of [1,-1])poles.push({x:m.x*W+Math.cos(m.a)*l*.39*q,y:m.y*H+Math.sin(m.a)*l*.39*q,q});});g.strokeStyle='#75979820';g.lineWidth=.6;for(let x=0;x<W;x+=25){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}for(let y=0;y<H;y+=25){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
 if(needles){for(let x=13;x<W;x+=23)for(let y=13;y<H;y+=23){if(poles.some(p=>Math.hypot(x-p.x,y-p.y)<22))continue;const[bX,bY]=field(x,y),a=Math.atan2(bY,bX),m=Math.min(1,Math.hypot(bX,bY)*8500),r=2.2+m*3.4;g.strokeStyle='rgba(53,91,91,'+(.1+m*.21)+')';g.lineWidth=.8;g.beginPath();g.moveTo(x-Math.cos(a)*r,y-Math.sin(a)*r);g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);g.stroke();}}
 if(powder){let seed=1921;function rand(){seed=(Math.imul(seed,1664525)+1013904223)|0;return(seed>>>0)/4294967296;}for(let k=0;k<7800;k++){let x=rand()*W,y=rand()*H;const[fX,fY]=field(x,y),a=Math.atan2(fY,fX),m=Math.min(1,Math.hypot(fX,fY)*20000),r=.7+m*2.2;if(poles.some(p=>Math.hypot(x-p.x,y-p.y)<10))continue;g.strokeStyle='rgba(39,65,63,'+(.12+m*.53)+')';g.lineWidth=.5+rand()*.6;g.beginPath();g.moveTo(x-Math.cos(a)*r,y-Math.sin(a)*r);g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);g.stroke();}}g.lineWidth=.85;for(const p of poles.filter(p=>p.q>0)){for(let j=0;j<27;j++){const a=j/27*TAU;g.strokeStyle=j%3===0?'#367777a3':'#437a7c65';line(p.x+Math.cos(a)*9,p.y+Math.sin(a)*9);}}
 magnets.forEach((m,i)=>{const x=m.x*W,y=m.y*H;Object.assign(hits[i].style,{left:x+'px',top:y+'px',width:l+10+'px',height:'49px',transform:'translate(-50%,-50%) rotate('+m.a+'rad)'});g.save();g.translate(x,y);g.rotate(m.a);g.shadowColor='#1c42403c';g.shadowBlur=11;g.shadowOffsetY=6;g.fillStyle='#ebe7da';g.beginPath();g.roundRect(-l/2-2,-19,l+4,38,4);g.fill();g.shadowBlur=0;g.shadowOffsetY=0;g.save();g.beginPath();g.roundRect(-l/2,-17,l,34,3);g.clip();g.fillStyle='#487881';g.fillRect(-l/2,-17,l/2,34);g.fillStyle='#c35c4b';g.fillRect(0,-17,l/2,34);const gloss=g.createLinearGradient(0,-17,0,17);gloss.addColorStop(0,'#ffffff2a');gloss.addColorStop(.45,'#ffffff04');gloss.addColorStop(1,'#142f4029');g.fillStyle=gloss;g.fillRect(-l/2,-17,l,34);g.restore();g.fillStyle='#f3eddf';g.textAlign='center';g.textBaseline='middle';g.font='12px Georgia';g.fillText('S',-l*.32,0);g.fillText('N',l*.32,0);g.strokeStyle='#f5efdc77';g.lineWidth=.6;g.beginPath();g.moveTo(0,-17);g.lineTo(0,17);g.stroke();g.restore();g.fillStyle='#315457';g.font='9px Georgia';g.textAlign='center';g.fillText('AB'[i],x,y-40);if(i===selected){g.strokeStyle='#40636b';g.lineWidth=.8;g.beginPath();g.arc(x,y,l*.63,0,TAU);g.setLineDash([1,5]);g.stroke();g.setLineDash([]);}});frames++;report();}
function move(i,dx,dy){const m=magnets[i];m.x=Math.max(.14,Math.min(.86,m.x+dx));m.y=Math.max(.18,Math.min(.82,m.y+dy));preset=-1;document.querySelectorAll('[data-preset]').forEach(e=>e.setAttribute('aria-pressed','false'));draw();}function rotate(a){magnets[selected].a+=a;draw();}hits.forEach((e,i)=>{e.addEventListener('focus',()=>{select(i);draw();});e.onpointerdown=ev=>{ev.preventDefault();select(i);e.focus({preventScroll:true});drag={i,x:ev.clientX,y:ev.clientY};e.setPointerCapture(ev.pointerId);};e.onpointermove=ev=>{if(!drag)return;move(i,(ev.clientX-drag.x)/W,(ev.clientY-drag.y)/H);drag.x=ev.clientX;drag.y=ev.clientY;};e.onpointerup=e.onpointercancel=()=>drag=null;e.onkeydown=ev=>{let d=ev.shiftKey?.04:.01;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(ev.key)){ev.preventDefault();move(i,ev.key==='ArrowLeft'?-d:ev.key==='ArrowRight'?d:0,ev.key==='ArrowUp'?-d:ev.key==='ArrowDown'?d:0);}if(ev.key.toLowerCase()==='r')rotate(Math.PI/4);if(ev.key.toLowerCase()==='f')rotate(Math.PI);};});document.querySelectorAll('[data-preset]').forEach(e=>e.onclick=()=>setPreset(+e.dataset.preset));document.getElementById('turn').onclick=()=>rotate(Math.PI/4);document.getElementById('flip').onclick=()=>rotate(Math.PI);document.getElementById('powder').onclick=e=>{powder=!powder;e.currentTarget.setAttribute('aria-pressed',String(powder));e.currentTarget.textContent=powder?'砂鉄を片づける':'砂鉄を撒く';draw();};document.getElementById('needles').onclick=ev=>{needles=!needles;ev.currentTarget.setAttribute('aria-pressed',String(needles));draw();};document.addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key))setPreset(+e.key-1);});function resize(){const r=c.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;draw();}new ResizeObserver(resize).observe(c);resize();setPreset(0);window.artworkState=()=>({number:18,magnets:magnets.map(m=>({...m})),selected,needles,powder,preset,frames,reducedMotion:rm.matches,animated:false});})();
