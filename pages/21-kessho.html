<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><link rel="icon" href="data:,"><title>結晶室 — 百景 021 / Astra</title><style>
*{box-sizing:border-box}body{margin:0;background:#122d3c;color:#d3e3e5;font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:26px 4%;font-size:9px;letter-spacing:.16em;border-bottom:1px solid #abd3dc25}a{color:inherit;text-decoration:none}.home{font-family:serif;font-size:18px}main{display:grid;grid-template-columns:260px 1fr;gap:50px;padding:45px 4% 25px;min-height:calc(100svh - 79px);max-width:1800px;margin:auto}.sidebar{display:flex;flex-direction:column;align-items:start}h1{font-family:"Noto Serif CJK JP","Yu Mincho",serif;font-size:58px;letter-spacing:.16em;line-height:1.5;font-weight:400;margin:8px 0 35px}h1 small{font:9px Georgia,serif;display:block;letter-spacing:.22em;margin-top:12px}.poem{font:12px/2.3 "Noto Serif CJK JP",serif;color:#9bb4bd}.thermometer{margin-top:40px;width:100%}.thermometer output{font-family:Georgia,serif;font-size:57px;color:#abcfd7;display:block;line-height:1.4}.thermometer label{font-size:9px;letter-spacing:.1em;color:#8fadb8}.thermometer input{display:block;accent-color:#94cbd7;width:100%;margin-top:22px;cursor:ew-resize}.legend{font-size:9px;line-height:2;color:#7998a7;margin:15px 0 32px}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}button{font:inherit;font-size:10px;background:#d4f1e306;color:inherit;border:1px solid #9cbfc63b;padding:11px 14px;min-height:40px;cursor:pointer}button:hover{background:#c1e4e41c}button:focus-visible,input:focus-visible,canvas:focus-visible,a:focus-visible{outline:2px solid #a2d4dc;outline-offset:4px}.specimen{position:relative;min-width:0;display:flex;flex-direction:column}.glass{position:relative;flex:1;min-height:610px;background:#193b4c;border:1px solid #8dbcc048;box-shadow:inset 0 0 0 6px #abcbd808,inset 0 0 80px #071f3050;overflow:hidden}canvas{width:100%;height:100%;position:absolute;inset:0;display:block;touch-action:pan-y;cursor:crosshair}.label{position:absolute;top:20px;left:21px;right:21px;font-size:8px;letter-spacing:.14em;color:#8db2c0;display:flex;justify-content:space-between;pointer-events:none}.glass:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 36%,#b8e1e70b 37%,transparent 43%,transparent 73%,#b8e1e708 74%,transparent 80%);border:5px solid #ccf0ee07}.bottom{display:flex;justify-content:space-between;gap:15px;font-size:9px;line-height:2;padding-top:17px;color:#819ea9}.bottom p{margin:0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:700px){header{padding:23px 6%;font-size:8px}.home{font-size:16px}main{display:flex;flex-direction:column;padding:28px 6% 24px;gap:22px}.sidebar{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}h1{font-size:39px;margin:0 0 14px}h1 small{font-size:8px}.poem{font-size:10px;grid-column:1;margin:0;line-height:2}.thermometer{grid-column:2;grid-row:1/3;margin:0}.thermometer output{font-size:40px}.thermometer input{margin:16px 0}.legend{grid-column:1/3;margin:18px 0 13px;font-size:8px}.tools{grid-column:1/3;gap:7px}button{font-size:9px;padding:9px 11px}.glass{min-height:510px;margin:0 -6vw}.bottom{font-size:8px}.label{font-size:7px}}
</style></head><body><header><a class="home" href="../index.html">← 百景</a><span>021 / 100 · ASTRA</span><span>THE CRYSTAL CHAMBER</span></header><main><section class="sidebar"><h1>結晶室<small>GROWING, ONE BRANCH AT A TIME.</small></h1><p class="poem">静けさにも、<br>枝分かれがある。</p><div class="thermometer"><output id="temperature">−18°C</output><label for="cold">次に生まれる結晶の温度</label><input id="cold" type="range" min="8" max="24" value="18" step="1" aria-label="結晶の温度、零下8度から24度"></div><p class="legend">冷えるほど、枝は細かく広がる。<br>硝子の好きな場所に、種を置く。</p><div class="tools"><button id="seed">種を置く</button><button id="pause" aria-pressed="false">成長を止める</button><button id="reset">硝子を拭く</button><button id="save">標本を残す</button></div></section><section class="specimen"><div class="glass"><canvas id="glass" tabindex="0" aria-label="結晶が育つ硝子。クリックで種を置く。キーボードでは矢印で位置を選び、Enterで種を置けます。" role="img"></canvas><div class="label"><span>SLIDE 021 / DENDRITIC STUDY</span><span id="count">03 SEEDS</span></div></div><div class="bottom"><p>矢印で位置を選ぶ / Enterで種を置く<br>最大8粒。種を変えるたび、違う枝へ。</p><p>結晶のかたちを借りた、<br>架空の成長標本。</p></div></section></main><div class="sr" id="status" aria-live="polite"></div><script>
(()=>{'use strict';const c=document.getElementById('glass'),g=c.getContext('2d',{alpha:false}),rm=matchMedia('(prefers-reduced-motion: reduce)'),temp=document.getElementById('cold');let W,H,D,time=0,last=0,raf=0,frames=0,paused=rm.matches,cold=18,seeds=[],segments=[],randSeed=4931,cursor={x:.5,y:.5},showCursor=false;const TAU=Math.PI*2;function random(){randSeed=(Math.imul(randSeed,1664525)+1013904223)|0;return(randSeed>>>0)/4294967296;}function add(x,y,age=0){if(seeds.length>=8){document.getElementById('status').textContent='種は8粒まで。硝子を拭くと、新しく始められます。';return;}const id=seeds.length,scale=.18+random()*.12,angle=random()*TAU,detail=Math.round((cold-8)/4)+1,seed={x,y,scale,angle,start:time-age,id};seeds.push(seed);function branch(px,py,a,len,level,start,width){const ex=px+Math.cos(a)*len,ey=py+Math.sin(a)*len;segments.push({x:px,y:py,ex,ey,start:seed.start+start,duration:len*36,width,id});if(level<=0||len<.009)return;const n=(level===3?3:level===2?2:1)+Math.ceil(detail/2);for(let j=1;j<=n;j++){const t=j/(n+1),xx=px+(ex-px)*t,yy=py+(ey-py)*t,bl=len*(1-t)*(.4+random()*.22),when=start+len*36*t;for(const side of [-1,1])branch(xx,yy,a+side*Math.PI/3,bl,level-1,when,width*.63);}if(level>1&&cold<14){segments.push({x:ex,y:ey,ex:ex+Math.cos(a+Math.PI/3)*len*.17,ey:ey+Math.sin(a+Math.PI/3)*len*.17,start:seed.start+start+len*36,duration:.8,width:width*.8,id});}}for(let i=0;i<6;i++)branch(x,y,angle+i/6*TAU,scale*(.9+random()*.14),Math.min(3,1+Math.floor(detail/2)),0,1.6);if(rm.matches){for(const s of segments.filter(s=>s.id===id))s.start-=30;}document.getElementById('count').textContent=String(seeds.length).padStart(2,'0')+' SEEDS';document.getElementById('status').textContent=seeds.length+'粒目の種を置きました。';draw();}
function draw(){if(!W)return;g.setTransform(D,0,0,D,0,0);const bg=g.createRadialGradient(W*.5,H*.4,10,W*.55,H*.55,Math.max(W,H)*.8);bg.addColorStop(0,'#2e5869');bg.addColorStop(.55,'#1b3e50');bg.addColorStop(1,'#102b3c');g.fillStyle=bg;g.fillRect(0,0,W,H);const m=Math.min(W,H);g.lineCap='round';for(const s of segments){const t=Math.max(0,Math.min(1,(time-s.start)/s.duration));if(!t)continue;const x=s.x*W,y=s.y*H,ex=x+(s.ex-s.x)*m*t,ey=y+(s.ey-s.y)*m*t;/* Seed-local offsets keep the same branching geometry on a tall specimen. */const root=seeds[s.id],sx=root.x*W+(s.x-root.x)*m,sy=root.y*H+(s.y-root.y)*m,xx=sx+(s.ex-s.x)*m*t,yy=sy+(s.ey-s.y)*m*t;g.strokeStyle='rgba(167,216,225,'+(s.width>.9?.55:.32)+')';g.lineWidth=Math.max(.45,s.width*m/600);g.beginPath();g.moveTo(sx,sy);g.lineTo(xx,yy);g.stroke();if(s.width>.9){g.strokeStyle='#e7f7ed80';g.lineWidth=.6;g.beginPath();g.moveTo(sx-.8,sy-.8);g.lineTo(xx-.8,yy-.8);g.stroke();}if(t===1&&s.width>1.2){const a=Math.atan2(yy-sy,xx-sx),r=1.7+s.width;g.fillStyle='#cef3ee22';g.beginPath();for(let i=0;i<6;i++){let q=a+i/6*TAU;i?g.lineTo(xx+Math.cos(q)*r,yy+Math.sin(q)*r):g.moveTo(xx+Math.cos(q)*r,yy+Math.sin(q)*r);}g.closePath();g.fill();g.strokeStyle='#d1efed48';g.lineWidth=.5;g.stroke();}}
 for(const s of seeds){const size=Math.min(9,2+Math.max(0,time-s.start)*.4);g.save();g.translate(s.x*W,s.y*H);g.rotate(s.angle);g.fillStyle='#d3eeea23';g.strokeStyle='#d0edf080';g.lineWidth=.7;g.beginPath();for(let i=0;i<6;i++){const a=i/6*TAU;i?g.lineTo(Math.cos(a)*size,Math.sin(a)*size):g.moveTo(size,0);}g.closePath();g.fill();g.stroke();g.restore();}
 if(showCursor){const x=cursor.x*W,y=cursor.y*H;g.strokeStyle='#b1d5d49c';g.lineWidth=.7;g.beginPath();g.moveTo(x-11,y);g.lineTo(x+11,y);g.moveTo(x,y-11);g.lineTo(x,y+11);g.stroke();}frames++;}
function resize(){const r=c.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;draw();}function tick(now){raf=0;if(!paused&&!document.hidden){time+=Math.min(.08,(now-last)/1000||0);draw();}last=now;if(!paused&&!document.hidden&&segments.some(s=>time<s.start+s.duration))raf=requestAnimationFrame(tick);}function start(){last=performance.now();if(!paused&&!raf)raf=requestAnimationFrame(tick);}function pause(v){paused=v;document.getElementById('pause').textContent=v?'成長を再開':'成長を止める';document.getElementById('pause').setAttribute('aria-pressed',String(v));if(v){cancelAnimationFrame(raf);raf=0;}else start();}c.onpointerdown=e=>{const r=c.getBoundingClientRect();cursor={x:Math.max(.06,Math.min(.94,(e.clientX-r.left)/W)),y:Math.max(.08,Math.min(.92,(e.clientY-r.top)/H))};showCursor=false;add(cursor.x,cursor.y);start();};c.onkeydown=e=>{if(e.key.startsWith('Arrow')){e.preventDefault();showCursor=true;cursor.x=Math.max(.06,Math.min(.94,cursor.x+(e.key==='ArrowRight'?.03:e.key==='ArrowLeft'?-.03:0)));cursor.y=Math.max(.08,Math.min(.92,cursor.y+(e.key==='ArrowDown'?.03:e.key==='ArrowUp'?-.03:0)));draw();}if(e.key==='Enter'||e.code==='Space'){e.preventDefault();add(cursor.x,cursor.y);start();}};temp.oninput=()=>{cold=+temp.value;document.getElementById('temperature').textContent='−'+cold+'°C';};document.getElementById('seed').onclick=()=>{add(.17+random()*.66,.18+random()*.64);start();};document.getElementById('pause').onclick=()=>pause(!paused);document.getElementById('reset').onclick=()=>{seeds=[];segments=[];time=0;showCursor=false;document.getElementById('count').textContent='00 SEEDS';draw();};document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='kessho.png';a.href=c.toDataURL();a.click();};rm.addEventListener('change',e=>pause(e.matches));document.addEventListener('visibilitychange',()=>{if(!document.hidden)start();});resize();add(.28,.34,12);add(.66,.61,8);add(.71,.21,3);new ResizeObserver(resize).observe(c);pause(paused);window.artworkState=()=>({number:21,time,frames,paused,seeds:seeds.length,segments:segments.length,cold,cursor:{...cursor},growing:segments.some(s=>time<s.start+s.duration),reducedMotion:rm.matches});})();
</script></body></html>
