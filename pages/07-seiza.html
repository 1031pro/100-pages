<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まだ名前のない星座</title>
<meta name="description" content="星を押して線で結ぶ。隠れた星座の形と一致すると、名前と一文が現れる。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 120% 80% at 50% 110%, #1a1f3a 0%, #0a0d1f 45%, #04060f 100%);
    color: #e6e4dc; font-family: "Zen Old Mincho", "Cormorant Garamond", serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  svg.sky { position: fixed; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  .star { fill: #fff; transition: r .2s; }
  .star.hot { cursor: pointer; }
  .halo { fill: none; stroke: rgba(255,255,255,0.0); stroke-width: 1; transition: stroke .2s, r .2s; }
  .hot:hover + .halo, .halo.sel { stroke: rgba(255,240,200,0.8); }
  .edge { stroke: rgba(230,228,220,0.55); stroke-width: 1.2; stroke-linecap: round; }
  .edge.done { stroke: #ffe9a8; stroke-width: 1.6; filter: drop-shadow(0 0 6px rgba(255,233,168,0.9)); }
  .rubber { stroke: rgba(230,228,220,0.35); stroke-width: 1; stroke-dasharray: 4 6; }
  .hintline { stroke: rgba(255,233,168,0.0); stroke-width: 1; stroke-dasharray: 2 6; transition: stroke .6s; }
  .hintline.on { stroke: rgba(255,233,168,0.45); }
  .label { font-family: "Zen Old Mincho", serif; fill: #ffe9a8; font-size: 22px; letter-spacing: .3em; opacity: 0; transition: opacity 1.2s; }
  .label.on { opacity: 1; }
  .label.small { font-size: 12px; letter-spacing: .15em; fill: rgba(230,228,220,0.75); }

  .ui { position: fixed; left: 28px; top: 26px; z-index: 3; pointer-events: none; }
  .ui h1 { font-size: 22px; font-weight: 700; letter-spacing: .3em; }
  .ui p { font-size: 12px; letter-spacing: .15em; color: rgba(230,228,220,0.6); margin-top: 8px; line-height: 1.9; }
  .found { position: fixed; right: 28px; top: 26px; z-index: 3; text-align: right; font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 14px; color: rgba(230,228,220,0.6); }
  .found b { display: block; font-size: 44px; font-style: normal; color: #ffe9a8; line-height: 1; font-family: "Zen Old Mincho", serif; font-weight: 400; }
  .story {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 3;
    width: min(560px, 90vw); text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 1.4s;
  }
  .story.on { opacity: 1; }
  .story h2 { font-size: 26px; letter-spacing: .4em; color: #ffe9a8; font-weight: 400; }
  .story p { font-size: 15px; line-height: 2; margin-top: 10px; color: rgba(230,228,220,0.85); }
  .btns { position: fixed; left: 28px; bottom: 30px; z-index: 3; display: flex; gap: 10px; }
  .btns button { font: inherit; font-size: 12px; letter-spacing: .2em; color: #e6e4dc; background: transparent; border: 1px solid rgba(230,228,220,0.35); padding: 8px 14px; cursor: pointer; }
  .btns button:hover { border-color: #ffe9a8; color: #ffe9a8; }
  .horizon { position: fixed; left: 0; right: 0; bottom: 0; height: 18vh; pointer-events: none;
    background: linear-gradient(to top, rgba(10,13,31,0.9), transparent); }
  .mountains { position: fixed; left: 0; right: 0; bottom: 0; height: 22vh; pointer-events: none; }
  .mountains path { fill: #05070f; }
</style>
</head>
<body>

<svg class="sky" id="sky"></svg>
<div class="horizon"></div>
<svg class="mountains" viewBox="0 0 1600 220" preserveAspectRatio="none"><path d="M0 220 L0 160 L120 120 L220 150 L340 80 L430 130 L560 60 L680 140 L790 90 L900 150 L1010 100 L1130 160 L1260 70 L1380 130 L1500 100 L1600 150 L1600 220 Z"/></svg>

<div class="ui">
  <h1>まだ名前のない星座</h1>
  <p>明るい星を順に押して、線で結ぶ。<br>隠れている形と一致すると、名前が浮かぶ。<br>右クリックで線を消す。</p>
</div>
<div class="found"><b id="cnt">0</b>／6 見つけた</div>
<div class="story" id="story"><h2 id="sname"></h2><p id="stext"></p></div>
<div class="btns"><button id="hint">ヒント</button><button id="reset">夜をやり直す</button><button id="auto">全部つなぐ</button></div>

<script>
(() => {
  const svg = document.getElementById('sky');
  const NS = 'http://www.w3.org/2000/svg';
  const W = () => innerWidth, H = () => innerHeight;
  const el = (n, a = {}) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };

  // 星座：正規化座標（0..1）の星と、辺のリスト
  const constellations = [
    { name: '傘', text: '雨の夜にだけよく見える。開いているのか閉じているのかは、見る人が決める。',
      stars: [[.14,.22],[.20,.14],[.27,.20],[.205,.30],[.21,.42]], edges: [[0,1],[1,2],[0,3],[3,2],[3,4]] },
    { name: '鍵', text: '何を開けるためのものかは忘れられた。それでも毎晩、同じ場所に掛かっている。',
      stars: [[.42,.12],[.48,.10],[.50,.17],[.44,.19],[.46,.30],[.50,.34],[.46,.38]], edges: [[0,1],[1,2],[2,3],[3,0],[3,4],[4,5],[4,6]] },
    { name: '猫の耳', text: '春の東の空。ふたつの三角が、何かを聞いている。',
      stars: [[.66,.14],[.70,.06],[.74,.14],[.78,.06],[.82,.14]], edges: [[0,1],[1,2],[2,3],[3,4],[0,4]] },
    { name: '手紙', text: '折り目のところで一度暗くなる。返事は来なかった、と古い星図の余白にある。',
      stars: [[.60,.46],[.76,.46],[.76,.60],[.60,.60],[.68,.54]], edges: [[0,1],[1,2],[2,3],[3,0],[0,4],[4,1]] },
    { name: '橋', text: '川は見えないが、渡っている途中の誰かが見える。',
      stars: [[.10,.60],[.18,.52],[.28,.50],[.38,.52],[.46,.60]], edges: [[0,1],[1,2],[2,3],[3,4]] },
    { name: '杯', text: '一年に一度、月がこの中に入る。そのとき、こぼれた光が流れ星になる。',
      stars: [[.84,.30],[.92,.30],[.90,.42],[.86,.42],[.88,.50],[.84,.56],[.92,.56]], edges: [[0,1],[1,2],[2,3],[3,0],[3,4],[2,4],[4,5],[4,6]] },
  ];

  // 背景の小さな星
  const bg = el('g'); svg.appendChild(bg);
  const twinkle = [];
  for (let i = 0; i < 260; i++) {
    const s = el('circle', { cx: Math.random(), cy: Math.random(), r: (Math.random() * 1.1 + 0.3), fill: '#fff', opacity: (Math.random() * .6 + .2).toFixed(2) });
    s.dataset.nx = s.getAttribute('cx'); s.dataset.ny = s.getAttribute('cy'); s.dataset.ph = Math.random() * 6.28;
    bg.appendChild(s); twinkle.push(s);
  }
  // 天の川
  const milky = el('ellipse', { cx: 0, cy: 0, rx: 0, ry: 0, fill: 'url(#mw)' });
  const defs = el('defs'); defs.innerHTML = `<radialGradient id="mw"><stop offset="0" stop-color="rgba(200,210,255,0.10)"/><stop offset="1" stop-color="rgba(200,210,255,0)"/></radialGradient>`;
  svg.insertBefore(defs, bg); svg.insertBefore(milky, bg);

  // 明るい星（星座の頂点）＋ダミーの明るい星
  const gHint = el('g'), gEdges = el('g'), gStars = el('g'), gLabels = el('g');
  svg.append(gHint, gEdges, gStars, gLabels);
  const stars = []; // {nx, ny, c, i, circle, halo}
  constellations.forEach((c, ci) => c.stars.forEach(([nx, ny], si) => stars.push({ nx, ny, c: ci, i: si })));
  const decoys = [[.33,.33],[.55,.25],[.06,.42],[.36,.75],[.52,.80],[.72,.78],[.95,.72],[.30,.08],[.58,.06],[.88,.10],[.04,.10],[.62,.36],[.24,.66],[.50,.52]];
  decoys.forEach(([nx, ny]) => stars.push({ nx, ny, c: -1, i: -1 }));
  stars.forEach((s, idx) => {
    s.idx = idx;
    s.circle = el('circle', { class: 'star hot', r: s.c >= 0 ? 2.6 : 2.2 });
    s.halo = el('circle', { class: 'halo', r: 10 });
    s.circle.dataset.idx = idx;
    gStars.append(s.circle, s.halo);
  });
  const rubber = el('line', { class: 'rubber', x1: 0, y1: 0, x2: 0, y2: 0, opacity: 0 }); gEdges.appendChild(rubber);

  // ヒント線とラベル
  constellations.forEach((c, ci) => {
    c.hintEls = c.edges.map(([a, b]) => { const l = el('line', { class: 'hintline' }); gHint.appendChild(l); return l; });
    c.label = el('text', { class: 'label', 'text-anchor': 'middle' }); c.label.textContent = c.name; gLabels.appendChild(c.label);
    c.found = false;
  });

  const px = (s) => [s.nx * W(), s.ny * H()];
  const layout = () => {
    svg.setAttribute('viewBox', `0 0 ${W()} ${H()}`);
    twinkle.forEach(s => { s.setAttribute('cx', s.dataset.nx * W()); s.setAttribute('cy', s.dataset.ny * H()); });
    milky.setAttribute('cx', W() * .55); milky.setAttribute('cy', H() * .45); milky.setAttribute('rx', W() * .5); milky.setAttribute('ry', H() * .22); milky.setAttribute('transform', `rotate(-25 ${W()*.55} ${H()*.45})`);
    stars.forEach(s => { const [x, y] = px(s); s.circle.setAttribute('cx', x); s.circle.setAttribute('cy', y); s.halo.setAttribute('cx', x); s.halo.setAttribute('cy', y); });
    constellations.forEach(c => {
      c.edges.forEach(([a, b], k) => { const A = px(stars.find(s => s.c === c.idx0 && s.i === a) || {}), B = px({}); });
      const cs = stars.filter(s => s.c === constellations.indexOf(c));
      c.edges.forEach(([a, b], k) => { const [x1, y1] = px(cs[a]), [x2, y2] = px(cs[b]); const l = c.hintEls[k]; l.setAttribute('x1', x1); l.setAttribute('y1', y1); l.setAttribute('x2', x2); l.setAttribute('y2', y2); });
      const cx = cs.reduce((s, q) => s + q.nx, 0) / cs.length * W(), cy = Math.max(...cs.map(q => q.ny)) * H() + 34;
      c.label.setAttribute('x', cx); c.label.setAttribute('y', cy);
    });
    drawnEdges.forEach(e => { const [x1, y1] = px(stars[e.a]), [x2, y2] = px(stars[e.b]); e.el.setAttribute('x1', x1); e.el.setAttribute('y1', y1); e.el.setAttribute('x2', x2); e.el.setAttribute('y2', y2); });
  };
  const drawnEdges = []; // {a,b,el}
  addEventListener('resize', layout);

  // またたき
  let t = 0;
  const tick = () => { t += 0.02; for (let i = 0; i < twinkle.length; i += 3) { const s = twinkle[i]; s.setAttribute('opacity', (0.35 + 0.35 * Math.sin(t + +s.dataset.ph)).toFixed(2)); } requestAnimationFrame(tick); };
  tick();

  // 操作
  let sel = null;
  const key = (a, b) => a < b ? `${a}-${b}` : `${b}-${a}`;
  const has = (a, b) => drawnEdges.some(e => key(e.a, e.b) === key(a, b));
  const addEdge = (a, b, silent) => {
    if (a === b || has(a, b)) return;
    const [x1, y1] = px(stars[a]), [x2, y2] = px(stars[b]);
    const l = el('line', { class: 'edge', x1, y1, x2, y2 });
    gEdges.insertBefore(l, rubber);
    drawnEdges.push({ a, b, el: l });
    check(silent);
  };
  const cntEl = document.getElementById('cnt'), story = document.getElementById('story'), sname = document.getElementById('sname'), stext = document.getElementById('stext');
  const check = (silent) => {
    constellations.forEach((c, ci) => {
      if (c.found) return;
      const cs = stars.filter(s => s.c === ci);
      const ok = c.edges.every(([a, b]) => has(cs[a].idx, cs[b].idx));
      if (ok) {
        c.found = true;
        c.edges.forEach(([a, b]) => { const e = drawnEdges.find(e => key(e.a, e.b) === key(cs[a].idx, cs[b].idx)); e.el.classList.add('done'); e.locked = true; });
        c.label.classList.add('on');
        cntEl.textContent = constellations.filter(x => x.found).length;
        if (!silent) { sname.textContent = c.name; stext.textContent = c.text; story.classList.add('on'); clearTimeout(story._t); story._t = setTimeout(() => story.classList.remove('on'), 7000); }
      }
    });
  };
  svg.addEventListener('pointerdown', (e) => {
    const c = e.target.closest('.star');
    if (e.button === 2) return;
    if (!c) { if (sel !== null) { sel.halo.classList.remove('sel'); sel = null; rubber.setAttribute('opacity', 0); } return; }
    const s = stars[+c.dataset.idx];
    if (sel === null) { sel = s; s.halo.classList.add('sel'); rubber.setAttribute('opacity', 1); }
    else { addEdge(sel.idx, s.idx); sel.halo.classList.remove('sel'); sel = s; s.halo.classList.add('sel'); }
  });
  svg.addEventListener('pointermove', (e) => {
    if (sel === null) return;
    const [x1, y1] = px(sel);
    rubber.setAttribute('x1', x1); rubber.setAttribute('y1', y1); rubber.setAttribute('x2', e.clientX); rubber.setAttribute('y2', e.clientY);
  });
  // 右クリックで最後の線を消す
  addEventListener('contextmenu', (e) => {
    e.preventDefault();
    for (let i = drawnEdges.length - 1; i >= 0; i--) { if (!drawnEdges[i].locked) { drawnEdges[i].el.remove(); drawnEdges.splice(i, 1); break; } }
  });
  document.getElementById('hint').addEventListener('click', () => {
    const c = constellations.find(x => !x.found); if (!c) return;
    c.hintEls.forEach(l => l.classList.add('on'));
    setTimeout(() => c.hintEls.forEach(l => l.classList.remove('on')), 2600);
  });
  document.getElementById('reset').addEventListener('click', () => {
    drawnEdges.forEach(e => e.el.remove()); drawnEdges.length = 0;
    constellations.forEach(c => { c.found = false; c.label.classList.remove('on'); });
    cntEl.textContent = 0; story.classList.remove('on'); sel = null; rubber.setAttribute('opacity', 0);
  });
  document.getElementById('auto').addEventListener('click', async () => {
    for (const c of constellations) {
      if (c.found) continue;
      const cs = stars.filter(s => s.c === constellations.indexOf(c));
      for (const [a, b] of c.edges) { addEdge(cs[a].idx, cs[b].idx, true); await new Promise(r => setTimeout(r, 140)); }
      await new Promise(r => setTimeout(r, 400));
    }
  });

  layout();
})();
</script>
</body>
</html>
