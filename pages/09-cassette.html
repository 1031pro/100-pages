<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIXTAPE 1989</title>
<meta name="description" content="再生するとリールが回り、ブラウザが即興でローファイの曲を作る。裏返すとB面。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Kaku+Gothic+New:wght@500;900&family=Monoton&display=swap" rel="stylesheet">
<style>
  :root { --peach: #ffb7a5; --mint: #a8e6cf; --lav: #c3b1e1; --sun: #ffe08a; --ink: #2b2140; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; overflow-x: hidden;
    background: #f6efe6;
    background-image:
      radial-gradient(circle at 15% 20%, var(--peach) 0, transparent 35%),
      radial-gradient(circle at 85% 15%, var(--lav) 0, transparent 30%),
      radial-gradient(circle at 70% 90%, var(--mint) 0, transparent 35%),
      radial-gradient(circle at 20% 85%, var(--sun) 0, transparent 30%);
    font-family: "Zen Kaku Gothic New", sans-serif; color: var(--ink);
    display: grid; place-items: center; padding: 40px 20px;
  }
  /* メンフィス風の散らかった図形 */
  .memphis { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .memphis i { position: absolute; display: block; }
  .memphis .sq { width: 60px; height: 60px; border: 6px solid var(--ink); left: 8%; top: 12%; transform: rotate(15deg); }
  .memphis .zig { left: 78%; top: 70%; width: 140px; height: 24px; background: repeating-linear-gradient(-45deg, var(--ink) 0 6px, transparent 6px 16px); }
  .memphis .dot { right: 10%; top: 30%; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, var(--ink) 0 3px, transparent 4px) 0 0 / 16px 16px; }
  .memphis .tri { left: 12%; bottom: 14%; width: 0; height: 0; border-left: 40px solid transparent; border-right: 40px solid transparent; border-bottom: 70px solid var(--peach); transform: rotate(-12deg); }

  .wrap { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; max-width: 1080px; width: 100%; }
  h1 { font-family: "Monoton", cursive; font-weight: 400; font-size: clamp(30px, 5vw, 56px); letter-spacing: .06em; color: var(--ink); line-height: 1; }
  h1 span { display: block; font-family: "Yomogi", cursive; font-size: 18px; letter-spacing: .1em; margin-top: 8px; }

  /* カセット */
  .deck { perspective: 1400px; }
  .cassette {
    position: relative; width: 100%; aspect-ratio: 10 / 6.3; max-width: 520px; margin: 0 auto;
    transform-style: preserve-3d; transition: transform 1.1s cubic-bezier(.6,0,.2,1);
  }
  .cassette.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden;
    background: linear-gradient(160deg, #3a3350, #201b30); border-radius: 12px;
    box-shadow: 0 30px 60px rgba(43,33,64,.35), inset 0 2px 0 rgba(255,255,255,.15);
    padding: 6%;
  }
  .face.back { transform: rotateY(180deg); background: linear-gradient(160deg, #ffe08a, #ffb7a5); }
  .label {
    position: absolute; left: 6%; right: 6%; top: 7%; height: 54%;
    background: linear-gradient(#fff9ee, #f4ead8); border-radius: 8px;
    box-shadow: inset 0 0 0 2px #e6d9c0;
    padding: 12px 18px;
  }
  .label .stripe { position: absolute; left: 0; right: 0; top: 0; height: 12px; border-radius: 8px 8px 0 0; background: linear-gradient(90deg, var(--peach), var(--sun), var(--mint), var(--lav)); }
  .label .side { position: absolute; left: 18px; top: 22px; width: 34px; height: 34px; border: 3px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 18px; }
  .label .title { position: absolute; left: 66px; top: 24px; right: 18px; font-family: "Yomogi", cursive; font-size: clamp(16px, 2.6vw, 22px); line-height: 1.15; }
  .label .title small { display: block; font-size: 12px; margin-top: 4px; opacity: .7; }
  .label .lines { position: absolute; left: 18px; right: 18px; bottom: 14px; height: 30%; background: repeating-linear-gradient(0deg, transparent 0 14px, #d8cbb0 14px 15px); }
  .label .now { position: absolute; left: 18px; right: 18px; bottom: 16px; font-family: "Yomogi", cursive; font-size: 14px; color: #b3262c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .window {
    position: absolute; left: 22%; right: 22%; top: 34%; height: 30%;
    background: rgba(0,0,0,.55); border-radius: 30px; border: 3px solid #17131f;
    box-shadow: inset 0 0 20px #000;
    display: flex; justify-content: space-between; align-items: center; padding: 0 8%;
  }
  .reel { position: relative; width: 26%; aspect-ratio: 1; display: grid; place-items: center; }
  .reel .tape { position: absolute; border-radius: 50%; background: #3b2a1a; box-shadow: inset 0 0 0 2px #2a1c10; }
  .reel .hub {
    position: absolute; width: 52%; aspect-ratio: 1; border-radius: 50%; background: #e9e4dc; z-index: 2;
    background-image: repeating-conic-gradient(#e9e4dc 0 45deg, #6f6a62 45deg 60deg);
    box-shadow: 0 0 0 3px #17131f;
  }
  .playing .reel .hub { animation: spin 1.2s linear infinite; }
  .reel.r .hub { animation-duration: 1.6s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .screws i { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #8d8799; box-shadow: inset 0 0 0 2px #17131f; }
  .screws i:nth-child(1) { left: 3%; top: 5%; } .screws i:nth-child(2) { right: 3%; top: 5%; } .screws i:nth-child(3) { left: 3%; bottom: 5%; } .screws i:nth-child(4) { right: 3%; bottom: 5%; }
  .bottom { position: absolute; left: 20%; right: 20%; bottom: 4%; height: 12%; background: #17131f; border-radius: 10px 10px 3px 3px; display: flex; justify-content: space-around; align-items: center; }
  .bottom i { width: 12px; height: 12px; border-radius: 50%; background: #3a3350; }
  .bottom .slot { width: 20%; height: 40%; background: #000; border-radius: 3px; }
  .back .label { background: linear-gradient(#fff, #fdf6ec); }

  /* デッキ操作 */
  .controls { margin-top: 26px; display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .controls button {
    font: inherit; font-weight: 900; font-size: 14px; letter-spacing: .1em; cursor: pointer;
    padding: 12px 18px; border: 3px solid var(--ink); background: #fff; border-radius: 10px;
    box-shadow: 4px 4px 0 var(--ink); transition: transform .08s, box-shadow .08s;
  }
  .controls button:active, .controls button.on { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); background: var(--sun); }
  .counter { font-family: "Monoton", cursive; font-size: 26px; background: #17131f; color: #ff6b2b; padding: 6px 14px; border-radius: 6px; letter-spacing: .12em; min-width: 110px; text-align: center; }
  .vu { display: flex; gap: 3px; align-items: flex-end; height: 26px; }
  .vu i { width: 6px; background: var(--ink); height: 4px; transition: height .08s; }

  /* J カード */
  .jcard {
    background: #fff; border: 3px solid var(--ink); border-radius: 6px; padding: 28px 30px;
    box-shadow: 8px 8px 0 var(--lav); transform: rotate(-1.2deg);
  }
  .jcard h2 { font-family: "Yomogi", cursive; font-size: 22px; margin-bottom: 4px; }
  .jcard .sub { font-size: 12px; letter-spacing: .15em; opacity: .65; margin-bottom: 16px; }
  .jcard ol { list-style: none; }
  .jcard li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 4px; border-bottom: 1px dashed #cdbfd8; font-family: "Yomogi", cursive; font-size: 17px; cursor: pointer; }
  .jcard li:hover { background: #fff3c4; }
  .jcard li.on { background: var(--sun); }
  .jcard li span:last-child { font-family: "Zen Kaku Gothic New", sans-serif; font-size: 12px; opacity: .6; }
  .jcard .side-h { font-weight: 900; margin: 18px 0 6px; font-size: 13px; letter-spacing: .2em; }
  .jcard .note { margin-top: 20px; font-family: "Yomogi", cursive; font-size: 14px; line-height: 1.8; color: #5a4a7a; }
  .hintline { margin-top: 20px; text-align: center; font-size: 12px; letter-spacing: .15em; opacity: .6; }

  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } .jcard { transform: none; } }
</style>
</head>
<body>
<div class="memphis"><i class="sq"></i><i class="zig"></i><i class="dot"></i><i class="tri"></i></div>

<div class="wrap">
  <div>
    <h1>MIXTAPE<span>一九八九年、夏。ブラウザが即興で弾く十曲。</span></h1>
    <div class="deck" style="margin-top:24px">
      <div class="cassette" id="cassette">
        <div class="face front">
          <div class="screws"><i></i><i></i><i></i><i></i></div>
          <div class="label"><div class="stripe"></div><div class="side">A</div><div class="title">夏のおわりに聴くやつ<small>for someone — 1989.08</small></div><div class="lines"></div><div class="now" id="nowA"></div></div>
          <div class="window"><div class="reel l"><div class="tape" id="tapeL"></div><div class="hub"></div></div><div class="reel r"><div class="tape" id="tapeR"></div><div class="hub"></div></div></div>
          <div class="bottom"><i></i><div class="slot"></div><i></i><div class="slot"></div><i></i></div>
        </div>
        <div class="face back">
          <div class="screws"><i></i><i></i><i></i><i></i></div>
          <div class="label"><div class="stripe"></div><div class="side">B</div><div class="title">夜にひとりで聴くやつ<small>side B — 巻き戻し不要</small></div><div class="lines"></div><div class="now" id="nowB"></div></div>
          <div class="window"><div class="reel l"><div class="tape" id="tapeL2"></div><div class="hub"></div></div><div class="reel r"><div class="tape" id="tapeR2"></div><div class="hub"></div></div></div>
          <div class="bottom"><i></i><div class="slot"></div><i></i><div class="slot"></div><i></i></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button id="play">▶ PLAY</button>
      <button id="stop">■ STOP</button>
      <button id="next">⏭ NEXT</button>
      <button id="flip">⟲ 裏返す</button>
      <div class="counter" id="counter">000</div>
      <div class="vu" id="vu"></div>
    </div>
    <div class="hintline">音が出ます。曲は毎回少しずつ違います。</div>
  </div>

  <div class="jcard" id="jcard">
    <h2>曲目</h2>
    <div class="sub">TRACK LIST — 手書き</div>
    <div class="side-h">SIDE A</div><ol id="listA"></ol>
    <div class="side-h">SIDE B</div><ol id="listB"></ol>
    <p class="note">ダビングしたので音は少し悪い。三曲目のあたりでテープが伸びてるのは、あの日ラジカセを落としたから。</p>
  </div>
</div>

<script>
(() => {
  // 曲：キー、BPM、コード進行（ローマ数字→半音）、音色
  const tracks = {
    A: [
      { t: '自転車と夕立', bpm: 92, key: 0, prog: [[0,'maj7'],[5,'maj7'],[7,'7'],[9,'m7']], wave: 'triangle' },
      { t: '砂の入った靴', bpm: 78, key: 3, prog: [[9,'m7'],[5,'maj7'],[0,'maj7'],[7,'7']], wave: 'sine' },
      { t: '（テープが伸びてる）', bpm: 70, key: 7, prog: [[0,'maj7'],[4,'m7'],[5,'maj7'],[7,'7']], wave: 'triangle', wobble: 2.5 },
      { t: '花火の帰り道', bpm: 100, key: 10, prog: [[5,'maj7'],[7,'7'],[9,'m7'],[0,'maj7']], wave: 'square' },
      { t: '九月になる前に', bpm: 84, key: 5, prog: [[0,'maj7'],[9,'m7'],[2,'m7'],[7,'7']], wave: 'sine' },
    ],
    B: [
      { t: '窓を開けたまま', bpm: 64, key: 2, prog: [[0,'maj7'],[2,'m7'],[5,'maj7'],[4,'m7']], wave: 'sine' },
      { t: '街灯の数を数える', bpm: 72, key: 8, prog: [[9,'m7'],[7,'7'],[0,'maj7'],[5,'maj7']], wave: 'triangle' },
      { t: '留守番電話', bpm: 60, key: 1, prog: [[5,'maj7'],[4,'m7'],[2,'m7'],[7,'7']], wave: 'sine' },
      { t: '午前三時の冷蔵庫', bpm: 88, key: 6, prog: [[0,'maj7'],[7,'7'],[9,'m7'],[5,'maj7']], wave: 'square' },
      { t: 'おやすみ（最後まで）', bpm: 58, key: 0, prog: [[5,'maj7'],[0,'maj7'],[5,'maj7'],[0,'maj7']], wave: 'triangle' },
    ],
  };
  const chordNotes = { maj7: [0,4,7,11], m7: [0,3,7,10], '7': [0,4,7,10] };
  const f = (m) => 440 * Math.pow(2, (m - 69) / 12);

  const cassette = document.getElementById('cassette');
  const listA = document.getElementById('listA'), listB = document.getElementById('listB');
  const nowA = document.getElementById('nowA'), nowB = document.getElementById('nowB');
  const counter = document.getElementById('counter'), vu = document.getElementById('vu');
  for (let i = 0; i < 12; i++) vu.appendChild(document.createElement('i'));
  const vuBars = [...vu.children];

  let side = 'A', idx = 0, playing = false, ac, master, analyser, timer, startAt = 0, count = 0, lfoNode;
  const render = () => {
    [['A', listA], ['B', listB]].forEach(([s, ol]) => {
      ol.innerHTML = '';
      tracks[s].forEach((tr, i) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${i + 1}. ${tr.t}</span><span>${tr.bpm} bpm</span>`;
        li.classList.toggle('on', s === side && i === idx);
        li.addEventListener('click', () => { if (s !== side) flip(); idx = i; if (playing) restart(); else render(); });
        ol.appendChild(li);
      });
    });
    nowA.textContent = side === 'A' ? '▶ ' + tracks.A[idx].t : '';
    nowB.textContent = side === 'B' ? '▶ ' + tracks.B[idx].t : '';
    document.getElementById('play').classList.toggle('on', playing);
  };

  const ensure = () => {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.5;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.Q.value = 0.7;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 90;
    analyser = ac.createAnalyser(); analyser.fftSize = 64;
    master.connect(lp); lp.connect(hp); hp.connect(analyser); analyser.connect(ac.destination);
    // テープのヒスノイズ
    const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.35;
    const noise = ac.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const ng = ac.createGain(); ng.gain.value = 0.012; const nf = ac.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 6000; nf.Q.value = 0.4;
    noise.connect(nf); nf.connect(ng); ng.connect(master); noise.start();
    // ワウ・フラッター
    lfoNode = ac.createOscillator(); lfoNode.frequency.value = 0.9; const lg = ac.createGain(); lg.gain.value = 6; lfoNode.connect(lg); lfoNode.start();
    ac._wow = lg;
  };

  let voices = [];
  const note = (midi, t, dur, wave, gain) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = wave; o.frequency.value = f(midi); ac._wow.connect(o.detune);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05); voices.push(o);
  };
  const kick = (t) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.3); };
  const hat = (t) => { const b = ac.createBuffer(1, 2000, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1); const s = ac.createBufferSource(); s.buffer = b; const g = ac.createGain(); g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05); const hpf = ac.createBiquadFilter(); hpf.type = 'highpass'; hpf.frequency.value = 7000; s.connect(hpf); hpf.connect(g); g.connect(master); s.start(t); };

  let bar = 0, nextTime = 0;
  const schedule = () => {
    if (!playing) return;
    const tr = tracks[side][idx]; const beat = 60 / tr.bpm; const barLen = beat * 4;
    ac._wow.gain.value = tr.wobble || 6;
    while (nextTime < ac.currentTime + 0.6) {
      const [root, q] = tr.prog[bar % tr.prog.length];
      const base = 48 + tr.key + root;
      const notes = chordNotes[q].map(n => base + n);
      // コード（ゆっくり）
      notes.forEach((n, k) => note(n + (k === 0 ? -12 : 0), nextTime + 0.01 * k, barLen * 0.95, tr.wave, 0.09));
      // メロディ：コードトーンからランダムに
      for (let b = 0; b < 4; b++) {
        if (Math.random() < 0.7) { const n = notes[Math.floor(Math.random() * notes.length)] + 12 + (Math.random() < .3 ? 2 : 0); note(n, nextTime + b * beat + (Math.random() < .3 ? beat / 2 : 0), beat * 0.9, 'sine', 0.12); }
        kick(nextTime + b * beat); if (b % 2 === 1) hat(nextTime + b * beat); hat(nextTime + b * beat + beat / 2);
      }
      nextTime += barLen; bar++;
      if (bar % 16 === 0) { idx = (idx + 1) % tracks[side].length; bar = 0; render(); }
    }
    timer = setTimeout(schedule, 200);
  };

  const play = () => {
    ensure(); if (ac.state === 'suspended') ac.resume();
    playing = true; cassette.classList.add('playing'); bar = 0; nextTime = ac.currentTime + 0.05; startAt = performance.now() - count * 1000;
    render(); schedule(); loop();
  };
  const stop = () => { playing = false; cassette.classList.remove('playing'); clearTimeout(timer); voices.forEach(v => { try { v.stop(); } catch (e) {} }); voices = []; render(); };
  const restart = () => { stop(); play(); };
  const flip = () => { side = side === 'A' ? 'B' : 'A'; idx = 0; cassette.classList.toggle('flipped', side === 'B'); if (playing) restart(); else render(); };

  document.getElementById('play').addEventListener('click', () => { if (!playing) play(); });
  document.getElementById('stop').addEventListener('click', stop);
  document.getElementById('next').addEventListener('click', () => { idx = (idx + 1) % tracks[side].length; if (playing) restart(); else render(); });
  document.getElementById('flip').addEventListener('click', flip);

  // カウンター・テープ量・VU
  const data = new Uint8Array(32);
  const loop = () => {
    if (!playing) return;
    count = (performance.now() - startAt) / 1000;
    counter.textContent = String(Math.floor(count * 2.3) % 1000).padStart(3, '0');
    const p = (count % 240) / 240; // 4分で片面
    const setTape = (l, r) => { const L = 40 + (1 - p) * 40, R = 40 + p * 40; l.style.width = L + '%'; l.style.height = L + '%'; r.style.width = R + '%'; r.style.height = R + '%'; };
    setTape(document.getElementById('tapeL'), document.getElementById('tapeR'));
    setTape(document.getElementById('tapeL2'), document.getElementById('tapeR2'));
    analyser.getByteFrequencyData(data);
    vuBars.forEach((b, i) => b.style.height = (4 + data[i * 2] / 255 * 22) + 'px');
    requestAnimationFrame(loop);
  };
  ['tapeL', 'tapeR', 'tapeL2', 'tapeR2'].forEach((id, k) => { const e = document.getElementById(id); const s = k % 2 === 0 ? 80 : 40; e.style.width = s + '%'; e.style.height = s + '%'; });
  render();
})();
</script>
</body>
</html>
