<script>

   const angle=random()*TAU,rad=Math.sqrt(random())*.87,r=.065+random()*.095;

 }
 function drawPiece(p){

  const r=p.r,c=p.color;

  if(p.type==='ring'){
   const g=s.createLinearGradient(-r,-r,r,r);g.addColorStop(0,c[2]);g.addColorStop(.16,c[1]+'80');g.addColorStop(.5,c[0]+'cb');g.addColorStop(.7,c[2]+'b0');g.addColorStop(1,c[1]);
   s.lineWidth=r*.15;s.strokeStyle=g;s.beginPath();s.ellipse(0,0,r,r*.8,0,0,TAU);s.stroke();s.shadowBlur=0;
   s.lineWidth=.0025;s.strokeStyle='#ffffe3d0';s.beginPath();s.ellipse(0,0,r*.95,r*.75,0,3.2,5.4);s.stroke();
  }else{
   shape();const g=s.createLinearGradient(-r,-r,r,r);g.addColorStop(0,c[2]+'f0');g.addColorStop(.1,c[1]+'c0');g.addColorStop(.42,c[0]+'a0');g.addColorStop(.72,c[1]+'6a');g.addColorStop(.93,c[2]+'d0');g.addColorStop(1,c[0]+'ee');s.fillStyle=g;s.fill();s.shadowBlur=0;s.shadowOffsetX=s.shadowOffsetY=0;
   s.save();shape();s.clip();
   const glow=s.createRadialGradient(r*.3,r*.42,r*.04,r*.1,r*.2,r*1.1);glow.addColorStop(0,c[2]+'bc');glow.addColorStop(.28,c[1]+'22');glow.addColorStop(1,c[0]+'00');s.fillStyle=glow;s.fillRect(-r,-r,r*2,r*2);

   s.strokeStyle=c[2]+'59';s.lineWidth=r*.06;s.beginPath();s.moveTo(-r*.72,-r*.6);s.bezierCurveTo(-r*.1,-r*.2,-r*.12,r*.5,r*.64,r*.56);s.stroke();
   for(let j=0;j<5;j++){const q=p.facets[j%p.facets.length],x=(q-.5)*r*1.2,y=(p.facets[(j+2)%p.facets.length]-.5)*r; s.strokeStyle='#effee963';s.lineWidth=.0014;s.beginPath();s.ellipse(x,y,r*(.012+q*.02),r*(.022+q*.03),.4,0,TAU);s.stroke();}
   s.restore();shape();s.strokeStyle=c[0]+'d0';s.lineWidth=.004;s.stroke();
   s.save();s.scale(.955,.955);shape();s.strokeStyle=c[2]+'b8';s.lineWidth=.004;s.stroke();s.restore();
   s.save();s.scale(.89,.89);shape();s.strokeStyle=c[1]+'80';s.lineWidth=.005;s.stroke();s.restore();
   s.strokeStyle='#fff8dddf';s.lineWidth=.0027;s.beginPath();if(p.type==='bead')s.ellipse(0,0,r*.91,r*.69,0,3.6,5.08);else{s.moveTo(...p.points[0]);s.lineTo(...p.points[1]);}s.stroke();

 }
 function buildSprite(p){
  const prior=s,c=document.createElement('canvas');c.width=c.height=192;s=c.getContext('2d');const rr=p.r*1.3;s.translate(96,96);s.scale(96/rr,96/rr);drawPiece({...p,x:0,y:0,angle:0});s=prior;p.sprite=c;p.spriteR=rr;
 }
 function texture(){

   const a=Math.PI/4+i*Math.PI/2;g.save();g.translate(Math.cos(a)*1.035,Math.sin(a)*1.035);g.rotate(a);
   const screw=g.createLinearGradient(-.012,-.012,.012,.012);screw.addColorStop(0,'#b5b498');screw.addColorStop(.5,'#34423c');screw.addColorStop(1,'#697565');

  const lens=ctx.createRadialGradient(-R*.3,-R*.42,R*.06,0,0,R);lens.addColorStop(0,'#ffefc008');lens.addColorStop(.72,'#00151b00');lens.addColorStop(.95,'#030d1440');lens.addColorStop(1,'#030d14d0');ctx.fillStyle=lens;ctx.fillRect(-R,-R,R*2,R*2);
  ctx.strokeStyle='#bfe0d722';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(0,0,R*.96,3.63,4.75);ctx.stroke();
  if(flash>0){ctx.fillStyle='rgba(232,230,185,'+flash+')';ctx.fillRect(-R,-R,R*2,R*2);}
  ctx.restore();
  // The notch is coupled to the rotation, not a free-running decoration.
  ctx.save();ctx.translate(cx,cy);ctx.rotate(turn);ctx.strokeStyle='#eee0af';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-R*1.075);ctx.lineTo(0,-R*1.092);ctx.stroke();ctx.restore();
  metrics.frames++;
 }
 function physics(dt){
  const d=dt*60;turn+=angular*d;angular*=Math.pow(.938,d);
  for(const p of pieces){
   p.x+=p.vx*d;p.y+=p.vy*d;p.angle+=p.spin*d;p.vx*=Math.pow(.88,d);p.vy*=Math.pow(.88,d);p.spin*=Math.pow(.9,d);
   const dist=Math.hypot(p.x,p.y),max=.96-p.r*.55;
   if(dist>max){const nx=p.x/dist,ny=p.y/dist;p.x=nx*max;p.y=ny*max;const v=p.vx*nx+p.vy*ny;p.vx-=nx*v*1.5;p.vy-=ny*v*1.5;}
  }
  for(let i=0;i<pieces.length;i++)for(let j=i+1;j<pieces.length;j++){
   const a=pieces[i],b=pieces[j],dx=b.x-a.x,dy=b.y-a.y,rr=(a.r+b.r)*.53,dist=Math.hypot(dx,dy);
   if(dist<rr&&dist>.001){const f=(rr-dist)*.12*d,nx=dx/dist,ny=dy/dist;a.x-=nx*f;a.y-=ny*f;b.x+=nx*f;b.y+=ny*f;}
  }
  open=mix(open,targetOpen,1-Math.pow(.85,d));if(Math.abs(open-targetOpen)<.001)open=targetOpen;
  flash*=Math.pow(.83,d);settle=Math.max(0,settle-dt);
 }
 function step(now){
  raf=0;const dt=Math.min(.033,(now-previous)/1000||.016);previous=now;
  if(!document.hidden){physics(dt);texture();render();}
  if(!document.hidden&&(pointer||settle>0||Math.abs(angular)>.0002||Math.abs(open-targetOpen)>.001))raf=requestAnimationFrame(step);
 }
 function wake(){if(!raf){previous=performance.now();raf=requestAnimationFrame(step);}}
 function impulse(dx,dy){
  const amount=dx*.48+dy*.15;turn+=amount;
  for(const p of pieces){p.vx+=(-p.y*amount+dx*.17)*.14;p.vy+=(p.x*amount+dy*.17)*.14;p.spin+=amount*(.035+p.r*.3);}
  angular=reduced.matches?0:amount*.19;settle=reduced.matches?.12:1.6;wake();
 }
 function oneTurn(dir=1){
  metrics.turns++;if(reduced.matches){turn+=dir*.49;for(const p of pieces)p.angle+=dir*.075;texture();render();return;}
  angular+=dir*.025;for(const p of pieces){p.vx+=-p.y*dir*.003;p.vy+=p.x*dir*.003;p.spin+=dir*.005;}settle=2;wake();
 }
 function toggle(){
  targetOpen=targetOpen?0:1;metrics.opened++;document.getElementById('piece-tools').hidden=!targetOpen;document.querySelector('.room').classList.toggle('is-open',!!targetOpen);
  document.getElementById('open').setAttribute('aria-pressed',String(!!targetOpen));
  document.getElementById('open-label').textContent=targetOpen?'鏡に戻る':'硝子を見る';
  document.getElementById('state').textContent=targetOpen?'模様のもと — 67個の硝子':'鏡の中';
  document.getElementById('instruction').textContent=targetOpen?'硝子を光の扇へ。選んで「光の中へ」でも。':'硝子を転がすように、ゆっくりドラッグ。';
  document.getElementById('announcement').textContent=targetOpen?'鏡を開きました。模様を作る元の硝子を表示しています。':'鏡を閉じました。硝子の反射による模様に戻りました。';
  if(reduced.matches){open=targetOpen;texture();render();}else{settle=.9;wake();}
 }
 function renew(){
  composition++;seed+=1013;metrics.renewed++;makeGlass();angular=0;
  document.getElementById('scene').textContent=String(composition).padStart(2,'0');
  document.getElementById('announcement').textContent='新しい硝子に入れ替えました。景色 '+composition+'。';
  if(reduced.matches){settle=0;texture();render();}else wake();
 }
 input.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
  if(Math.hypot(x-cx,y-cy)>R*1.14)return;
  const local=toGlass(x,y);let held=null;
  if(targetOpen){for(let i=pieces.length-1;i>=0;i--){const p=pieces[i];if(Math.hypot(local.x-p.x,local.y-p.y)<p.r*1.1){held=p;break;}}}
  if(held){selected=pieces.indexOf(held);updateSelection();}pointer={id:e.pointerId,x:e.clientX,y:e.clientY,held};input.setPointerCapture(e.pointerId);input.classList.add('dragging');metrics.gestures++;angular=0;
  if(e.pointerType==='mouse')input.focus({preventScroll:true});e.preventDefault();
 });
 function toGlass(x,y){const dx=(x-cx)/(R*.94),dy=(y-cy)/(R*.94);return{x:dx*Math.cos(turn)+dy*Math.sin(turn),y:-dx*Math.sin(turn)+dy*Math.cos(turn)};}
 input.addEventListener('pointermove',e=>{
  if(!pointer||pointer.id!==e.pointerId)return;
  if(pointer.held){const rect=canvas.getBoundingClientRect(),local=toGlass(e.clientX-rect.left,e.clientY-rect.top),p=pointer.held;p.x=local.x;p.y=local.y;p.vx=p.vy=0;p.angle+=(e.clientX-pointer.x)*.004;settle=reduced.matches?.01:1;wake();}
  else impulse((e.clientX-pointer.x)/R,(e.clientY-pointer.y)/R);
  pointer.x=e.clientX;pointer.y=e.clientY;
 });
 function release(e){if(!pointer||e.pointerId!==pointer.id)return;pointer=null;input.classList.remove('dragging');settle=reduced.matches?0:1.5;wake();}
 input.addEventListener('pointerup',release);input.addEventListener('pointercancel',release);input.addEventListener('lostpointercapture',release);
 input.addEventListener('keydown',e=>{
  if(targetOpen&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const p=pieces[selected],dx=e.key==='ArrowRight'?.035:e.key==='ArrowLeft'?-.035:0,dy=e.key==='ArrowDown'?.035:e.key==='ArrowUp'?-.035:0;p.x+=dx*Math.cos(turn)+dy*Math.sin(turn);p.y+=-dx*Math.sin(turn)+dy*Math.cos(turn);settle=reduced.matches?.01:.3;wake();}
  else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();oneTurn(e.key==='ArrowLeft'?-1:1);}
  else if(e.key==='Enter'){e.preventDefault();toggle();}
  else if(e.key===' '){e.preventDefault();oneTurn();}
  else if(e.key.toLowerCase()==='r'){e.preventDefault();renew();}
 });
 function updateSelection(){document.getElementById('piece-name').textContent='硝子 '+String(selected+1).padStart(2,'0');document.getElementById('announcement').textContent='硝子 '+(selected+1)+' を選びました。';wake();}
 document.getElementById('prev-piece').onclick=()=>{selected=(selected+pieces.length-1)%pieces.length;updateSelection();};document.getElementById('next-piece').onclick=()=>{selected=(selected+1)%pieces.length;updateSelection();};
 document.getElementById('place-piece').onclick=()=>{const p=pieces[selected];p.x=.62*Math.cos(turn);p.y=-.62*Math.sin(turn);p.vx=p.vy=0;settle=reduced.matches?.01:.4;wake();};
 document.getElementById('save').onclick=()=>{const c=document.createElement('canvas');c.width=c.height=1400;const g=c.getContext('2d');g.fillStyle='#11191c';g.fillRect(0,0,1400,1400);const r=R*1.12;g.drawImage(canvas,(cx-r)*D,(cy-r)*D,r*2*D,r*2*D,0,0,1400,1400);const a=document.createElement('a');a.download='mangekyo-'+String(composition).padStart(2,'0')+'.png';a.href=c.toDataURL('image/png');a.click();document.getElementById('announcement').textContent='模様をPNGで保存しました。';};
 document.getElementById('turn').addEventListener('click',()=>oneTurn());document.getElementById('open').addEventListener('click',toggle);document.getElementById('renew').addEventListener('click',renew);
 reduced.addEventListener('change',()=>{if(reduced.matches){angular=0;open=targetOpen;settle=0;flash=0;for(const p of pieces){p.vx=p.vy=p.spin=0;}}wake();});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake();});
 new ResizeObserver(resize).observe(canvas);makeGlass();resize();
 // Read-only local diagnostics for the prototype review; no persistence or network.
 window.kaleidoscopeState=()=>({composition,open,targetOpen,turn,selected,selectedPosition:{x:pieces[selected].x,y:pieces[selected].y},reducedMotion:reduced.matches,pieces:pieces.length,metrics:{...metrics},width:W,height:H,radius:R,center:{x:cx,y:cy},animating:!!raf});
})();
</script>
