(()=>{'use strict';const canvas=document.getElementById('loom'),g=canvas.getContext('2d'),cloth=document.createElement('canvas'),c=cloth.getContext('2d'),rm=matchMedia('(prefers-reduced-motion: reduce)');cloth.width=840;cloth.height=1120;const colors=['#9d493a','#354e62','#b49042','#d4c9a5'],names=['茜','藍','山吹','生成り'],cols=84,maxRows=104;let rows=[],color=0,pattern=2,W,H,D,X,Y,CW,CH,pass=0,dir=1,busy=false,off=false,anim=0,last=0,raf=0,frames=0,drag=null;function rng(n){return()=>{n=(Math.imul(n,1664525)+1013904223)|0;return(n>>>0)/4294967296;};}

function rounded(x,y,w,h,r,fill){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=fill;g.fill();}function wood(x,y,w,h,vertical=false){const grad=g.createLinearGradient(vertical?x:0,vertical?0:y,vertical?x+w:0,vertical?0:y+h);grad.addColorStop(0,'#b99a65');grad.addColorStop(.15,'#d5b883');grad.addColorStop(.53,'#bb9863');grad.addColorStop(1,'#8c714c');g.shadowColor='#40382340';g.shadowBlur=12;g.shadowOffsetY=7;rounded(x,y,w,h,3,grad);g.shadowBlur=0;g.shadowOffsetY=0;const r=rng(Math.floor(x+y));g.save();g.beginPath();g.rect(x,y,w,h);g.clip();for(let i=0;i<28;i++){g.strokeStyle=i%3?'#5f503a24':'#fff0c32f';g.lineWidth=.5+r();g.beginPath();if(vertical){let xx=x+r()*w;g.moveTo(xx,y);g.bezierCurveTo(xx+5,y+h*.3,xx-4,y+h*.6,xx,y+h);}else{let yy=y+r()*h;g.moveTo(x,yy);g.bezierCurveTo(x+w*.3,yy+3,x+w*.6,yy-4,x+w,yy);}g.stroke();}g.restore();}
function clothEdges(x,y,w,h){const r=rng(200);g.strokeStyle='#b5ad8e';g.lineWidth=.6;for(let i=0;i<cols;i++){let xx=x+i*w/cols;g.beginPath();g.moveTo(xx,y+h);g.bezierCurveTo(xx+2,y+h+8,xx-2,y+h+15,xx+(r()-.5)*6,y+h+22+r()*15);g.stroke();}g.strokeStyle='#e0d7b4';g.lineWidth=1;g.beginPath();g.moveTo(x,y);g.lineTo(x,y+h);g.moveTo(x+w,y);g.lineTo(x+w,y+h);g.stroke();}
function draw(){if(!W)return;g.setTransform(D,0,0,D,0,0);g.fillStyle='#e9e1cf';g.fillRect(0,0,W,H);const sh=g.createRadialGradient(X+CW/2,Y+CH*.6,30,X+CW/2,Y+CH*.6,CW*.85);sh.addColorStop(0,'#b0a58a21');sh.addColorStop(1,'#b0a58a00');g.fillStyle=sh;g.fillRect(0,0,W,H);const pitch=CH/maxRows,hh=rows.length*pitch;
 if(!off){wood(X-35,Y-28,24,CH+87,true);wood(X+CW+11,Y-28,24,CH+87,true);wood(X-52,Y-31,CW+104,35);wood(X-52,Y+CH+20,CW+104,32);for(let i=0;i<cols;i++){let x=X+(i+.5)*CW/cols;g.strokeStyle=i%4===0?'#a09a7e':'#c1b89b';g.lineWidth=CW/cols*.47;g.beginPath();g.moveTo(x,Y);g.lineTo(x,Y+CH+22);g.stroke();g.strokeStyle='#faf4d47c';g.lineWidth=.7;g.beginPath();g.moveTo(x-1,Y);g.lineTo(x-1,Y+CH+22);g.stroke();}g.shadowBlur=7;g.shadowColor='#42371d4d';g.shadowOffsetY=4;g.drawImage(cloth,0,0,840,Math.max(1,rows.length*10),X,Y,CW,hh);g.shadowBlur=0;g.shadowOffsetY=0;clothEdges(X,Y,CW,hh);
 // The reed and the wooden shuttle move with the actual pass.
 const reedY=Y+hh+23;g.fillStyle='#bdad85';g.fillRect(X-15,reedY,CW+30,13);for(let i=0;i<cols;i++){g.fillStyle='#706d522d';g.fillRect(X+i*CW/cols,reedY,1,13);}const sx=busy?X+CW*(dir>0?pass:1-pass):X+(dir>0?0:CW),sy=Math.min(Y+CH-26,reedY+47);g.save();g.translate(sx,sy);const ww=CW*.25;g.shadowColor='#31281655';g.shadowBlur=8;g.shadowOffsetY=4;g.beginPath();g.moveTo(-ww/2,0);g.bezierCurveTo(-ww*.3,-20,ww*.25,-20,ww/2,0);g.bezierCurveTo(ww*.25,19,-ww*.3,19,-ww/2,0);g.fillStyle='#8a6441';g.fill();g.shadowBlur=0;rounded(-ww*.25,-8,ww*.5,16,6,colors[color]);g.strokeStyle='#e6c59a70';g.lineWidth=1;g.stroke();g.restore();if(busy){g.strokeStyle=colors[color];g.lineWidth=Math.max(2,pitch*.55);g.beginPath();g.moveTo(dir>0?X:X+CW,Y+hh+pitch*.5);g.lineTo(sx,Y+hh+pitch*.5);g.stroke();}
 }else{const finalH=Math.min(Math.max(190,hh),H-Y-180);g.save();g.translate(X+CW*.05,Y+48);g.rotate(-.06);g.shadowColor='#53462955';g.shadowBlur=24;g.shadowOffsetY=18;g.fillStyle='#b9ad8d';g.fillRect(0,0,CW,finalH);g.shadowBlur=0;g.shadowOffsetY=0;for(let y=0;y<finalH;y+=3){const t=y/finalH,dx=Math.sin(t*Math.PI*2)*9+Math.pow(t,3)*17;g.drawImage(cloth,0,Math.min(rows.length*10-1,y/finalH*rows.length*10),840,Math.max(1,rows.length*10/finalH*3),dx,y,CW,3.3);}clothEdges(0,0,CW,finalH);const fold=g.createLinearGradient(0,finalH*.6,0,finalH*.9);fold.addColorStop(0,'#ffffff00');fold.addColorStop(.38,'#f1e6c859');fold.addColorStop(.48,'#2329194d');fold.addColorStop(.63,'#ffffff16');fold.addColorStop(1,'#00000000');g.fillStyle=fold;g.fillRect(-5,finalH*.6,CW+35,finalH*.3);g.restore();g.save();g.translate(X+CW*.7,Y+finalH+106);g.rotate(.045);g.fillStyle='#f6eedb';g.fillRect(0,0,110,55);g.fillStyle='#566750';g.font='10px serif';g.fillText('織りの標本',14,22);g.font='8px sans-serif';g.fillText(rows.length+' PICKS / HANDWOVEN',14,39);g.restore();}
 frames++;}
function ui(){document.querySelector('main').classList.toggle('removed',off);document.getElementById('save').disabled=rows.length===0;document.getElementById('counter').textContent=String(rows.length).padStart(2,'0');document.getElementById('weave').disabled=busy||off||rows.length>=maxRows;document.getElementById('weave').innerHTML=rows.length>=maxRows?'一枚、織り上がりました':off?'織りの標本':busy?'杼が通っています':'杼を通す &nbsp; '+(dir>0?'→':'←');document.getElementById('release').textContent=off?'機に戻す':'布を外す';document.getElementById('release').disabled=busy||rows.length===0;document.getElementById('note').innerHTML=off?'一筋ごとの選択が、この布に。<br>保存して、新しい一枚へ。':'Spaceでも杼を通せます。<br>好きなところで、機から外せます。';}
