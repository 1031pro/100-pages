<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紙ひこうき</title>
<meta name="description" content="引いて放して投げる。押している間は機首上げ。上昇気流と切手を拾って、できるだけ遠くへ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;900&family=Kaisei+Decol:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #cfe6f5; font-family: "Zen Maru Gothic", sans-serif; color: #2a3340; user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; display: block; }
  .ui { position: fixed; inset: 0; pointer-events: none; }
  .top { position: absolute; left: 22px; top: 18px; display: flex; gap: 26px; align-items: baseline; }
  .top .d { font-family: "Kaisei Decol", serif; font-size: 44px; font-weight: 700; line-height: 1; }
  .top .d small { font-size: 16px; margin-left: 4px; font-family: "Zen Maru Gothic", sans-serif; }
  .top .s { font-size: 13px; letter-spacing: .1em; line-height: 1.6; opacity: .8; }
  .top .s b { font-size: 16px; }
  .title { position: absolute; right: 22px; top: 18px; text-align: right; }
  .title h1 { font-family: "Kaisei Decol", serif; font-size: 30px; letter-spacing: .1em; line-height: 1; }
  .title p { font-size: 11px; letter-spacing: .2em; opacity: .7; margin-top: 6px; }
  .msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(255,255,255,.78); backdrop-filter: blur(8px); padding: 28px 36px; border-radius: 22px; box-shadow: 0 20px 50px rgba(40,60,90,.18); transition: opacity .4s; max-width: 90vw; }
  .msg.hide { opacity: 0; }
  .msg h2 { font-family: "Kaisei Decol", serif; font-size: 28px; margin-bottom: 8px; }
  .msg p { font-size: 14px; line-height: 1.8; }
  .msg .big { font-family: "Kaisei Decol", serif; font-size: 54px; line-height: 1.1; margin: 8px 0; }
  .msg .rank { display: inline-block; background: #ffcf5c; padding: 3px 12px; border-radius: 999px; font-weight: 900; margin-top: 8px; }
  .stampcount { position: absolute; left: 22px; bottom: 18px; font-size: 13px; letter-spacing: .1em; display: flex; gap: 8px; align-items: center; }
  .stampcount i { display: inline-block; width: 18px; height: 22px; background: #e2474b; border: 2px dashed #fff; outline: 2px solid #e2474b; }
  .hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); font-size: 12px; letter-spacing: .15em; opacity: .7; white-space: nowrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="top"><div class="d"><span id="dist">0</span><small>m</small></div><div class="s">高度 <b id="alt">0</b> m<br>ベスト <b id="best">0</b> m</div></div>
  <div class="title"><h1>紙ひこうき</h1><p>PAPER PLANE · CANVAS PHYSICS</p></div>
  <div class="msg" id="msg"><h2>紙ひこうきを投げる</h2><p>飛行機を後ろに引いて、放す。<br>飛んでいる間に押すと機首が上がる（速度は落ちる）。<br>ゆらゆら上がる気流に乗ると高度が稼げる。赤い切手は +50 m。</p></div>
  <div class="stampcount"><i></i><span id="stamps">0</span> 枚</div>
  <div class="hint">ドラッグで投げる　　押して機首上げ　　R でやり直し</div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W, H, dpr;
  const resize = () => { dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  resize(); addEventListener('resize', resize);

  const distEl = document.getElementById('dist'), altEl = document.getElementById('alt'), bestEl = document.getElementById('best'), msg = document.getElementById('msg'), stampsEl = document.getElementById('stamps');
  const store = { get: () => { try { return +(localStorage.getItem('kamihikoki_best') || 0); } catch (e) { return 0; } }, set: (v) => { try { localStorage.setItem('kamihikoki_best', v); } catch (e) {} } };
  let best = store.get(); bestEl.textContent = best;

  // ワールド座標：x 右、y 上（m）。1m = 10px
  const S = 10;
  const START_Y = 40;
  const plane = { x: 0, y: START_Y, vx: 0, vy: 0, ang: 0, spin: 0 };
  let state = 'aim'; // aim | fly | done
  let drag = null, holding = false, stamps = 0, t = 0;
  const thermals = [], stampItems = [], birds = [], trail = [];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hash = (n) => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };

  const genWorld = (fromX) => {
    // 遠くに向けて気流・切手・鳥を配置
    while (thermals.length === 0 || thermals[thermals.length - 1].x < fromX + 600) {
      const lx = (thermals.length ? thermals[thermals.length - 1].x : 40) + rnd(80, 170);
      thermals.push({ x: lx, w: rnd(18, 34), h: rnd(70, 150), str: rnd(14, 24) });
    }
    while (stampItems.length === 0 || stampItems[stampItems.length - 1].x < fromX + 600) {
      const lx = (stampItems.length ? stampItems[stampItems.length - 1].x : 60) + rnd(45, 110);
      stampItems.push({ x: lx, y: rnd(8, 70), got: false });
    }
    while (birds.length === 0 || birds[birds.length - 1].x < fromX + 600) {
      const lx = (birds.length ? birds[birds.length - 1].x : 120) + rnd(90, 200);
      birds.push({ x: lx, y: rnd(10, 60), ph: Math.random() * 6.28, hit: false });
    }
  };
  genWorld(0);

  const reset = () => {
    plane.x = 0; plane.y = START_Y; plane.vx = 0; plane.vy = 0; plane.ang = 0; plane.spin = 0;
    state = 'aim'; stamps = 0; stampsEl.textContent = 0; trail.length = 0;
    thermals.length = 0; stampItems.length = 0; birds.length = 0; genWorld(0);
    msg.classList.remove('hide'); msg.innerHTML = '<h2>紙ひこうきを投げる</h2><p>飛行機を後ろに引いて、放す。<br>飛んでいる間に押すと機首が上がる（速度は落ちる）。<br>ゆらゆら上がる気流に乗ると高度が稼げる。赤い切手は +50 m。</p>';
  };

  // ---- 入力 ----
  const toWorld = (px, py) => ({ x: cam.x + (px - W * 0.3) / S, y: (H * 0.72 - py) / S + cam.y });
  const cam = { x: 0, y: 0 };
  addEventListener('pointerdown', (e) => {
    if (state === 'aim') { drag = { sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY }; msg.classList.add('hide'); }
    else if (state === 'fly') holding = true;
    else if (state === 'done') reset();
  });
  addEventListener('pointermove', (e) => { if (drag) { drag.x = e.clientX; drag.y = e.clientY; } });
  addEventListener('pointerup', (e) => {
    holding = false;
    if (drag && state === 'aim') {
      const dx = (drag.sx - drag.x), dy = (drag.sy - drag.y);
      const pw = Math.min(1, Math.hypot(dx, dy) / 220);
      if (pw > 0.08) { const a = Math.atan2(-dy, dx); const sp = 18 + pw * 30; plane.vx = Math.cos(a) * sp; plane.vy = Math.sin(a) * sp; plane.ang = a; state = 'fly'; }
      else msg.classList.remove('hide');
      drag = null;
    }
  });
  addEventListener('keydown', (e) => { if (e.key === 'r' || e.key === 'R') reset(); if (e.code === 'Space') holding = true; });
  addEventListener('keyup', (e) => { if (e.code === 'Space') holding = false; });

  // ---- 物理 ----
  const physics = (dt) => {
    const sp = Math.hypot(plane.vx, plane.vy) + 1e-6;
    const dir = Math.atan2(plane.vy, plane.vx);
    // 迎え角：機首角と進行方向の差
    let aoa = plane.ang - dir; aoa = Math.atan2(Math.sin(aoa), Math.cos(aoa));
    if (holding) plane.ang += 2.4 * dt; // 機首上げ
    // 機首は進行方向へ緩やかに戻る
    plane.ang += (dir - plane.ang) * (holding ? 0.3 : 1.8) * dt + plane.spin * dt;
    plane.spin *= 0.96;
    const cl = Math.max(-0.4, Math.min(1.5, Math.sin(Math.max(-0.6, Math.min(0.6, aoa)) * 2.2) + 0.5));
    const lift = 0.055 * sp * sp * cl;
    const dragF = (0.006 + Math.abs(aoa) * 0.05 + cl * cl * 0.004) * sp * sp;
    // 揚力は進行方向に垂直
    const nx = -Math.sin(dir), ny = Math.cos(dir);
    let ax = nx * lift - (plane.vx / sp) * dragF + 0.8, ay = ny * lift - (plane.vy / sp) * dragF - 9.8;
    // 上昇気流
    for (const th of thermals) if (Math.abs(plane.x - th.x) < th.w && plane.y < th.h) ay += th.str;
    plane.vx += ax * dt; plane.vy += ay * dt;
    plane.x += plane.vx * dt; plane.y += plane.vy * dt;
    // 切手
    for (const s of stampItems) if (!s.got && Math.hypot(plane.x - s.x, plane.y - s.y) < 2.2) { s.got = true; stamps++; stampsEl.textContent = stamps; plane.vx += 1.5; }
    // 鳥に当たるとスピン
    for (const b of birds) if (!b.hit && Math.hypot(plane.x - b.x, plane.y - (b.y + Math.sin(t * 2 + b.ph) * 1.5)) < 1.8) { b.hit = true; plane.spin += 6; plane.vx *= 0.6; }
    if (plane.y <= 0.3) { plane.y = 0.3; state = 'done'; finish(); }
    genWorld(plane.x);
    if (trail.length === 0 || Math.hypot(plane.x - trail[trail.length - 1][0], plane.y - trail[trail.length - 1][1]) > 0.8) { trail.push([plane.x, plane.y]); if (trail.length > 400) trail.shift(); }
  };
  const finish = () => {
    const d = Math.round(plane.x + stamps * 50);
    let rank = '紙';
    if (d > 300) rank = '折り目がきれい'; if (d > 600) rank = '校庭を越えた'; if (d > 1000) rank = '川を渡った'; if (d > 1600) rank = '町を越えた'; if (d > 2500) rank = '山を越えた'; if (d > 4000) rank = '伝説の一機';
    if (d > best) { best = d; store.set(best); bestEl.textContent = best; }
    msg.innerHTML = `<h2>着地</h2><div class="big">${d.toLocaleString()} m</div><p>飛距離 ${Math.round(plane.x)} m ＋ 切手 ${stamps} 枚 × 50 m</p><span class="rank">${rank}</span><p style="margin-top:12px;font-size:12px;opacity:.7">クリックでもう一度</p>`;
    msg.classList.remove('hide');
  };

  // ---- 描画 ----
  const sx = (x) => (x - cam.x) * S + W * 0.3;
  const sy = (y) => H * 0.72 - (y - cam.y) * S;
  const drawLayer = (seed, base, amp, step, color, par) => {
    ctx.fillStyle = color; ctx.beginPath();
    const ox = cam.x * par;
    ctx.moveTo(0, H);
    for (let px = 0; px <= W + step; px += step) {
      const wx = (px + ox * S) / S;
      const k = Math.floor(wx / 18);
      const h1 = hash(seed + k) * amp, h2 = hash(seed + k + 1) * amp;
      const f = (wx / 18 - k); const sm = f * f * (3 - 2 * f);
      const h = base + h1 + (h2 - h1) * sm;
      ctx.lineTo(px, sy(h) + cam.y * S * (1 - par) - (par - 1) * 0);
    }
    ctx.lineTo(W + step, H); ctx.closePath(); ctx.fill();
  };
  const draw = () => {
    // 空：距離で夕方へ
    const dusk = Math.min(1, plane.x / 3000);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, lerpC('#8ec5ea', '#3b3d7a', dusk)); g.addColorStop(0.6, lerpC('#d7ecf7', '#f08a6b', dusk)); g.addColorStop(1, lerpC('#fbf3e4', '#ffd39a', dusk));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // 太陽
    ctx.fillStyle = `rgba(255,220,140,${0.5 + dusk * 0.5})`; ctx.beginPath(); ctx.arc(W * 0.78 - cam.x * 0.2, H * (0.18 + dusk * 0.4), 40 + dusk * 30, 0, 6.28); ctx.fill();
    // 雲
    for (let i = 0; i < 9; i++) { const cx = ((i * 331 + 100) - cam.x * 3) % (W + 400) - 200; const cy = H * 0.1 + (i % 4) * 60 + cam.y * 2; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.ellipse(cx, cy, 70 + i * 6, 22, 0, 0, 6.28); ctx.fill(); }
    // 山・町（視差）
    drawLayer(1, 40, 70, 8, lerpC('#b9d1e2', '#5a5a92', dusk), 0.25);
    drawLayer(7, 22, 40, 8, lerpC('#8fb0c8', '#3f3f70', dusk), 0.5);
    drawLayer(13, 6, 16, 6, lerpC('#5f7f95', '#26264a', dusk), 0.8);
    // 上昇気流
    for (const th of thermals) {
      const x0 = sx(th.x - th.w), x1 = sx(th.x + th.w); if (x1 < -50 || x0 > W + 50) continue;
      const grd = ctx.createLinearGradient(0, sy(th.h), 0, sy(0)); grd.addColorStop(0, 'rgba(255,200,120,0)'); grd.addColorStop(1, 'rgba(255,200,120,.22)');
      ctx.fillStyle = grd; ctx.fillRect(x0, sy(th.h), x1 - x0, sy(0) - sy(th.h));
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      for (let k = 0; k < 14; k++) { const ph = (t * 0.6 + k * 0.37) % 1; const y = ph * th.h; const x = th.x + Math.sin(ph * 12 + k) * th.w * 0.6; ctx.beginPath(); ctx.arc(sx(x), sy(y), 2.2, 0, 6.28); ctx.fill(); }
    }
    // 地面と、投げる丘
    ctx.fillStyle = lerpC('#6f9d5c', '#2e4a3a', dusk); ctx.fillRect(0, sy(0), W, H);
    ctx.beginPath(); ctx.moveTo(sx(-400), sy(0)); ctx.lineTo(sx(-400), sy(START_Y - 2)); ctx.lineTo(sx(-2), sy(START_Y - 2)); ctx.quadraticCurveTo(sx(14), sy(START_Y - 4), sx(30), sy(0)); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.08)'; for (let px = -((cam.x * S) % 40); px < W; px += 40) ctx.fillRect(px, sy(0), 2, 6);
    // 切手
    for (const s of stampItems) { if (s.got) continue; const x = sx(s.x), y = sy(s.y + Math.sin(t * 3 + s.x) * 0.4); if (x < -30 || x > W + 30) continue; ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t + s.x) * 0.2); ctx.fillStyle = '#e2474b'; ctx.fillRect(-9, -11, 18, 22); ctx.strokeStyle = '#fff'; ctx.setLineDash([2, 2]); ctx.strokeRect(-6, -8, 12, 16); ctx.restore(); }
    // 鳥
    for (const b of birds) { const x = sx(b.x), y = sy(b.y + Math.sin(t * 2 + b.ph) * 1.5); if (x < -30 || x > W + 30) continue; ctx.strokeStyle = b.hit ? '#aaa' : '#2a3340'; ctx.lineWidth = 2; ctx.beginPath(); const f = Math.sin(t * 9 + b.ph) * 5; ctx.moveTo(x - 10, y - f); ctx.quadraticCurveTo(x - 4, y + 2, x, y); ctx.quadraticCurveTo(x + 4, y + 2, x + 10, y - f); ctx.stroke(); }
    // 軌跡
    if (trail.length > 1) { ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 6]); ctx.beginPath(); trail.forEach(([x, y], i) => i ? ctx.lineTo(sx(x), sy(y)) : ctx.moveTo(sx(x), sy(y))); ctx.stroke(); ctx.setLineDash([]); }
    // 飛行機
    const px = sx(plane.x), py = sy(plane.y);
    ctx.save(); ctx.translate(px, py); ctx.rotate(-plane.ang);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#7a8796'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(-16, -9); ctx.lineTo(-8, 0); ctx.lineTo(-16, 9); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(-8, 0); ctx.stroke();
    ctx.fillStyle = '#e9edf2'; ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(-16, 9); ctx.lineTo(-8, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
    // 引き
    if (drag) { const dx = drag.sx - drag.x, dy = drag.sy - drag.y; const pw = Math.min(1, Math.hypot(dx, dy) / 220); ctx.strokeStyle = 'rgba(42,51,64,.5)'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - dx * 0.6, py - dy * 0.6); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = '#e2474b'; ctx.fillRect(px - 60, py - 40, 120 * pw, 6); ctx.strokeStyle = '#2a3340'; ctx.lineWidth = 1; ctx.strokeRect(px - 60, py - 40, 120, 6); }
  };
  const lerpC = (a, b, k) => { const p = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; };

  let last = performance.now();
  const loop = (now) => {
    const dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
    if (state === 'fly') physics(dt);
    // カメラ追従
    cam.x += (plane.x - cam.x) * 0.12; cam.y += (Math.max(0, plane.y - 18) - cam.y) * 0.08;
    draw();
    distEl.textContent = Math.round(plane.x + stamps * 50); altEl.textContent = Math.max(0, Math.round(plane.y));
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
