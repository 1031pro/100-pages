<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホテル山彦 エレベーター</title>
<meta name="description" content="階ボタンを押すと建物が動く。各階の扉が開くと、その階の話が読める。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+Antique:wght@400;700;900&family=Bodoni+Moda:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root { --brass: #c9a24a; --brass2: #8c6b21; --walnut: #3b2416; --cream: #f1e7d0; --fh: 72vh; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #12100e; color: var(--cream);
    font-family: "Zen Kaku Gothic Antique", "Hiragino Sans", sans-serif;
    user-select: none;
  }
  .scene { position: fixed; inset: 0; perspective: 1200px; }

  /* 建物（動く側） */
  .building {
    position: absolute; left: 0; right: 0; top: 50%;
    transform: translateY(calc(var(--fh) * -0.5 - var(--floor) * var(--fh)));
    transition: transform var(--dur, 2s) cubic-bezier(.45,0,.2,1);
  }
  .floor { height: var(--fh); position: relative; display: grid; grid-template-columns: 1fr 260px 1fr; }
  .floor .room { position: relative; overflow: hidden; border-bottom: 10px solid #0a0908; }
  .floor .room::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18%; background: linear-gradient(to top, rgba(0,0,0,.35), transparent); }
  .floor .num {
    position: absolute; left: 24px; top: 20px; font-family: "Bodoni Moda", serif; font-size: 90px; font-weight: 600; opacity: .12; line-height: 1;
  }
  .floor .shaft { background: repeating-linear-gradient(to bottom, #1a1613 0 40px, #221c17 40px 44px); border-left: 8px solid #2a2320; border-right: 8px solid #2a2320; position: relative; }
  .floor .shaft::before, .floor .shaft::after { content: ""; position: absolute; top: 0; bottom: 0; width: 6px; background: linear-gradient(to right, #6a5a3a, #d2b876, #6a5a3a); }
  .floor .shaft::before { left: 30px; } .floor .shaft::after { right: 30px; }
  /* 各階の外扉（開閉） */
  .floor .door { position: absolute; left: 8px; right: 8px; top: 12%; bottom: 8%; display: flex; z-index: 2; }
  .floor .door i { flex: 1; background: linear-gradient(to right, #6c5320, #d9bd6a 40%, #b8973f 60%, #6c5320); transition: transform 1.1s cubic-bezier(.7,0,.3,1); border: 2px solid #3d2d10; }
  .floor.open .door i:first-child { transform: translateX(-100%); }
  .floor.open .door i:last-child { transform: translateX(100%); }
  .floor .frame { position: absolute; left: 0; right: 0; top: 12%; bottom: 8%; border: 10px solid var(--brass); border-image: linear-gradient(#e2c777, #8c6b21) 1; z-index: 3; pointer-events: none; }
  .floor .frame::before { content: attr(data-f); position: absolute; left: 50%; top: -38px; transform: translateX(-50%); font-family: "Bodoni Moda", serif; font-size: 20px; color: var(--brass); letter-spacing: .1em; }

  /* 部屋のイラスト（CSSのみ） */
  .r-b1 { background: #1b1f22; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 2px, transparent 2px 40px); }
  .r-b1 .pipe { position: absolute; left: 0; right: 0; height: 22px; background: linear-gradient(#6b7075, #2c3033); }
  .r-b1 .pipe:nth-child(1) { top: 22%; } .r-b1 .pipe:nth-child(2) { top: 40%; height: 14px; }
  .r-b1 .glow { position: absolute; right: 12%; bottom: 18%; width: 160px; height: 120px; background: radial-gradient(circle at 50% 100%, #ff7a2a, #7a1e00 50%, transparent 72%); filter: blur(6px); animation: fire 1.3s ease-in-out infinite alternate; }
  @keyframes fire { to { transform: scaleY(1.15); opacity: .8; } }
  .r-1 { background: #d9c7a6; background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.06) 0 20px, transparent 20px 40px); }
  .r-1 .desk { position: absolute; left: 14%; bottom: 18%; width: 46%; height: 26%; background: var(--walnut); border-top: 10px solid #5b3a24; }
  .r-1 .clock { position: absolute; right: 16%; top: 16%; width: 90px; height: 90px; border-radius: 50%; background: #f7f1e1; border: 8px solid var(--brass); }
  .r-1 .clock::before, .r-1 .clock::after { content: ""; position: absolute; left: 50%; top: 50%; background: #222; transform-origin: 0 50%; height: 3px; }
  .r-1 .clock::before { width: 28px; transform: rotate(-60deg); } .r-1 .clock::after { width: 36px; transform: rotate(35deg); animation: min 60s linear infinite; }
  @keyframes min { to { transform: rotate(395deg); } }
  .r-2 { background: #4a2b1f; background-image: radial-gradient(circle at 50% 50%, rgba(255,210,120,.12), transparent 60%); }
  .r-2 .lamp { position: absolute; top: 0; width: 4px; height: 24%; background: #222; }
  .r-2 .lamp::after { content: ""; position: absolute; left: -40px; bottom: -30px; width: 84px; height: 34px; background: #e0b35a; border-radius: 4px 4px 40px 40px; box-shadow: 0 30px 60px 20px rgba(255,200,100,.25); }
  .r-2 .lamp:nth-child(1) { left: 28%; } .r-2 .lamp:nth-child(2) { left: 62%; }
  .r-2 .table { position: absolute; bottom: 20%; left: 20%; width: 60%; height: 8px; background: #2c1912; border-radius: 4px; }
  .r-2 .cup { position: absolute; bottom: 22%; left: 45%; width: 30px; height: 22px; background: #fff; border-radius: 0 0 8px 8px; }
  .r-2 .steam { position: absolute; bottom: 30%; left: 47%; width: 20px; height: 40px; border-left: 2px solid rgba(255,255,255,.4); border-radius: 50%; animation: steam 2.4s ease-in-out infinite; }
  @keyframes steam { 0% { transform: translateY(0) scaleX(1); opacity: .6 } 100% { transform: translateY(-30px) scaleX(-1); opacity: 0 } }
  .r-3 { background: #7c8b9a; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0 2px, transparent 2px 28px); }
  .r-3 .bed { position: absolute; left: 18%; bottom: 18%; width: 54%; height: 30%; background: #f4efe6; border-radius: 8px 8px 0 0; box-shadow: inset 0 -30px 0 #b9c6d3; }
  .r-3 .pillow { position: absolute; left: 22%; bottom: 40%; width: 18%; height: 8%; background: #fff; border-radius: 6px; }
  .r-3 .window { position: absolute; right: 12%; top: 14%; width: 26%; height: 40%; background: linear-gradient(#26324a, #6d84a8); border: 8px solid #f4efe6; }
  .r-3 .moon { position: absolute; right: 18%; top: 20%; width: 22px; height: 22px; border-radius: 50%; background: #fff3c4; box-shadow: 0 0 20px #fff3c4; }
  .r-4 { background: #5a1f27; background-image: radial-gradient(circle at 50% 0, rgba(255,220,180,.25), transparent 50%); }
  .r-4 .chan { position: absolute; left: 50%; top: 8%; transform: translateX(-50%); width: 160px; height: 60px; border-radius: 0 0 80px 80px; background: radial-gradient(circle at 50% 30%, #fff5cf, #d9b45a 60%, transparent 62%); box-shadow: 0 40px 80px rgba(255,220,150,.35); }
  .r-4 .stage { position: absolute; left: 0; right: 0; bottom: 18%; height: 12%; background: #2b0d12; }
  .r-4 .mic { position: absolute; left: 50%; bottom: 30%; width: 3px; height: 70px; background: #999; }
  .r-4 .mic::before { content: ""; position: absolute; top: -14px; left: -8px; width: 20px; height: 20px; border-radius: 50%; background: #444; }
  .r-5 { background: #2f3a2a; background-image: repeating-linear-gradient(90deg, #5a3a22 0 14px, #7a4f2e 14px 22px, #4a2e1a 22px 30px, #8a6238 30px 36px, transparent 36px 40px); }
  .r-5 .shelf { position: absolute; left: 0; right: 0; height: 6px; background: #1d1410; }
  .r-5 .shelf:nth-child(1) { top: 30%; } .r-5 .shelf:nth-child(2) { top: 55%; } .r-5 .shelf:nth-child(3) { top: 80%; }
  .r-5 .chair { position: absolute; right: 18%; bottom: 18%; width: 70px; height: 80px; background: #7b2c2c; border-radius: 12px 12px 0 0; }
  .r-6 { background: linear-gradient(#0a1030, #1c2a5a 60%, #3c5a8a); }
  .r-6 .plant { position: absolute; bottom: 18%; width: 6px; height: 120px; background: #2f7a3a; }
  .r-6 .plant::before, .r-6 .plant::after { content: ""; position: absolute; width: 60px; height: 24px; background: #3f9a4a; border-radius: 60% 0; }
  .r-6 .plant::before { left: 4px; top: 20px; transform: rotate(-20deg); } .r-6 .plant::after { right: 4px; top: 50px; transform: rotate(200deg); }
  .r-6 .plant:nth-child(1) { left: 20%; } .r-6 .plant:nth-child(2) { left: 45%; height: 160px; } .r-6 .plant:nth-child(3) { left: 70%; height: 90px; }
  .r-6 .stars { position: absolute; inset: 0; background: radial-gradient(circle at 20% 30%, #fff 0 1px, transparent 2px), radial-gradient(circle at 60% 20%, #fff 0 1px, transparent 2px), radial-gradient(circle at 80% 40%, #fff 0 1px, transparent 2px), radial-gradient(circle at 40% 10%, #fff 0 1px, transparent 2px); }
  .r-7 { background: linear-gradient(#b9d8f0, #f6e3c8 70%, #f0b98a); }
  .r-7 .city { position: absolute; left: 0; right: 0; bottom: 18%; height: 40%; background: repeating-linear-gradient(90deg, #6a7a8a 0 30px, transparent 30px 40px, #55657a 40px 80px, transparent 80px 95px); -webkit-mask: linear-gradient(to top, #000 60%, transparent); mask: linear-gradient(to top, #000 60%, transparent); }
  .r-7 .sun { position: absolute; right: 20%; top: 20%; width: 80px; height: 80px; border-radius: 50%; background: #ff9e5c; box-shadow: 0 0 60px #ffb07a; }
  .r-7 .bird { position: absolute; left: 30%; top: 30%; width: 24px; height: 10px; border: 2px solid #333; border-width: 2px 0 0 0; border-radius: 50% 50% 0 0; animation: fly 6s linear infinite; }
  @keyframes fly { to { transform: translateX(300px) translateY(-40px); } }

  /* カゴ（固定） */
  .cab {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 244px; height: calc(var(--fh) * 0.8); z-index: 5;
    background: linear-gradient(to bottom, #3b2416, #24140b); border: 6px solid var(--brass2);
    box-shadow: 0 0 0 2px #1a1109, 0 40px 80px rgba(0,0,0,.7);
    display: flex; flex-direction: column;
  }
  .cab .indicator {
    height: 54px; background: #0b0a09; color: #ff6b2b; font-family: "Bodoni Moda", serif; font-size: 30px;
    display: flex; align-items: center; justify-content: center; letter-spacing: .1em; text-shadow: 0 0 10px #ff6b2b;
    border-bottom: 3px solid var(--brass2);
  }
  .cab .indicator .arrow { font-size: 18px; margin-right: 10px; opacity: 0; transition: opacity .3s; }
  .cab.up .indicator .arrow.u, .cab.down .indicator .arrow.d { opacity: 1; }
  .cab .inner { flex: 1; position: relative; overflow: hidden; background: repeating-linear-gradient(90deg, #4a2e1a 0 30px, #3a2212 30px 32px); }
  .cab .inner::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(201,162,74,.35); }
  .cab .cabdoor { position: absolute; inset: 0; display: flex; z-index: 3; }
  .cab .cabdoor i { flex: 1; background: linear-gradient(to right, #6c5320, #d9bd6a 40%, #b8973f 60%, #6c5320); transition: transform 1.1s cubic-bezier(.7,0,.3,1); border: 2px solid #3d2d10; }
  body.open .cab .cabdoor i:first-child { transform: translateX(-100%); }
  body.open .cab .cabdoor i:last-child { transform: translateX(100%); }
  .cab .story { position: absolute; inset: 0; padding: 26px 22px; display: flex; flex-direction: column; justify-content: flex-end; z-index: 2; opacity: 0; transition: opacity .8s .6s; }
  body.open .cab .story { opacity: 1; }
  .cab .story h2 { font-size: 22px; font-weight: 900; letter-spacing: .06em; }
  .cab .story h2 small { display: block; font-family: "Bodoni Moda", serif; font-style: italic; font-weight: 400; font-size: 13px; color: var(--brass); letter-spacing: .2em; margin-bottom: 6px; }
  .cab .story p { font-size: 13px; line-height: 1.85; margin-top: 10px; color: #e6d9be; }
  .cab .moving { position: absolute; inset: 0; z-index: 4; display: none; place-items: center; font-family: "Bodoni Moda", serif; font-style: italic; color: var(--brass); font-size: 14px; letter-spacing: .3em; }
  body.moving .cab .moving { display: grid; }
  body.moving .cab .inner { animation: shake .12s linear infinite; }
  @keyframes shake { 50% { transform: translateY(1px); } }

  /* パネル */
  .panel {
    position: fixed; right: 28px; top: 50%; transform: translateY(-50%); z-index: 6;
    width: 92px; padding: 18px 12px; background: linear-gradient(#d8c48e, #a8873f); border: 3px solid #5c4212; border-radius: 8px;
    box-shadow: 0 20px 40px rgba(0,0,0,.6), inset 0 1px 0 #f4e8c2;
    display: grid; gap: 10px; justify-items: center;
  }
  .panel .lbl { font-family: "Bodoni Moda", serif; font-size: 10px; letter-spacing: .3em; color: #3d2a08; }
  .panel button {
    width: 54px; height: 54px; border-radius: 50%; border: 3px solid #5c4212; background: radial-gradient(circle at 35% 30%, #fff5d8, #c9a24a 70%);
    font-family: "Bodoni Moda", serif; font-size: 20px; font-weight: 600; color: #2a1a05; cursor: pointer;
    box-shadow: 0 4px 0 #5c4212, 0 6px 8px rgba(0,0,0,.4); transition: transform .08s, box-shadow .08s;
  }
  .panel button:active, .panel button.lit { transform: translateY(3px); box-shadow: 0 1px 0 #5c4212; }
  .panel button.lit { background: radial-gradient(circle at 35% 30%, #fff, #ffb347 70%); box-shadow: 0 1px 0 #5c4212, 0 0 18px #ffb347; }
  .panel .alarm { width: 36px; height: 36px; background: #b3262c; border-color: #4a0d10; font-size: 10px; color: #fff; }

  .title { position: fixed; left: 28px; top: 26px; z-index: 6; }
  .title h1 { font-family: "Bodoni Moda", serif; font-size: 26px; letter-spacing: .12em; color: var(--brass); }
  .title p { font-size: 12px; letter-spacing: .2em; color: rgba(241,231,208,.6); margin-top: 6px; }
  .cert { position: fixed; left: 28px; bottom: 26px; z-index: 6; font-size: 10px; letter-spacing: .15em; color: rgba(241,231,208,.45); line-height: 1.8; border: 1px solid rgba(201,162,74,.3); padding: 8px 12px; }

  @media (max-width: 820px) {
    .floor { grid-template-columns: 1fr 200px 1fr; }
    .cab { width: 190px; }
    .panel { right: 10px; width: 74px; padding: 12px 8px; }
    .panel button { width: 44px; height: 44px; font-size: 16px; }
    .cab .story h2 { font-size: 18px; } .cab .story p { font-size: 12px; }
    .cert { display: none; }
  }
</style>
</head>
<body class="open">

<div class="scene">
  <div class="building" id="building" style="--floor:1"></div>
  <div class="cab" id="cab">
    <div class="indicator"><span class="arrow u">▲</span><span class="arrow d">▼</span><span id="ind">1</span></div>
    <div class="inner">
      <div class="cabdoor"><i></i><i></i></div>
      <div class="story"><h2 id="sTitle"></h2><p id="sText"></p></div>
      <div class="moving">— 移動中 —</div>
    </div>
  </div>
</div>

<div class="title"><h1>HOTEL YAMABIKO</h1><p>ホテル山彦　昭和四十二年開業</p></div>
<div class="panel" id="panel"><div class="lbl">FLOOR</div></div>
<div class="cert">昇降機検査済　定員 9名 600kg<br>次回検査 まだ決まっていません</div>

<script>
(() => {
  const floors = [
    { f: 'B1', cls: 'r-b1', html: '<div class="pipe"></div><div class="pipe"></div><div class="glow"></div>', title: 'ボイラー室', en: 'BASEMENT', text: '館内の湯はすべてここで沸く。ボイラーマンの佐々木さんは四十年間、朝五時に火を入れている。壁に貼られた温度の記録は、一日も欠けていない。' },
    { f: '1', cls: 'r-1', html: '<div class="desk"></div><div class="clock"></div>', title: 'ロビー', en: 'LOBBY', text: '振り子時計は三分進んでいる。開業以来ずっとそうで、直すと客が電車に遅れる、というのが支配人の言い分だ。' },
    { f: '2', cls: 'r-2', html: '<div class="lamp"></div><div class="lamp"></div><div class="table"></div><div class="cup"></div><div class="steam"></div>', title: '喫茶 やまびこ', en: 'TEA ROOM', text: 'ナポリタンとクリームソーダ。窓際の席には、毎週火曜に同じ本を持ってくる人がいる。読み終わらないのではなく、読み終わりたくないのだと思う。' },
    { f: '3', cls: 'r-3', html: '<div class="window"></div><div class="moon"></div><div class="bed"></div><div class="pillow"></div>', title: '客室 306', en: 'GUEST ROOM', text: '角部屋。窓から山が見える。枕元のメモ帳には、前の客が書いた「また来ます」の一枚目だけが残っている。二枚目は持ち帰られた。' },
    { f: '4', cls: 'r-4', html: '<div class="chan"></div><div class="stage"></div><div class="mic"></div>', title: '宴会場 鳳凰の間', en: 'BANQUET HALL', text: 'シャンデリアの電球は百二十個。結婚式が終わると、支配人が必ず一つだけ消して帰る。理由は誰も知らない。' },
    { f: '5', cls: 'r-5', html: '<div class="shelf"></div><div class="shelf"></div><div class="shelf"></div><div class="chair"></div>', title: '図書室', en: 'LIBRARY', text: '客が置いていった本だけで出来た図書室。持ち帰るのは自由だが、代わりに一冊置いていく決まり。蔵書は毎年少しずつ入れ替わる。' },
    { f: '6', cls: 'r-6', html: '<div class="stars"></div><div class="plant"></div><div class="plant"></div><div class="plant"></div>', title: '屋上庭園 前室', en: 'ROOF GARDEN', text: '夜になると、ここで山の空気を入れ替える。植木はどれも、開業のときに社員が持ち寄ったものの子孫だ。' },
    { f: '7', cls: 'r-7', html: '<div class="sun"></div><div class="bird"></div><div class="city"></div>', title: '展望室', en: 'OBSERVATORY', text: '晴れた日には海が見える、と案内にはある。開業以来、見えた日は三回。三回とも、台風の翌日だった。' },
  ];
  const building = document.getElementById('building');
  const panel = document.getElementById('panel');
  const ind = document.getElementById('ind');
  const cab = document.getElementById('cab');
  const sTitle = document.getElementById('sTitle'), sText = document.getElementById('sText');

  // 建物は上階が上に来るよう、逆順で積む
  const order = floors.slice().reverse();
  order.forEach((fl, k) => {
    const d = document.createElement('div');
    d.className = 'floor'; d.dataset.i = floors.indexOf(fl);
    d.innerHTML = `<div class="room ${fl.cls}"><div class="num">${fl.f}</div>${fl.html}</div><div class="shaft"><div class="door"><i></i><i></i></div><div class="frame" data-f="${fl.f}"></div></div><div class="room ${fl.cls}" style="opacity:.55"></div>`;
    building.appendChild(d);
  });
  const floorEls = [...building.children];
  const elOf = (i) => floorEls.find(x => +x.dataset.i === i);

  // --floor: 上からの位置（0=最上階）
  const posOf = (i) => floors.length - 1 - i;

  floors.slice().reverse().forEach((fl) => {
    const b = document.createElement('button'); b.textContent = fl.f; b.dataset.i = floors.indexOf(fl);
    panel.appendChild(b);
  });
  const alarm = document.createElement('button'); alarm.className = 'alarm'; alarm.textContent = '非常'; panel.appendChild(alarm);
  alarm.addEventListener('click', () => { alarm.textContent = '…'; setTimeout(() => alarm.textContent = '非常', 1200); });

  // 音
  let ac;
  const ding = () => {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime;
      [[880, 0], [1174, 0.18]].forEach(([f, d]) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(0.18, t + d + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 1.2);
        o.start(t + d); o.stop(t + d + 1.3);
      });
    } catch (e) {}
  };

  let cur = 1, busy = false;
  const show = (i) => { const fl = floors[i]; sTitle.innerHTML = `<small>${fl.en}</small>${fl.title}`; sText.textContent = fl.text; ind.textContent = fl.f; };
  const setOpen = (i, on) => { const e = elOf(i); if (e) e.classList.toggle('open', on); document.body.classList.toggle('open', on); };

  const go = async (i) => {
    if (busy || i === cur) return;
    busy = true;
    const btn = panel.querySelector(`button[data-i="${i}"]`); btn.classList.add('lit');
    setOpen(cur, false);
    await wait(1150);
    const dist = Math.abs(i - cur); const dur = 0.9 + dist * 0.55;
    building.style.setProperty('--dur', dur + 's');
    document.body.classList.add('moving'); cab.classList.add(i > cur ? 'up' : 'down');
    building.style.setProperty('--floor', posOf(i));
    // 表示階を順に更新
    const from = cur, step = i > cur ? 1 : -1;
    for (let k = 1; k <= dist; k++) { await wait(dur * 1000 / dist); ind.textContent = floors[from + step * k].f; }
    await wait(150);
    document.body.classList.remove('moving'); cab.classList.remove('up', 'down');
    cur = i; ding(); show(i); setOpen(i, true); btn.classList.remove('lit');
    busy = false;
  };
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  panel.addEventListener('click', (e) => { const b = e.target.closest('button[data-i]'); if (b) go(+b.dataset.i); });
  addEventListener('keydown', (e) => { if (e.key === 'ArrowUp') go(Math.min(floors.length - 1, cur + 1)); if (e.key === 'ArrowDown') go(Math.max(0, cur - 1)); });

  building.style.setProperty('--dur', '0s');
  building.style.setProperty('--floor', posOf(cur));
  show(cur); setOpen(cur, true);
  requestAnimationFrame(() => building.style.setProperty('--dur', '2s'));
})();
</script>
</body>
</html>
