function animate(next){if(busy)return;busy=true;progress=0;document.getElementById('ink').disabled=true;document.getElementById('print').disabled=true;const start=performance.now();if(next===2){phase=2;paperDraw();}function tick(now){progress=rm.matches?1:Math.min(1,(now-start)/(next===1?1100:1450));draw();if(progress<1)raf=requestAnimationFrame(tick);else{busy=false;phase=next;document.getElementById('ink').disabled=phase>=1;document.getElementById('print').disabled=phase!==1;document.getElementById('save').disabled=phase!==2;document.getElementById('status').textContent=phase===1?'インクがのりました。紙を重ねて、一度だけ押す。':'刷り上がり。かすれも、その一枚のことば。';draw();}}tick(start);}function reset(){cancelAnimationFrame(raf);busy=false;phase=0;progress=0;parse();document.getElementById('print').disabled=true;document.getElementById('save').disabled=true;document.getElementById('status').textContent='版の文字は、裏返し。まだインクは付いていない。';draw();}words.oninput=reset;pressure.oninput=()=>{if(phase===2){paperDraw();draw();}};document.querySelectorAll('[data-ink]').forEach(e=>e.onclick=()=>{ink=+e.dataset.ink;document.querySelectorAll('[data-ink]').forEach(b=>b.setAttribute('aria-pressed',String(b===e)));reset();});document.getElementById('ink').onclick=()=>animate(1);document.getElementById('print').onclick=()=>animate(2);document.getElementById('reset').onclick=()=>{edition++;document.getElementById('edition').textContent='PROOF No. '+String(edition).padStart(2,'0');reset();};document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='letterpress-'+edition+'.png';a.href=paper.toDataURL();a.click();};c.onkeydown=e=>{if(e.key==='Enter'||e.code==='Space'){e.preventDefault();if(phase<2&&!document.getElementById('ink').disabled||phase===1)animate(phase+1);}};function resize(){const r=c.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;draw();}parse();new ResizeObserver(resize).observe(c);resize();window.artworkState=()=>({number:22,
