*{box-sizing:border-box}body{margin:0;background:#c89462;color:#f6ebd4;font-family:"Noto Serif CJK JP","Yu Mincho",serif}main{height:100svh;min-height:650px;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%}header{position:absolute;top:28px;left:4%;right:4%;display:flex;justify-content:space-between;align-items:center;font-family:sans-serif;font-size:9px;letter-spacing:.16em;color:#70523d}a{color:inherit;text-decoration:none}.home{font-family:serif;font-size:18px}h1{position:absolute;bottom:12%;left:5%;font-size:clamp(37px,5.5vw,80px);font-weight:400;letter-spacing:.11em;line-height:1.6;margin:0;text-shadow:0 1px 20px #6a3e3322}h1 small{display:block;font:10px Georgia,serif;letter-spacing:.3em;margin-top:18px}.observation{position:absolute;right:5%;bottom:20%;writing-mode:vertical-rl;font-size:12px;letter-spacing:.22em;line-height:2.3;color:#f4e5c7}footer{position:absolute;bottom:25px;left:5%;right:5%;display:flex;align-items:end;justify-content:space-between;gap:15px;font-size:10px;letter-spacing:.1em}footer p{margin:0;line-height:2}.tools{display:flex;gap:12px;font-family:sans-serif}button{font:inherit;font-size:9px;background:#58493225;border:1px solid #fff0d144;color:inherit;cursor:pointer;min-height:41px;padding:11px 16px}button:hover{background:#58493265}button:focus-visible,a:focus-visible{outline:2px solid #fff4cd;outline-offset:4px}.error{position:absolute;left:5%;top:80px;font-size:11px;color:#694634;max-width:300px;line-height:1.8}@media(max-width:600px){main{min-height:700px}header{left:7%;right:7%;top:24px;font-size:8px}.home{font-size:16px}h1{left:7%;font-size:35px;bottom:17%;letter-spacing:.05em}h1 small{font-size:8px;letter-spacing:.16em}.observation{right:7%;bottom:32%;font-size:10px}footer{left:7%;right:7%;bottom:25px;font-size:8px}.tools{gap:6px}button{padding:10px}.tools button span{display:none}}
</style></head><body><main><canvas id="desert" role="img" aria-label="午後四時の砂丘。陽の当たる稜線と青紫の影。小さな隊列が遠い尾根を越えていく。風が砂の表面を流れる。"></canvas><header><a class="home" href="../index.html">← 百景</a><span>020 / 100 · ASTRA</span><span>AFTER THE HEAT</span></header><h1>砂丘、十六時<small>NOTHING HERE IS STILL.</small></h1><p class="observation">足跡は、<br>風の方が覚えている。</p><footer><p>16:08<br>西風 3.2 m/s</p><div class="tools"><button id="sound" aria-pressed="false">風の音<span>を聴く</span></button><button id="pause" aria-pressed="false">時間を止める</button></div></footer></main><script>
(()=>{'use strict';const c=document.getElementById('desert'),g=c.getContext('2d',{alpha:false}),terrain=document.createElement('canvas'),rm=matchMedia('(prefers-reduced-motion: reduce)');let W,H,D,time=0,frames=0,paused=rm.matches,last=0,raf=0,webgl=false,audio=null,sound=false;const TAU=Math.PI*2;let terrainCtx;const gridSize=801,gridStep=.25,grid=new Float32Array(gridSize*gridSize);function init(){webgl=false;terrainCtx=terrain.getContext('2d',{alpha:false});for(let z=0;z<gridSize;z++)for(let x=0;x<gridSize;x++)grid[z*gridSize+x]=height(x*gridStep-100,z*gridStep-30);}function lookup(x,z){const xx=(x+100)/gridStep,zz=(z+30)/gridStep,ix=Math.floor(xx),iz=Math.floor(zz);if(ix<0||iz<0||ix>=gridSize-1||iz>=gridSize-1)return height(x,z);const fx=xx-ix,fz=zz-iz,i=iz*gridSize+ix;return(grid[i]*(1-fx)+grid[i+1]*fx)*(1-fz)+(grid[i+gridSize]*(1-fx)+grid[i+gridSize+1]*fx)*fz;}function renderTerrain(){const q=Math.min(1,1100/W,800/H);terrain.width=Math.round(W*q);terrain.height=Math.round(H*q);const w=terrain.width,h=terrain.height,img=terrainCtx.createImageData(w,h),pixels=img.data,sun=norm([-.67,.38,.65]);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ux=(x-w*.5)/h,uy=(h*.5-y)/h;let dx=ww[0]*1.65+ux*uu[0]+uy*vv[0],dy=ww[1]*1.65+ux*uu[1]+uy*vv[1],dz=ww[2]*1.65+ux*uu[2]+uy*vv[2],mag=Math.hypot(dx,dy,dz);dx/=mag;dy/=mag;dz/=mag;let blend=Math.max(0,Math.min(1,(dy+.04)/.25));blend=blend*blend*(3-2*blend);let col=[.94+(.70-.94)*blend,.78+(.77-.78)*blend,.57+(.75-.57)*blend],t=.2,hit=false,px=0,py=0,pz=0;if(dy<.24)for(let j=0;j<220;j++){px=cam[0]+dx*t;py=cam[1]+dy*t;pz=cam[2]+dz*t;const distance=py-lookup(px,pz);if(distance<.008){hit=true;break;}t+=Math.max(.04,distance*.5);if(t>650)break;}if(hit){const e=.16;let nx=lookup(px-e,pz)-lookup(px+e,pz),ny=2*e,nz=lookup(px,pz-e)-lookup(px,pz+e),nm=Math.hypot(nx,ny,nz);nx/=nm;ny/=nm;nz/=nm;const ripple=Math.sin(px*27+pz*9+Math.sin(pz*1.1)*1.6),close=Math.max(0,1-(t-8)/45);nx+=ripple*.019*close;nz+=ripple*.008*close;let light=Math.max(0,nx*sun[0]+ny*sun[1]+nz*sun[2]),cast=1;for(let j=1;j<17;j++){let d=j*.38;if(py+sun[1]*d<lookup(px+sun[0]*d,pz+sun[2]*d)+.027){cast=.14;break;}}let u=Math.max(0,Math.min(1,(light*cast-.01)/.77));u=u*u*(3-2*u);const grit=((Math.sin(px*192.7+pz*391.7)*43758.54)%1)*.017*close;col=[.34+(.90-.34)*u,.34+(.64-.34)*u,.40+(.36-.40)*u];const fog=(1-Math.exp(-t*.018))*.98;for(let k=0;k<3;k++)col[k]=(col[k]+[.12,.065,.02][k]*(light*cast)**3+grit+ripple*.003*close*light)*(1-fog)+[.88,.72,.56][k]*fog;}if(!hit&&dy<0)col=[.88,.72,.56];const i=(y*w+x)*4;pixels[i]=Math.min(255,Math.pow(col[0],.94)*255);pixels[i+1]=Math.min(255,Math.pow(col[1],.94)*255);pixels[i+2]=Math.min(255,Math.pow(col[2],.94)*255);pixels[i+3]=255;}terrainCtx.putImageData(img,0,0);}
function height(x,z){const crest=4+6*Math.sin(z*.043)+z*.055,d=x-crest;return 5.8*Math.exp(-Math.pow(Math.abs(d/(d<0?17:5.4)),1.24))+1.5*Math.sin(z*.042)+.38*Math.sin(x*.11-z*.08)+.75*Math.sin(z*.065+x*.06);}
function sub(a,b){return a.map((v,i)=>v-b[i]);}function norm(a){let d=Math.hypot(...a);return a.map(v=>v/d);}function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}function dot(a,b){return a.reduce((s,v,i)=>s+v*b[i],0);}const cam=[8,7,-18],ww=norm(sub([-2,1,18],cam)),uu=norm(cross(ww,[0,1,0])),vv=cross(uu,ww);function project(x,y,z){let v=sub([x,y,z],cam),d=dot(v,ww);return[W*.5+dot(v,uu)/d*1.65*H,H*.5-dot(v,vv)/d*1.65*H,1.65*H/d];}
function walker(x,z,k){const p=project(x,height(x,z),z),s=p[2]*.15;if(p[0]<-20||p[0]>W+20)return;const step=Math.sin(time*2.2+k);g.save();g.translate(p[0],p[1]);g.fillStyle='#654e405e';g.beginPath();g.ellipse(s*2.4,s*.3,s*3.7,s*.2,-.12,0,TAU);g.fill();g.scale(s,s);g.strokeStyle='#574d42';g.lineWidth=.23;g.beginPath();g.moveTo(-.2,-1.7);g.lineTo(-.3+step*.25,0);g.moveTo(.2,-1.7);g.lineTo(.3-step*.25,0);g.stroke();g.fillStyle=k===0?'#b55d44':'#655e4a';g.beginPath();g.moveTo(-.3,-3);g.lineTo(.35,-3);g.lineTo(.55,-1.15);g.lineTo(-.46,-1.28);g.fill();g.fillStyle='#5e4c3d';g.beginPath();g.arc(0,-3.35,.32,0,TAU);g.fill();g.fillStyle='#d9c095';g.fillRect(-.39,-3.5,.7,.22);g.strokeStyle='#6b523f';g.lineWidth=.13;g.beginPath();g.moveTo(.4,-2.5);g.lineTo(.9,-1.85);g.lineTo(1.05,.05);g.stroke();g.restore();}
function draw(){g.setTransform(D,0,0,D,0,0);g.drawImage(terrain,0,0,W,H);// Tracks near the viewer predate the visible walkers; each gust erases a little more.
 const erase=Math.min(1,time/56);for(let j=0;j<54;j++){const z=-7+j*.56,x=-8+j*.065+Math.sin(j*.06)*.6;for(const side of [-1,1]){const xx=x+side*.09,zz=z+(side>0?.20:0),p=project(xx,height(xx,zz)+.01,zz),age=(53-j)/53,fade=Math.max(0,1-erase*(1.2+age*.8));if(fade>0){const qx=project(xx+.065,height(xx+.065,zz)+.012,zz),qz=project(xx,height(xx,zz+.18)+.012,zz+.18);g.save();g.transform(qx[0]-p[0],qx[1]-p[1],qz[0]-p[0],qz[1]-p[1],p[0],p[1]);g.fillStyle='rgba(48,43,48,'+fade*.21+')';g.beginPath();g.ellipse(0,0,1,1,0,0,TAU);g.fill();g.restore();}}}
 // A broad moving veil of wind-blown sand crosses the slope and the fading tracks.
 const gust=(time%72)/72;g.save();g.beginPath();const edge=[];for(let x=-35;x<=30;x+=1){const z=2+gust*22,p=project(x,height(x,z)+.08,z);edge.push(p);}g.moveTo(0,H);for(const p of edge)g.lineTo(p[0],p[1]);g.lineTo(W,H);g.closePath();g.clip();const sx=W*(-.7+gust*2.4),mist=g.createLinearGradient(sx,0,sx+W*.65,H*.15);mist.addColorStop(0,'#e5c69400');mist.addColorStop(.46,'#e5c69424');mist.addColorStop(.55,'#e5c69430');mist.addColorStop(1,'#e5c69400');g.fillStyle=mist;g.fillRect(0,0,W,H);g.restore();const travel=Math.min(time*.023,8);for(let i=0;i<3;i++){const x=-5+travel-i*.65,z=23+i*.5;for(let j=0;j<Math.min(35,time*.5);j++){const xx=x-j*.085,zz=z+(j%2)*.06,p=project(xx,height(xx,zz)+.003,zz);g.fillStyle='rgba(109,76,50,'+(.21-j*.004)+')';g.beginPath();g.ellipse(p[0],p[1],.5,.9,-.5,0,TAU);g.fill();}walker(x,z,i);}
 // Low drifting sand follows the same wind; no decorative floating particles.
 g.save();g.globalCompositeOperation='screen';for(let i=0;i<48;i++){let x=((i*97+time*(6+i%4))%(W+180))-90,y=H*(.43+(i%19)/32),len=16+i%8*7;g.strokeStyle='rgba(238,200,146,'+(.015+(i%5)*.006)+')';g.lineWidth=.6;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+len*.5,y-2,x+len,y+1);g.stroke();}g.restore();frames++;}
function resize(){const r=c.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,1.6);c.width=W*D;c.height=H*D;renderTerrain();draw();}function tick(now){raf=0;if(!paused&&!document.hidden){time+=Math.min(.1,(now-last)/1000||0);draw();}last=now;if(!paused&&!document.hidden)raf=requestAnimationFrame(tick);}function pause(v){paused=v;document.getElementById('pause').textContent=v?'時間を再開':'時間を止める';document.getElementById('pause').setAttribute('aria-pressed',String(v));cancelAnimationFrame(raf);raf=0;if(!v){last=performance.now();raf=requestAnimationFrame(tick);}if(audio)audio.gain.gain.setTargetAtTime(sound&&!v?.045:0,audio.ctx.currentTime,.3);}document.getElementById('pause').onclick=()=>pause(!paused);document.getElementById('sound').onclick=async()=>{if(!audio){const ctx=new(window.AudioContext||window.webkitAudioContext)(),buffer=ctx.createBuffer(1,ctx.sampleRate*5,ctx.sampleRate),data=buffer.getChannelData(0);let n=0;for(let i=0;i<data.length;i++){n=(n+(Math.random()*2-1)*.04)/1.02;data[i]=n*3;}const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();source.buffer=buffer;source.loop=true;filter.type='lowpass';filter.frequency.value=480;gain.gain.value=0;source.connect(filter).connect(gain).connect(ctx.destination);source.start();audio={ctx,gain};}await audio.ctx.resume();sound=!sound;document.getElementById('sound').setAttribute('aria-pressed',String(sound));document.getElementById('sound').textContent=sound?'音を止める':'風の音を聴く';audio.gain.gain.setTargetAtTime(sound&&!paused?.045:0,audio.ctx.currentTime,.6);};rm.addEventListener('change',e=>pause(e.matches));document.addEventListener('visibilitychange',()=>{if(document.hidden){if(audio)audio.ctx.suspend();}else{if(audio&&sound)audio.ctx.resume();if(!paused){last=performance.now();if(!raf)raf=requestAnimationFrame(tick);}}});init();new ResizeObserver(resize).observe(c);resize();pause(paused);window.artworkState=()=>({number:20,time,frames,paused,sound,renderer:"cpu-heightfield",trackVisibility:Math.max(0,1-time/56),reducedMotion:rm.matches});})();
</script></body></html>
